/* ═══════════════════════════════════════════════════════════════
   เช็ค Mirror ของไฟล์เจาะ  (v6.0 · ย้ายมาจากโปรแกรม MPR Mirror Check)
   ปัญหา  : ไฟล์ .mpr บางไฟล์ถูกบันทึกมาเป็น VIEW="XMIRROR"
            ค่านี้เป็นแค่มุมมองใน WoodWOP แต่เครื่องบางตัวอ่านผิดแล้วเจาะกลับข้าง
            ตัวสั่งกระจกจริงคือ GP / GY = 1 เจอแล้วเตือนเฉย ๆ ไม่แก้ให้
   ทางเดิน: เลือกโฟลเดอร์เจาะ -> takeNames() ได้รายชื่อ .mpr พร้อมของที่ใช้เปิดไฟล์
            -> mirStart() -> mirRun() อ่านเฉพาะ 8 KB แรกของทุกไฟล์ ขนาน 12 งาน
            -> เก็บผลไว้ที่ t.mirror -> mirPaint() วาดในกล่อง · drawTable() ระบายม่วง
            ไม่ต้องไล่โฟลเดอร์ซ้ำ ใช้รายชื่อชุดเดียวกับที่เช็คไฟล์เจาะ
   แก้ไฟล์: mirFix() เปลี่ยนเฉพาะบรรทัด VIEW เป็น VIEW="NOMIRROR" ไม่แตะพิกัดเจาะ
            สำรองต้นฉบับเป็น ชื่อไฟล์.mpr.bak ก่อน (มี .bak อยู่แล้วไม่ทับ)
            แก้ได้เฉพาะโฟลเดอร์ที่เปิดผ่านปุ่ม เลือกโฟลเดอร์ หรือลากมาวางใน Chrome/Edge
            ทางสำรอง (input) เบราว์เซอร์ไม่ให้สิทธิ์เขียน จึงเช็คได้อย่างเดียว
   ตัดออกจากโปรแกรมเดิม: โหมดลบบรรทัด VIEW ทิ้ง และโหมดเขียนลงโฟลเดอร์ปลายทาง
   ═══════════════════════════════════════════════════════════════ */
const MIR_HEAD  = 8192;     // อ่านแค่หัวไฟล์ · VIEW / GP / GY อยู่ในบล็อก [H ต้นไฟล์
const MIR_LANES = 12;       // อ่านขนานกี่ไฟล์ · สำคัญมากเวลาอ่านผ่าน network drive
const MIR_WAIT  = 30000;    // ไฟล์ไหนเปิดไม่จบในเวลานี้ ข้ามแล้วนับเป็นอ่านไม่ได้
const MIR_MAX   = 5000;     // เกินนี้ไม่ไล่อ่าน น่าจะเลือกโฟลเดอร์กว้างเกิน
const LS_MBAK   = "imosviewer_mirror_bak";   // จำว่าติ๊กสำรอง .bak ไว้ไหม
let mirSeq = 0;             // เลขรอบ · รอบเก่าที่อ่านค้างอยู่จะรู้ตัวว่าถูกแทนแล้ว

/* อ่านค่าที่ใช้ตัดสินจากหัวไฟล์ (ตัดทอนจาก parseMPR ของโปรแกรมเดิม กฎเหมือนเดิม) */
function mirParse(text){
  const r = { view: "", gp: "", gy: "", kind: "n" };
  String(text || "").split(/\r?\n/).forEach(raw => {
    const l = raw.trim();
    let m;
    if (!r.view && (m = l.match(/^VIEW\s*=\s*"?([^"]*)"?/i))) r.view = m[1].trim();
    if (!r.gp && (m = l.match(/^GP\s*=\s*"?([^"]*)"?/))) r.gp = m[1].trim();
    if (!r.gy && (m = l.match(/^GY\s*=\s*"?([^"]*)"?/))) r.gy = m[1].trim();
  });
  const v = r.view.toUpperCase();
  r.kind = v.includes("XMIRROR") ? "x"
         : v.includes("YMIRROR") ? "y"
         : (v === "" || v === "NOMIRROR" || v === "STANDARD" || v === "NORMAL") ? "n" : "y";
  return r;
}

/* ชื่อที่โชว์ = พาธย่อย + ชื่อไฟล์ */
const mirName = it => (it.p ? it.p + "/" : "") + it.n;
/* เลขบาร์โค้ดในชื่อไฟล์ · กฎเดียวกับ codesFromNames */
const mirCodes = n => String(n).replace(/\.[^.]+$/, "").match(/\d{6,}/g) || [];

/* เปิดไฟล์จากของที่ตัวเดินโฟลเดอร์เก็บไว้
   fresh = ขอใหม่จากดิสก์ · หลังแก้ไฟล์แล้ว File ตัวเดิมที่ถือไว้จะอ่านไม่ได้ */
async function mirFile(it, fresh){
  if (!fresh && it.f) return it.f;
  if (it.h) return await it.h.getFile();
  if (it.e) return await new Promise((res, rej) => it.e.file(res, rej));
  if (it.f) return it.f;
  throw new Error("ไม่มีทางเปิดไฟล์นี้");
}

/* กันค้าง · network drive บางทีเปิดไฟล์ค้างไม่ตอบ */
function mirTimeout(p, ms, label){
  let tm;
  return Promise.race([
    Promise.resolve(p).finally(() => clearTimeout(tm)),
    new Promise((_, rej) => { tm = setTimeout(() =>
      rej(new Error("หมดเวลา " + Math.round(ms / 1000) + " วิ ที่ " + label)), ms); })
  ]);
}

/* คิวขนาน n งาน */
async function mirPool(items, n, worker, onDone){
  let i = 0, done = 0;
  const out = new Array(items.length);
  const lane = async () => {
    while (i < items.length){
      const k = i++;
      try{ out[k] = await worker(items[k]); }catch(_){ out[k] = null; }
      onDone(++done);
    }
  };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, lane));
  return out;
}

/* ไล่อ่านหัวไฟล์ .mpr ทุกไฟล์ แล้วเก็บผลไว้ที่ t.mirror
   ถ้าระหว่างอ่านมีรอบใหม่หรือเปิดไฟล์ BOM ใหม่แทรก ผลรอบนี้ทิ้ง (คืน null) */
async function mirRun(t, list, src, fresh, onStep){
  const id = ++mirSeq;
  t.mirRun = id;
  const res = { at: new Date(), from: src.label || "", root: src.root || null,
                items: list, files: [], over: false, ms: 0, log: [] };
  const t0 = performance.now();
  if (list.length > MIR_MAX){
    res.over = true;
  } else if (list.length){
    const one = async (it, again) => {
      const f = await mirTimeout(mirFile(it, again), MIR_WAIT, it.n);
      return mirParse(await mirTimeout(f.slice(0, MIR_HEAD).text(), MIR_WAIT, it.n));
    };
    const out = await mirPool(list, MIR_LANES, async it => {
      try{ return Object.assign({ it }, await one(it, fresh)); }
      catch(e1){
        /* File ที่ถือไว้ตั้งแต่ตอนไล่โฟลเดอร์อาจเก่าไปแล้ว ลองขอใหม่อีกครั้ง */
        if (!fresh && (it.h || it.e)){
          try{ return Object.assign({ it }, await one(it, true)); }catch(_){}
        }
        return { it, view: "", gp: "", gy: "", kind: "e",
                 err: (e1 && ((e1.name && e1.name !== "Error" ? e1.name + ": " : "") + e1.message)) || String(e1) };
      }
    }, done => onStep && onStep(done, list.length));
    /* เรียงตามชื่อ รายการในกล่องกับลำดับตอนแก้จะได้คงที่ ไม่ขึ้นกับลำดับที่ Windows ส่งมา */
    res.files = out.filter(Boolean).sort((a, b) => mirName(a.it).localeCompare(mirName(b.it), "th", { numeric: true }));
  }
  res.ms = performance.now() - t0;
  if (t.mirRun !== id) return null;
  t.mirror = res;
  return res;
}

/* บาร์โค้ด -> ชื่อไฟล์ ของไฟล์ที่ยังเป็น XMIRROR · ไม่มีเลยคืน null */
function mirXMap(t){
  if (!t || !t.mirror) return null;
  const map = new Map();
  t.mirror.files.forEach(r => {
    if (r.kind === "x") mirCodes(r.it.n).forEach(c => map.set(c, mirName(r.it)));
  });
  return map.size ? map : null;
}
const mirCount = (t, k) => t && t.mirror ? t.mirror.files.filter(r => r.kind === k).length : 0;

/* บาร์โค้ด -> "PartId PartName" ในไฟล์ BOM ใช้บอกว่าไฟล์เจาะเป็นชิ้นไหน */
function mirParts(t){
  const { b1, b2 } = drillCols(t);
  const pid = colIdx(t, "PartId"), pn = colIdx(t, "PartName");
  const m = new Map();
  t.rows.forEach(r => [b1, b2].forEach(ci => {
    if (ci < 0) return;
    const v = String(r[ci] ?? "").trim();
    if (!v || m.has(v)) return;
    const s = ((pid >= 0 ? String(r[pid] ?? "").trim() : "") + " " +
               (pn >= 0 ? String(r[pn] ?? "").trim() : "")).trim();
    m.set(v, s || "อยู่ใน BOM นี้");
  }));
  /* ช่องที่ถูกล้างไปแล้วตอนเช็คเจาะ ยังรู้ได้จากเลขเดิมที่เก็บไว้ */
  if (t.drill) t.drill.undo.forEach(([ri, , v]) => {
    if (m.has(v)) return;
    const r = t.rows[ri];
    m.set(v, ((pid >= 0 ? String(r[pid] ?? "").trim() : "") + " " +
              (pn >= 0 ? String(r[pn] ?? "").trim() : "")).trim() || "อยู่ใน BOM นี้");
  });
  return m;
}

/* ไบต์ <-> สตริงทีละไบต์ · แก้ไฟล์แบบนี้ไม่ต้องถอดรหัสตัวอักษรเลย
   คอมเมนต์ภาษาไทยในไฟล์ (Windows-874) และ CRLF จึงออกมาเหมือนเดิมทุกไบต์ */
function mirBin(u8){
  let s = "";
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return s;
}
function mirBytes(s){
  const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 0xFF;
  return u;
}
/* แทนบรรทัด VIEW บรรทัดแรก (ตัวเดียวกับที่ mirParse อ่าน) · ยอมแก้เฉพาะตอนที่ยังเป็น XMIRROR */
function mirPatch(bin){
  const re = /(^|\n)([ \t]*)VIEW[ \t]*=[ \t]*"?[^"\r\n]*"?[ \t]*(?=\r?\n|$)/i;
  const m = bin.match(re);
  if (!m) return { bin, changed: false, why: "ไม่พบบรรทัด VIEW" };
  if (!/XMIRROR/i.test(m[0])) return { bin, changed: false, why: "ไม่ใช่ XMIRROR แล้ว (" + m[0].trim() + ")" };
  const to = 'VIEW="NOMIRROR"';
  const out = bin.replace(re, () => m[1] + m[2] + to);
  return { bin: out, changed: out !== bin, from: m[0].trim(), to };
}

/* เขียนทับไฟล์ XMIRROR ทีละไฟล์ · limit = แก้แค่กี่ไฟล์ (0 = ทั้งหมด) */
async function mirFix(t, limit, bak, log){
  const m = t.mirror;
  let todo = m.files.filter(r => r.kind === "x" && r.it.h);
  if (limit) todo = todo.slice(0, limit);
  const out = { ok: 0, bad: 0, nb: 0, n: todo.length };
  for (const r of todo){
    const it = r.it, name = mirName(it);
    try{
      const f = await mirTimeout(it.h.getFile(), MIR_WAIT, it.n);
      const raw = new Uint8Array(await f.arrayBuffer());
      const p = mirPatch(mirBin(raw));
      if (!p.changed){ out.bad++; log("ข้าม  " + name + " — " + p.why, "bad"); continue; }
      /* สำรองต้นฉบับก่อน · สำรองไม่สำเร็จ = ไม่เขียนทับ (โยนออกไปที่ catch) */
      if (bak && it.d){
        let had = true;
        try{ await it.d.getFileHandle(it.n + ".bak"); }catch(_){ had = false; }
        if (!had){
          const bw = await (await it.d.getFileHandle(it.n + ".bak", { create: true })).createWritable();
          await bw.write(raw); await bw.close();
          out.nb++;
        }
      }
      const w = await it.h.createWritable();
      await w.write(mirBytes(p.bin)); await w.close();
      r.view = "NOMIRROR"; r.kind = "n"; r.fixed = true; it.f = null;
      out.ok++;
      log("OK   " + name + "   " + p.from + "  →  " + p.to, "ok");
    }catch(e){
      out.bad++;
      log("พลาด " + name + " — " + ((e && ((e.name || "") + " " + e.message)) || e), "bad");
    }
  }
  return out;
}

/* แท็บไหนเป็นเจ้าของผล · ใช้กันวาดผลของแท็บหนึ่งลงกล่องของอีกแท็บ */
const mirTab = t => Object.keys(TABS).find(k => TABS[k] === t) || "";

/* เริ่มอ่านหัวไฟล์ · วาดความคืบหน้าในกล่อง แล้ววาดผลเมื่อจบ */
function mirStart(t, items, src, fresh){
  const list = (items || []).filter(it => /\.mpr$/i.test(it.n));
  t.mirBusy = { done: 0, total: list.length };
  mirPaint(t);
  let last = 0;
  return mirRun(t, list, src, !!fresh, (done, total) => {
    t.mirBusy = { done, total };
    const now = performance.now();
    if (done < total && now - last < 120) return;   // ไม่วาดถี่จนหน้าจอหน่วง
    last = now;
    const box = $("dmir");
    if (!box || box.dataset.tab !== mirTab(t) || !$("mirnow")) return;
    $("mirnow").textContent = done.toLocaleString("th-TH");
    $("mirfill").className = "bfill";
    $("mirfill").style.width = (total ? done / total * 100 : 0).toFixed(1) + "%";
  }).then(res => {
    t.mirBusy = null;
    if (res && T() === t && t.rows.length){ syncDrillBtn(); apply(); }
    mirPaint(t);
  }, e => {
    t.mirBusy = null;
    const box = $("dmir");
    if (box && box.dataset.tab === mirTab(t))
      box.innerHTML = '<h5>เช็ค Mirror</h5><div class="dmiss">อ่านหัวไฟล์ไม่สำเร็จ: ' + esc(e.message || e) + "</div>";
  });
}

/* วาดกล่อง Mirror ลงใน #dmir แล้วผูกปุ่ม · เรียกซ้ำได้ทุกครั้งที่ผลเปลี่ยน */
function mirPaint(t){
  const box = $("dmir");
  if (!box || box.dataset.tab !== mirTab(t)) return;
  const n0 = v => Number(v).toLocaleString("th-TH");

  if (t.mirBusy){
    const b = t.mirBusy;
    box.innerHTML = '<h5>เช็ค Mirror <em>กำลังอ่านหัวไฟล์ .mpr</em></h5>' +
      '<div class="bnum" style="margin:8px 0 7px"><b id="mirnow">' + n0(b.done) + "</b> / " +
      n0(b.total) + " ไฟล์</div>" +
      '<div class="btrack"><div class="' + (b.done ? "bfill" : "bfill idle") + '" id="mirfill"' +
      (b.done ? ' style="width:' + (b.done / b.total * 100).toFixed(1) + '%"' : "") + "></div></div>";
    return;
  }

  const m = t.mirror;
  if (!m){
    box.innerHTML = '<h5>เช็ค Mirror</h5><p class="dnote">เลือกโฟลเดอร์หรือลากโฟลเดอร์มาวาง ' +
      "โปรแกรมจะเปิดอ่านหัวไฟล์ .mpr ทุกไฟล์ด้วย ว่ามีไฟล์ไหนตั้ง <b>VIEW=XMIRROR</b> ไว้ " +
      "ซึ่งเครื่องบางตัวอ่านแล้วเจาะกลับข้าง · ถ้าวางเลขเองในช่องข้างล่าง เช็ค Mirror ไม่ได้ เพราะไม่มีไฟล์ให้เปิด</p>";
    return;
  }

  const head = '<h5>เช็ค Mirror <em>' + esc(m.from) + " · เช็คเมื่อ " +
    m.at.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }) +
    (m.files.length ? " · ใช้เวลา " + (m.ms / 1000).toFixed(1) + " วิ" : "") + "</em>" +
    (m.items.length && !m.over ? ' <button class="dlink" id="mirre">อ่านซ้ำ</button>' : "") + "</h5>";

  if (m.over){
    box.innerHTML = head + '<div class="dmiss">มีไฟล์ .mpr ' + n0(m.items.length) + " ไฟล์ เกินเพดาน " +
      n0(MIR_MAX) + " ไฟล์ จึงไม่ไล่อ่าน — โฟลเดอร์ที่เลือกน่าจะกว้างเกิน ลองเลือกเฉพาะโฟลเดอร์งานใบนี้</div>";
    return;
  }
  if (!m.items.length){
    box.innerHTML = head + '<p class="dnote">ไม่พบไฟล์ .mpr ในที่เลือกมา จึงไม่มีอะไรให้เช็ค Mirror</p>';
    return;
  }

  const xs = m.files.filter(r => r.kind === "x");
  const ys = m.files.filter(r => r.kind === "y");
  const es = m.files.filter(r => r.kind === "e");
  const ns = m.files.filter(r => r.kind === "n");
  const fx = m.files.filter(r => r.fixed);
  const gw = r => r.gp === "1" || r.gy === "1";
  const gps = m.files.filter(r => r.kind !== "e" && gw(r));
  const parts = mirParts(t);
  const sbox = (v, cls, cap) => "<div><b" + (cls ? ' class="' + cls + '"' : "") + ">" + n0(v) +
    "</b><i>" + cap + "</i></div>";

  /* รายการที่ต้องดู: XMIRROR ก่อน แล้ว Mirror อื่น อ่านไม่ได้ ตั้ง GP/GY และที่เพิ่งแก้ */
  const seen = new Set();
  const show = [...xs, ...ys, ...es, ...gps, ...fx].filter(r => !seen.has(r) && seen.add(r));
  const row = r => {
    const code = r.it.n.replace(/\.[^.]+$/, "");
    const part = mirCodes(r.it.n).map(c => parts.get(c)).find(Boolean);
    const sub = [];
    if (r.it.p) sub.push("อยู่ใน " + esc(r.it.p));
    if (r.err) sub.push("อ่านไม่ได้: " + esc(r.err));
    if (r.fixed) sub.push("แก้แล้ว → VIEW=\"NOMIRROR\"");
    if (gw(r)) sub.push("‼ ตั้ง GP/GY = 1 คือสั่งสร้าง NC แบบกระจกจริง ตรวจกับต้นทางก่อนแก้");
    return '<div class="mirow' + (r.fixed ? " ok" : "") + '">' +
      '<span class="c">' + esc(code) + "</span>" +
      '<span class="p" title="' + esc(part || "").replace(/"/g, "&quot;") + '">' + (part ? esc(part) : '<i style="color:var(--faint)">ไม่พบใน BOM นี้</i>') + "</span>" +
      '<span class="v">' + (r.kind === "e" ? "อ่านไม่ได้" : esc(r.view || "—")) +
        (r.gp === "1" ? '<span class="w">GP=1</span>' : "") +
        (r.gy === "1" ? '<span class="w">GY=1</span>' : "") + "</span>" +
      (sub.length ? '<span class="s">' + sub.join("  ·  ") + "</span>" : "") + "</div>";
  };

  let html = head +
    '<div class="dstat">' +
      sbox(m.files.length, "", "ไฟล์ .mpr ที่อ่านหัว") +
      sbox(xs.length, xs.length ? "mir" : "keep", "XMIRROR") +
      sbox(ys.length, "", "Mirror อื่น (YMIRROR ฯลฯ)") +
      sbox(ns.length, "keep", "ปกติ") +
    "</div>";

  if (!xs.length && !ys.length && !es.length){
    html += '<p class="dnote" style="color:var(--ok)">ไม่มีไฟล์ไหนตั้ง Mirror ไว้ — ใช้ได้ทั้ง ' +
      n0(m.files.length) + " ไฟล์" + (fx.length ? " (รวมที่เพิ่งแก้ " + n0(fx.length) + " ไฟล์)" : "") + "</p>";
  }
  if (show.length){
    html += '<div class="mirlist">' + show.slice(0, 300).map(row).join("") +
      (show.length > 300 ? '<div class="mirow"><span class="s">… อีก ' + n0(show.length - 300) + " ไฟล์</span></div>" : "") +
      "</div>";
  }
  if (xs.length){
    html += '<p class="dnote">VIEW=XMIRROR เป็นค่ามุมมองใน WoodWOP ไม่ควรมีผลกับการเจาะ ' +
      "แต่เครื่องที่อ่านค่านี้ผิดจะเจาะกลับข้าง — แก้โดยเปลี่ยนเป็น NOMIRROR ไม่ต้องแตะพิกัด " +
      "· บาร์โค้ดของไฟล์เหล่านี้ระบายม่วงในตาราง</p>";
    if (m.root){
      const bak0 = localStorage.getItem(LS_MBAK) !== "0";
      html +=
        '<label class="dryline"><input type="checkbox" id="mirok"> ' +
        "ยืนยันให้เขียนทับไฟล์เจาะในโฟลเดอร์ <b>" + esc(m.from) + "</b> — " +
        "เปลี่ยนเฉพาะบรรทัด VIEW เป็น NOMIRROR ไม่แตะพิกัดเจาะ" +
        (xs.some(gw) ? " (มี " + xs.filter(gw).length + " ไฟล์ที่ตั้ง GP/GY = 1 ด้วย ตรวจกับต้นทางก่อน)" : "") +
        "</label>" +
        '<div class="mirfix">' +
          '<button class="cbtn" id="mirfix1" disabled>ทดสอบแก้ 1 ไฟล์</button>' +
          '<button class="cbtn warn" id="mirfixall" disabled>แก้ XMIRROR ทั้ง ' + n0(xs.length) + " ไฟล์</button>" +
          '<label><input type="checkbox" id="mirbak"' + (bak0 ? " checked" : "") + "> สำรองต้นฉบับเป็น .bak ก่อน</label>" +
        "</div>";
    } else {
      html += '<p class="dnote">แก้ไฟล์จากตรงนี้ไม่ได้ เพราะเปิดโฟลเดอร์ผ่านทางสำรอง เบราว์เซอร์ให้อ่านอย่างเดียว ' +
        "— ใช้ Chrome หรือ Edge กดปุ่ม <b>เลือกโฟลเดอร์…</b> แล้วเลือกโฟลเดอร์เดิมอีกครั้ง</p>";
    }
  }
  html += '<div class="mirlog' + (m.log.length ? " on" : "") + '" id="mirlog">' +
    m.log.map(([c, s]) => '<div class="' + c + '">' + esc(s) + "</div>").join("") + "</div>";
  box.innerHTML = html;
  if ($("mirlog")) $("mirlog").scrollTop = $("mirlog").scrollHeight;

  if ($("mirre")) $("mirre").onclick = () => mirStart(t, m.items, { label: m.from, root: m.root }, true);
  if (!$("mirok")) return;
  $("mirok").onchange = () => {
    const on = $("mirok").checked && !t.mirFixing;
    $("mirfix1").disabled = !on;
    $("mirfixall").disabled = !on;
  };
  const go = async limit => {
    if (t.mirFixing || !$("mirok").checked) return;
    const bak = $("mirbak").checked;
    /* ขอสิทธิ์เขียนก่อนอย่างอื่น ระหว่างที่ยังอยู่ในจังหวะคลิก ไม่งั้นเบราว์เซอร์ไม่ยอมเด้งถาม */
    try{
      if (m.root.queryPermission &&
          (await m.root.queryPermission({ mode: "readwrite" })) !== "granted" &&
          (await m.root.requestPermission({ mode: "readwrite" })) !== "granted"){
        return toast("ไม่ได้รับสิทธิ์เขียนไฟล์ใน " + m.root.name);
      }
    }catch(e){ return toast("ขอสิทธิ์เขียนไฟล์ไม่สำเร็จ: " + (e.message || e)); }

    localStorage.setItem(LS_MBAK, bak ? "1" : "0");
    t.mirFixing = true;
    ["mirfix1", "mirfixall", "mirok", "mirbak"].forEach(id => { if ($(id)) $(id).disabled = true; });
    const log = (msg, cls) => {
      m.log.push([cls || "", msg]);
      const el = $("mirlog");
      if (!el) return;
      el.classList.add("on");
      el.insertAdjacentHTML("beforeend", '<div class="' + (cls || "") + '">' + esc(msg) + "</div>");
      el.scrollTop = el.scrollHeight;
    };
    log("เริ่มแก้ " + (limit ? "1 ไฟล์ (ทดสอบ)" : xs.length + " ไฟล์") +
                " · VIEW=\"NOMIRROR\" · " + (bak ? "สำรอง .bak" : "ไม่สำรอง .bak"));
    const t0 = performance.now();
    let res;
    try{ res = await mirFix(t, limit, bak, log); }
    finally{ t.mirFixing = false; }
    log("เสร็จ · สำเร็จ " + res.ok + " ไฟล์ · ข้าม/พลาด " + res.bad + " ไฟล์" +
        (res.nb ? " · สำรอง .bak " + res.nb + " ไฟล์" : "") +
        " · ใช้เวลา " + ((performance.now() - t0) / 1000).toFixed(1) + " วิ", res.bad ? "bad" : "ok");
    if (T() === t && t.rows.length){ syncDrillBtn(); apply(); }
    mirPaint(t);
    toast(res.bad ? "แก้สำเร็จ " + res.ok + " ไฟล์ · พลาด " + res.bad + " ไฟล์ ดูรายละเอียดในกล่อง"
                  : "แก้ VIEW เป็น NOMIRROR แล้ว " + res.ok + " ไฟล์");
  };
  $("mirfix1").onclick = () => go(1);
  $("mirfixall").onclick = () => go(0);
}

$("drill").onclick = () => {
  const t = T();

  /* เช็คไปแล้ว — กดปุ่มคือขอดูผลย้อนหลัง */

    const d = t.drill;
    $("mtitle").textContent = "เช็คไฟล์เจาะไปแล้ว";
    $("mbody").innerHTML =
      '<p style="font-size:13px;color:var(--dim);line-height:1.7">' +
      "ล้างช่องที่ไม่มีเจาะไปแล้ว <b>" + d.n + "</b> ช่อง ใน <b>" + d.nrows + "</b> แถว " +
      "เมื่อ " + d.at.toLocaleTimeString("th-TH") +

      '<p class="dnote">ช่องที่ถูกล้างขึ้นพื้นแดงในตาราง เอาเมาส์ชี้เพื่อดูเลขเดิม \u00B7 ' +
      "กดปุ่ม เฉพาะแถวที่แก้ เพื่อไล่ดูเฉพาะแถวที่โดน</p>" +
      (d.orphan.length
        ? '<div class="dmiss"><b>' + d.orphan.length +
          " เลขในไฟล์เจาะที่ไม่พบใน BOM นี้</b><br>" +
          d.orphan.slice(0, 40).map(esc).join("  ") +
          (d.orphan.length > 40 ? "  \u2026" : "") + "</div>"
        : "") +
      /* v6.0: ผลเช็ค Mirror ของรอบนั้น · แก้ไฟล์ต่อจากตรงนี้ได้ */

        ? '<div class="dmir" id="dmir" data-tab="' + mirTab(t) + '" style="margin:12px 0 0"></div>'
        : "");
    $("mfoot").innerHTML =
      '<span class="note">ล้างบาร์โค้ดแก้เฉพาะในหน้าจอนี้ ไม่แตะไฟล์ BOM ต้นฉบับ</span><span class="sp"></span>' +
      '<button class="cbtn undo" id="drundo">ย้อนกลับทั้งหมด</button>' +
      '<button class="cbtn primary" id="drclose">ปิด</button>';
    $("drclose").onclick = closeModal;
    $("drundo").onclick = () => {
      const n = undoDrill(t); closeModal(); syncDrillBtn(); apply();
      toast("คืนเลขบาร์โค้ดกลับแล้ว " + n + " ช่อง");
    };
    $("modal").className = "on";
    mirPaint(t);
    return;
  }

  const { b1, b2 } = drillCols(t);
  if (b1 < 0 && b2 < 0) return toast("แท็บนี้ไม่มีคอลัมน์ Barcode");

  const nMan = t.rows.filter(r =>
    [b1, b2].some(ci => ci >= 0 && String(r[ci] ?? "").trim() && !/^\d+$/.test(String(r[ci]).trim()))
  ).length;

  /* เลขงานของ BOM ที่เปิดอยู่ ใช้ทั้งประกอบพาธและเทียบกับโฟลเดอร์ที่เลือกมา */
  const bomCodes = [];
  t.rows.forEach(r => [b1, b2].forEach(ci => {
    if (ci < 0) return;
    const v = String(r[ci] ?? "").trim();
    if (/^\d+$/.test(v)) bomCodes.push(v);
  }));
  const bomJobs = jobsOf(bomCodes).map(j => j[0]);
  const job = jobFolderName(t, bomJobs);
  const root0 = localStorage.getItem(LS_DPATH) || DPATH_DEF;

  $("mtitle").textContent = "เช็คไฟล์เจาะ";
  $("mbody").innerHTML =
    '<p style="font-size:13px;color:var(--dim);line-height:1.7">' +
    "ชี้ไปที่โฟลเดอร์ไฟล์เจาะ โปรแกรมจะอ่าน <b>ชื่อไฟล์</b> เป็นรายการบาร์โค้ดที่มีเจาะจริง " +
    "(ไฟล์ <code>.mpr</code> ตั้งชื่อด้วยเลขบาร์โค้ดอยู่แล้ว) " +
    "และเปิดอ่านหัวไฟล์ทุกไฟล์เพื่อเช็ค <b>Mirror</b> ไปพร้อมกัน<br>" +
    "ช่อง <b>Barcode</b> และ <b>Barcode2</b> ที่ไม่มีไฟล์เจาะ จะถูกล้างเป็นว่าง " +
    "\u2014 ชิ้นที่เจาะอยู่หน้าสอง จึงเหลือเฉพาะ Barcode2 ให้เอง</p>" +
    '<div class="dsrc" id="dsrc">' +
      '<div class="frow"><div class="fld">' +
        '<label for="dpath">พาธหลักของเครื่องเจาะ \u2014 จำไว้ให้ ตั้งครั้งเดียวใช้ได้ตลอด</label>' +
        '<input id="dpath" spellcheck="false" placeholder="' + esc(DPATH_DEF) + '" value="' +
        esc(root0) + '"></div></div>' +
      '<div class="frow" style="margin-top:9px"><div class="fld">' +
        '<label for="dfull">พาธเต็มของงานใบนี้ \u2014 ก็อปไปวางในหน้าต่างเลือกโฟลเดอร์ได้เลย</label>' +
        '<input id="dfull" readonly spellcheck="false" value=""></div></div>' +
      '<p class="dnote" id="dhint" style="margin-top:6px;font-size:11.5px"></p>' +
      '<div class="drow">' +
        '<button class="cbtn primary" id="dopen">เลือกโฟลเดอร์\u2026</button>' +
        '<button class="cbtn" id="dcopy">คัดลอกพาธเต็ม</button>' +
        '<input id="dwho" spellcheck="false" placeholder="ชื่อคนสแกน" ' +
          'style="font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--line-2);' +
          'background:var(--card);color:var(--ink);width:130px" value="' +
          esc(localStorage.getItem(LS_NAME) || "") + '">' +
        '<span class="note" id="dfrom">หรือลากโฟลเดอร์จาก File Explorer มาวางในกรอบนี้</span>' +
      "</div>" +
      '<div id="dwatch"></div>' +
      '<p class="dnote" style="margin-top:9px;font-size:11.5px">' +
      "เบราว์เซอร์อ่านไฟล์จากพาธที่พิมพ์เองไม่ได้ (กันเว็บแอบอ่านไฟล์ในเครื่อง) " +
      "กด <b>คัดลอกพาธ</b> แล้วกด <b>เลือกโฟลเดอร์</b> วางพาธในช่องบนของหน้าต่างที่เปิดมา กด Enter " +
      "\u00B7 อ่านไฟล์ในเครื่อง ส่งขึ้นฐานข้อมูลแค่รายชื่อไฟล์กับเวลาไว้เป็นหลักฐาน</p>" +
    "</div>" +
    '<div class="dmir" id="dmir" data-tab="' + mirTab(t) + '"></div>' +
    '<label class="dlab" for="dtext">เลขบาร์โค้ดที่มีเจาะจริง \u2014 แก้เองหรือวางเองก็ได้</label>' +
    '<textarea id="dtext" spellcheck="false" placeholder="26083120011215&#10;26083120012215&#10;26083120011216">' +
    esc(t.drillText || "") + "</textarea>" +
    (nMan
      ? '<label class="dryline"><input type="checkbox" id="dman" checked> ' +
        "ไม่แตะช่องที่ไม่ใช่ตัวเลข เช่น <b>Manual</b> (พบ " + nMan + " แถว) \u2014 " +
        "พวกนี้ทำมือ ไม่ได้อยู่ในไฟล์เจาะอยู่แล้ว</label>"
      : "") +
    '<div id="dstat"></div>';
  $("mfoot").innerHTML =
    '<span class="note">ล้างบาร์โค้ดแก้เฉพาะในหน้าจอนี้ ไม่แตะไฟล์ BOM ต้นฉบับ</span><span class="sp"></span>' +
    '<button class="cbtn" id="drcancel">ยกเลิก</button>' +
    '<button class="cbtn primary" id="drok" disabled>ล้างช่องที่ไม่มีเจาะ</button>';

  let plan = null, meta = null, deb2, force = false, srcLabel = "";
  const recalc = () => {
    const t2 = T();
    t2.drillText = $("dtext").value;
    meta = parseDrillList(t2.drillText);
    const keepMan = !$("dman") || $("dman").checked;
    if (!meta.read){
      plan = null;
      $("dstat").innerHTML = '<p class="dnote">ยังไม่ได้วางเลขบาร์โค้ด</p>';
      $("drok").disabled = true;
      $("drok").textContent = "ล้างช่องที่ไม่มีเจาะ";
      return;
    }
    plan = scanDrill(t2, meta.codes, keepMan);
    /* กันพลาด: วางมาแล้วไม่ตรงกับไฟล์นี้สักเลขเดียว = แทบจะแน่ว่าวางผิดไฟล์
       ถ้าปล่อยผ่านจะล้างบาร์โค้ดทิ้งทั้งไฟล์ จึงล็อกปุ่มไว้ก่อน ปลดได้ถ้ายืนยัน */
    const noHit = plan.cut.length > 0 && (plan.keep1 + plan.keep2) === 0;
    /* v5.1: บอกให้ชัดว่าเลือกผิดใบตรงไหน ไม่ใช่แค่บอกว่าไม่ตรง */
    const inJobs = jobsOf([...meta.codes]).map(j => j[0]);
    const clash = inJobs.length && bomJobs.length && !inJobs.some(j => bomJobs.includes(j));
    $("dstat").innerHTML = drillStatHTML(t2, plan, meta) +
      (noHit
        ? '<div class="dmiss"><b>ไม่มีเลขไหนตรงกับไฟล์นี้เลยสักตัว</b><br>' +
          (clash
            ? "ไฟล์เจาะเป็นงาน <b>" + esc(inJobs.slice(0, 2).join(", ")) +
              "</b> แต่ BOM ที่เปิดอยู่เป็นงาน <b>" + esc(bomJobs.slice(0, 2).join(", ")) +
              "</b> \u2014 คนละใบกัน<br>"
            : "น่าจะวางมาจากงานคนละใบ หรือรูปแบบเลขคนละแบบ<br>") +
          "ถ้ากดต่อจะล้างบาร์โค้ดทิ้งทั้งไฟล์" +
          '<label class="dryline" style="margin-top:8px"><input type="checkbox" id="dforce"> ' +
          "ตรวจแล้ว ยืนยันว่าวางถูกไฟล์ ให้ล้างได้เลย</label></div>"
        : "");
    if (noHit && $("dforce")){
      $("dforce").checked = force;
      $("dforce").onchange = () => { force = $("dforce").checked; $("drok").disabled = !force; };
    }
    $("drok").disabled = plan.cut.length === 0 || (noHit && !force);
    $("drok").textContent = plan.cut.length
      ? "ล้าง " + plan.cut.length + " ช่อง"
      : "ไม่มีช่องไหนต้องล้าง";
  };
  $("dtext").oninput = () => { srcLabel = ""; clearTimeout(deb2); deb2 = setTimeout(recalc, 150); };
  if ($("dman")) $("dman").onchange = recalc;

  /* ---- รับรายชื่อไฟล์จากโฟลเดอร์ แล้วเทลงช่องข้อความ ใช้ทางเดินเดิมทั้งหมด ---- */
  /* บาร์โค้ด -> ชิ้นงานในไฟล์ ใช้บอกว่าไฟล์ที่เพิ่มมาเป็นชิ้นไหน */
  const pidCol = colIdx(t, "PartId"), pnCol = colIdx(t, "PartName");
  const codeRow = new Map();
  t.rows.forEach(r => [b1, b2].forEach(ci => {
    if (ci < 0) return;
    const v = String(r[ci] ?? "").trim();
    if (v && !codeRow.has(v)){
      codeRow.set(v, (pidCol >= 0 ? String(r[pidCol] ?? "").trim() : "") +
                     (pnCol >= 0 ? " " + String(r[pnCol] ?? "").trim() : ""));
    }
  }));
  const whose = c => (codeRow.get(c) || "").trim();

  const nameList = arr => arr.slice(0, 15).map(n => {
    const c = String(n).replace(/\.[^.]+$/, "");
    const w = whose(c);
    return esc(c) + (w ? " (" + esc(w) + ")" : "");
  }).join("<br>") + (arr.length > 15 ? "<br>\u2026 อีก " + (arr.length - 15) : "");

  /* เทียบไฟล์รอบนี้กับหลักฐานรอบก่อน */
  const diffHTML = (files, prev) => {
    const when = new Date(prev.at).toLocaleString("th-TH");
    const who = prev.by ? " โดย <b>" + esc(prev.by) + "</b>" : "";
    const old = new Map(Object.entries(prev.files || {}));
    if (!old.size){
      return '<p class="dnote">รอบก่อนสแกนเมื่อ ' + esc(when) + who +
        " (" + (prev.count || 0) + " ไฟล์) แต่ไม่ได้เก็บรายชื่อไว้ เทียบทีละไฟล์ไม่ได้</p>";
    }
    const now = new Map(files.map(f => [f.n, f.t]));
    const added = [...now.keys()].filter(n => !old.has(n));
    const gone  = [...old.keys()].filter(n => !now.has(n));
    const edit  = [...now.keys()].filter(n => old.has(n) && old.get(n) && now.get(n) && old.get(n) !== now.get(n));
    if (!added.length && !gone.length && !edit.length){
      return '<p class="dnote" style="color:#1e6b38">เทียบกับรอบก่อนเมื่อ ' + esc(when) + who +
        " \u2014 เหมือนเดิมทุกไฟล์ ไม่มีอะไรเพิ่มหรือหาย</p>";
    }
    return '<div class="dmiss"><b>เทียบกับรอบก่อนเมื่อ ' + esc(when) + who + "</b><br>" +
      (added.length ? "<b>เพิ่มมาใหม่ " + added.length + " ไฟล์</b><br>" + nameList(added) + "<br>" : "") +
      (gone.length  ? "<b>หายไป " + gone.length + " ไฟล์</b><br>" + nameList(gone) + "<br>" : "") +
      (edit.length  ? "<b>ถูกแก้ไข " + edit.length + " ไฟล์</b><br>" + nameList(edit) : "") +
      "</div>";
  };

  /* v5.3/v5.4: รายงานว่าโฟลเดอร์นี้ถูกแตะเมื่อไร และมีอะไรเพิ่มจากรอบก่อน */
  const renderWatch = async (files, label) => {
    const groups = timeGroups(files);
    let html = "";

    if (groups.length){
      html += '<p class="dnote" style="margin-top:9px">เวลาที่ไฟล์ถูกทำ: ' +
        groups.map(g => "<b>" + esc(g.day) + "</b> " + hhmm(g.min) +
          (g.max - g.min > 60000 ? "\u2013" + hhmm(g.max) : "") +
          " (" + g.n + " ไฟล์)").join("  \u00B7  ") + "</p>";
      if (groups.length > 1){
        const main = groups.slice().sort((a, b) => b.n - a.n)[0];
        const late = groups.filter(g => g !== main && g.min > main.max);
        if (late.length){
          html += '<div class="dmiss"><b>มีไฟล์ที่ทำหลังกลุ่มหลัก ' +
            late.reduce((n, g) => n + g.n, 0) + " ไฟล์</b> (" +
            late.map(g => esc(g.day)).join(", ") + ") \u2014 กลุ่มหลักทำวันที่ " +
            esc(main.day) + " ถ้างานนี้ควรจบในรอบเดียว แปลว่ามีการเติมทีหลัง</div>";
        }
      }
    }

    $("dwatch").innerHTML = html + '<p class="dnote">กำลังดึงหลักฐานจากฐานข้อมูล\u2026</p>';

    /* ภาพถ่ายรอบนี้ · ไฟล์เยอะเกินก็เก็บแค่จำนวน */
    const fileMap = {};
    if (files.length <= SNAP_FILES_MAX) files.forEach(f => fileMap[f.n] = f.t || 0);
    const who = ($("dwho") && $("dwho").value.trim()) || "";
    if (who) localStorage.setItem(LS_NAME, who);

    /* 1) หาหลักฐานรอบก่อน — เอาจาก Supabase ก่อน ไม่ได้ค่อยใช้ของในเครื่อง */
    let prev = null, hist = null, remoteErr = "";
    try{
      const rows = await drillScanLoad(label, 6);
      if (rows){
        hist = rows;
        if (rows[0]) prev = { at: rows[0].scanned_at, files: rows[0].files || {},
                              by: rows[0].scanned_by, count: rows[0].file_count };
      } else {
        remoteErr = "ตัวต่อ Supabase ยังไม่พร้อม (เครื่องออกเน็ตไม่ได้?)";
      }
    }catch(e){ remoteErr = e.message || String(e); }

    const snapAll = snapLoad();
    const local = snapAll[label];
    if (!prev && local) prev = { at: local.at, files: local.files || {}, by: "", count: null };

    html += prev
      ? diffHTML(files, prev)
      : '<p class="dnote">ยังไม่เคยมีหลักฐานของงานนี้ เก็บรอบนี้ไว้เป็นรอบแรกแล้ว ' +
        "สแกนซ้ำครั้งหน้าจะบอกได้ว่ามีไฟล์เพิ่มหรือหายไปกี่ไฟล์</p>";

    /* 2) บันทึกรอบนี้ · ขึ้นฐานข้อมูลเป็นหลัก เก็บในเครื่องเป็นสำรองด้วย */
    let saved = "";
    try{
      const ok = await drillScanSave({
        job: label,
        machine: ($("dpath").value.trim().split(/[\\/]/).filter(Boolean).pop() || ""),
        bom_file: t.file,
        scanned_by: who || null,
        file_count: files.length,
        files: fileMap
      });
      if (ok) saved = "เก็บหลักฐานรอบนี้ขึ้น Supabase แล้ว" +
        (files.length > SNAP_FILES_MAX ? " (ไฟล์เยอะเกิน เก็บแค่จำนวน ไม่เก็บรายชื่อ)" : "");
    }catch(e){ remoteErr = remoteErr || e.message || String(e); }

    snapAll[label] = { at: Date.now(), files: fileMap };
    snapSave(snapAll);

    /* 3) ประวัติการสแกนงานนี้ */
    if (hist && hist.length){
      html += '<p class="dnote">ประวัติการสแกนงานนี้: ' +
        hist.slice(0, 5).map(r =>
          new Date(r.scanned_at).toLocaleString("th-TH") +
          (r.scanned_by ? " \u00B7 " + esc(r.scanned_by) : "") +
          " \u00B7 " + r.file_count + " ไฟล์").join("<br>") + "</p>";
    }

    html += remoteErr
      /* v5.7: คนหน้าเครื่องเห็นแค่บรรทัดเดียวว่าเก็บที่ไหน วิธีตั้งค่าเป็นเรื่องผู้ดูแล
         พับไว้หลังลิงก์ ไม่ต้องเอา SQL ไปตั้งขวางหน้าคนที่ไม่ได้ดูแลฐานข้อมูล */
      ? '<p class="dnote">หลักฐานรอบนี้เก็บไว้<b>ในเครื่องนี้</b> ยังไม่ได้ขึ้นฐานข้อมูลกลาง ' +
        "\u2014 ใช้งานได้ตามปกติ แต่เครื่องอื่นจะไม่เห็นหลักฐานชุดนี้  " +
        '<button class="dlink" id="dadmbtn">ผู้ดูแลระบบกดที่นี่</button></p>' +
        '<div class="dadmin" id="dadm">' +
          '<p style="font-size:12px;color:var(--dim);line-height:1.7">' +
          "ต้องสร้างตาราง <code>" + esc(DRILL_TABLE) + "</code> ใน Supabase " +
          "<b>ครั้งเดียวจบ</b> ทำแล้วข้อความนี้จะหายไปเองทุกเครื่อง<br>" +
          "สาเหตุที่ระบบแจ้งมา: " + esc(remoteErr) + "</p>" +
          '<div id="drypre" style="max-height:150px">' + esc(DRILL_SQL) + "</div>" +
          '<button class="cbtn" id="dsql" style="margin-top:8px">คัดลอก SQL</button>' +
        "</div>"
      : '<p class="dnote" style="color:#1e6b38">' + esc(saved) + "</p>";

    $("dwatch").innerHTML = html;
    if ($("dadmbtn")) $("dadmbtn").onclick = () => {
      const box = $("dadm");
      const on = box.className !== "dadmin on";
      box.className = on ? "dadmin on" : "dadmin";
      $("dadmbtn").textContent = on ? "ซ่อนรายละเอียด" : "ผู้ดูแลระบบกดที่นี่";
    };
    if ($("dsql")) $("dsql").onclick = () => {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(DRILL_SQL)
          .then(() => toast("คัดลอก SQL แล้ว วางใน SQL Editor ของ Supabase"),
                () => toast("คัดลอกไม่สำเร็จ"));
      } else {
        const ta = document.createElement("textarea");
        ta.value = DRILL_SQL; document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); toast("คัดลอก SQL แล้ว"); }catch(_){}
        ta.remove();
      }
    };
  };

  /* v6.0: root = โฟลเดอร์ที่เปิดผ่าน showDirectoryPicker / ลากวาง (ได้ handle) ใช้ตอนแก้ไฟล์ Mirror
     ทางสำรองไม่มี root -> เช็ค Mirror ได้ แต่แก้ไฟล์ไม่ได้ */
  const takeNames = (names, label, root) => {
    /* โฟลเดอร์งานมักมีไฟล์อื่นปนอยู่ (log, รายการงาน) ที่ชื่อมีตัวเลขยาวเหมือนกัน
       ถ้าเจอ .mpr ก็เอาเฉพาะ .mpr ไม่งั้นรับหมดเผื่อโรงงานใช้นามสกุลอื่น */
    const mpr = names.filter(f => /\.mpr$/i.test(f.n));
    const use = mpr.length ? mpr : names;
    /* v6.0: เช็ค Mirror จากรายชื่อชุดเดียวกัน ไม่ไล่โฟลเดอร์ซ้ำ · อ่านหัวไฟล์ขนานไปโดยไม่บล็อกขั้นตอนเดิม */
    mirStart(t, mpr, { label, root: root || null });
    const codes = codesFromNames(use);
    if (!codes.length){
      $("dfrom").innerHTML = "<b>ไม่พบชื่อไฟล์ที่เป็นเลขบาร์โค้ดใน " + esc(label) + "</b>";
      return;
    }
    srcLabel = label;
    $("dtext").value = codes.join("\n");
    const jobs = jobsOf(codes);
    $("dfrom").innerHTML = "อ่านจาก <b>" + esc(label) + "</b> \u00B7 " +
      use.length.toLocaleString("th-TH") + " ไฟล์" +
      (mpr.length && mpr.length !== names.length
        ? " .mpr (ข้ามไฟล์อื่น " + (names.length - mpr.length) + ")" : "") +
      " \u00B7 ได้เลข " + codes.length.toLocaleString("th-TH") + " ตัว" +
      (jobs.length

  };
  recalc();
  $("modal").className = "on";
  mirPaint(t);
  setTimeout(() => $("dtext").focus(), 30);

/* โค้ดของแถวนี้อยู่ในระบบแล้วหรือยัง — "yes" / "no" / "" (ไม่มีโค้ดให้เช็ค) */
/* v4.2: คอลัมน์ที่เอาไปเช็คจริง = คอลัมน์ที่เน้น หักตัวที่อยู่ใน noCheck
   ใช้ที่เดียวกันทั้งตอนยิงถาม ตอนทำการ์ด และตอนนับค่ารอเช็ค
   จะได้ไม่หลุดไม่ตรงกันเวลาแก้ทีหลัง */
function checkCols(t){
  const skip = new Set((t.noCheck || []).map(norm));
  return t.hl.filter(i => !skip.has(norm(t.cols[i])));
}

/* v4.0: แถวนี้ถือว่า "ยังไม่มีโค้ด" ถ้าคอลัมน์ที่เน้นตัวใดตัวหนึ่ง
   มีค่าแต่หาไม่เจอในระบบ · ว่างเปล่าก็นับว่ายังไม่มีเหมือนกัน */
function codeState(t, r){
  if (!t.chk) return "";
  let seen = false;
  for (const ci of t.chk.cols){
    const v = String(r[ci] ?? "").trim();
    if (!v) return "no";
    seen = true;
    if (!t.chk.map.has(v)) return "no";
  }
  return seen ? "yes" : "";
}

function syncChkBar(){
  const t = T();
  const has = t.rows.length > 0;
  $("chkbar").className = has ? "on" : "";
  syncFixBtn();
  syncDrillBtn();
  if (!has) return;

  const p = $("chkres");
  if (!t.chk){
    /* v4.0: เช็คทุกคอลัมน์ที่เน้นรวมกัน ไม่ต้องเลือกคอลัมน์เองแล้ว */
    const set = new Set();
    checkCols(t).forEach(ci => t.rows.forEach(r => {
      const v = String(r[ci] ?? "").trim(); if (v) set.add(v);
    }));
    p.className = "pill wait";
    p.textContent = "กำลังรอเช็ค \u00B7 " + set.size + " ค่าไม่ซ้ำ";
    $("reqgo").disabled = true;
    $("onlyno").disabled = true;
    $("onlyno").setAttribute("aria-pressed", "false");
    $("chkat").textContent = "";
  } else {
    const { found, missing, total, cols } = t.chk;
    p.className = "pill " + (missing.length ? "bad" : "good");
    p.textContent = missing.length
      ? "มีแล้ว " + found + "  \u00B7  ยังไม่มี " + missing.length
      : "มีครบทั้ง " + total + " ค่า";
    $("reqgo").disabled = missing.length === 0;
    $("reqgo").textContent = missing.length ? "ส่งขอโค้ด " + missing.length + " รายการ" : "ส่งขอโค้ด";
    $("onlyno").disabled = missing.length === 0;
    $("onlyno").setAttribute("aria-pressed", String(t.onlyNo));
    $("chkat").textContent = "เช็คเมื่อ " + t.chk.at.toLocaleTimeString("th-TH") +
      "  \u00B7  " + cols.map(i => t.cols[i]).join(", ");
  }
}


/* ───────── กล่องรอแบบมีขั้นตอน (v4.1) ─────────
   เดิมโผล่เฉพาะตอนเช็คโค้ด ตอนนี้ขึ้นตั้งแต่เริ่มอ่านไฟล์
   แล้วไล่ติ๊กทีละขั้น ผู้ใช้จะได้รู้ว่าโปรแกรมกำลังทำอะไรอยู่ */
const STEPS = [
  ["read",  "อ่านไฟล์"],
  ["split", "แยกเข้าแท็บ"],
  ["check", "เช็คโค้ดกับ Supabase"],
  ["fix",   "แก้ X เป็น Y"]
];
let _stepState = {};

function busyRender(){
  $("bsteps").innerHTML = STEPS.map(([id, label]) => {
    const st = _stepState[id] || {};
    const cls = st.done ? "done" : st.run ? "run" : "";
    const mark = st.done ? "\u2713" : st.run ? "<span>\u25CC</span>" : "\u00B7";
    return '<div class="bstep ' + cls + '"><span class="m">' + mark + "</span>" +
      "<span>" + esc(label) + (st.note ? '<span class="d">' + esc(st.note) + "</span>" : "") +
      "</span></div>";
  }).join("");
}
function busyStart(title){
  _stepState = {};
  $("btitle").textContent = title || "กำลังเตรียมข้อมูล";
  $("bnow").textContent = "0"; $("ball").textContent = "0";
  $("bfill").className = "bfill idle"; $("bfill").style.width = "";
  $("bsub").textContent = "";
  busyRender();
  $("busy").className = "on";
}
function busyRun(id, note){
  Object.keys(_stepState).forEach(k => { if (_stepState[k].run) _stepState[k] = { done: true, note: _stepState[k].note }; });
  _stepState[id] = { run: true, note: note || "" };
  busyRender();
}
function busyDone(id, note){
  _stepState[id] = { done: true, note: note !== undefined ? note : (_stepState[id] || {}).note };
  busyRender();
}
function busySkip(id, note){ _stepState[id] = { done: false, note: note || "" }; busyRender(); }
function busyNote(id, note){
  if (!_stepState[id]) _stepState[id] = { run: true };
  _stepState[id].note = note; busyRender();
}
function busyOpen(total, title){
  if ($("busy").className !== "on") busyStart(title);
  else if (title) $("btitle").textContent = title;
  $("bnow").textContent = "0";
  $("ball").textContent = total.toLocaleString("th-TH");
  $("bfill").className = "bfill idle"; $("bfill").style.width = "";
}
function busyStep(done, total, note){
  $("bnow").textContent = done.toLocaleString("th-TH");
  $("bfill").className = "bfill";
  $("bfill").style.width = Math.round(done / Math.max(total, 1) * 100) + "%";
  if (note) $("bsub").textContent = note;
}
function busyClose(){ $("busy").className = ""; }

/* ───────── เช็คโค้ด (v3.7) ─────────
   ไม่มีปุ่มแล้ว เปิดไฟล์เสร็จเช็คให้เองทันที ทั้งแท็บไม้และแท็บ Fitting
   รับ key ของแท็บมาตรง ๆ จะได้ไล่เช็คหลายแท็บได้โดยไม่ต้องสลับหน้าจอ
   auto = true -> ล้มเหลวแล้วไม่ขึ้น toast รบกวน */
async function runCheck(auto, key){
  const k = key || cur, t = TABS[k];
  /* v4.0: รวมค่าจากทุกคอลัมน์ที่เน้น แล้วยิงถามทีเดียว
     การ์ดแต่ละใบจะได้เอาผลไปโชว์ได้หมด ไม่ต้องเช็คทีละคอลัมน์ */
  const cols = checkCols(t);
  const set = new Set();
  cols.forEach(ci => t.rows.forEach(r => {
    const v = String(r[ci] ?? "").trim();
    if (v) set.add(v);
  }));
  const codes = [...set];
  if (!codes.length){
    if (!auto) toast(cols.length ? "ไม่มีค่าให้เช็ค" : "คอลัมน์ที่เน้นอยู่ไม่ได้ตั้งให้เช็คกับ Supabase");
    return;
  }

  const client = getSb();
  if (!client){ if (!auto) toast("ต่อ Supabase ไม่ได้ — ตรวจว่าเครื่องออกอินเทอร์เน็ตได้"); return; }

  busyOpen(codes.length, $("busy").className === "on" ? null : "กำลังเช็คโค้ด \u00B7 " + t.label);

  const map = new Map();
  try{
    /* ยิงทีละก้อน 200 ตัว กัน URL ยาวเกิน และกันเซิร์ฟเวอร์ทำงานหนักทีเดียว */
    for (let i = 0; i < codes.length; i += 200){
      const part = codes.slice(i, i + 200);
      const done = Math.min(i + part.length, codes.length);
      busyStep(i, codes.length, "ก้อนที่ " + (i / 200 + 1) + " \u00B7 " + part[0] + " \u2026");
      const { data, error } = await client
        .from("fitting_global")
        .select("item_number,product_name,unit,search_name")
        .in("item_number", part);
      if (error) throw new Error(error.message);
      (data || []).forEach(d => map.set(String(d.item_number).trim(), d));
      busyStep(done, codes.length, "พบแล้ว " + map.size + " รายการ");
    }
    const missing = codes.filter(c => !map.has(c));
    t.chk = { map, cols, at: new Date(), found: map.size, total: codes.length, missing };
    t.onlyNo = false;
    toast(t.label + ": " + (missing.length
      ? "ยังไม่มีโค้ด " + missing.length + " จาก " + codes.length
      : "มีโค้ดครบทั้ง " + codes.length + " รายการ"));
  }catch(e){
    if (!auto) toast("เช็คไม่สำเร็จ: " + e.message);
    else toast(t.label + ": เช็คไม่สำเร็จ \u2014 " + e.message);
  }finally{
    if (!_checking) busyClose();   // เรียกเดี่ยว ๆ ก็ปิดเอง · ถ้าอยู่ในไปป์ไลน์ให้ scheduleChecks ปิด
    if (cur === k){ syncChkBar(); apply(); }
    else syncTabs();
  }
}

/* v3.7: ไล่เช็คทุกแท็บที่เพิ่งโหลดไฟล์มา ทีละแท็บไม่ให้ชนกัน
   ลากสองไฟล์พร้อมกันก็เช็คให้ทั้งคู่โดยไม่ต้องสลับหน้าจอไปกด */
let _checkTimer = null, _checking = false;
function scheduleChecks(){
  clearTimeout(_checkTimer);
  _checkTimer = setTimeout(async () => {
    if (_checking) return;
    _checking = true;
    try{
      /* 1) เช็คโค้ดทีละแท็บ */
      const todo = ["wood", "fit"].filter(k =>
        TABS[k].needCheck && TABS[k].rows.length && checkCols(TABS[k]).length);
      if (todo.length){
        busyRun("check");
        for (const k of todo){
          TABS[k].needCheck = false;
          busyNote("check", TABS[k].label);
          await runCheck(true, k);
        }
        const sum = todo.map(k => {
          const c = TABS[k].chk;
          return TABS[k].label + " " + (c ? c.found + " มี / " + c.missing.length + " ยังไม่มี" : "ไม่สำเร็จ");
        }).join("  \u00B7  ");
        busyDone("check", sum);
      } else busySkip("check", "ไม่มีคอลัมน์ให้เช็ค");

      /* 2) v4.1: แก้ X เป็น Y ให้เลย ไม่ต้องกดปุ่ม · ย้อนกลับได้ */
      busyRun("fix");
      const fixed = [];
      ["wood", "fit"].forEach(k => {
        const t = TABS[k];
        if (!t.rows.length || t.xy) return;
        const n = applyXY(t);
        if (n) fixed.push(t.label + " " + n + " แถว");
      });
      busyDone("fix", fixed.length ? fixed.join("  \u00B7  ") : "ไม่มี X ต้องแก้");

      syncChkBar(); apply();
      if (fixed.length) toast("แก้ X เป็น Y ให้แล้ว \u2014 " + fixed.join("  \u00B7  ") + "  \u00B7  กดย้อนกลับได้ถ้าไม่ต้องการ");
    } finally {
      _checking = false;
      setTimeout(busyClose, 550);   // ให้เห็นติ๊กครบก่อนปิด
    }
  }, 140);
}

async function sendRequest(t){
  const btn = $("msend");
  const name = $("mname").value.trim();
  const dept = $("mdept").value;
  const subject = $("msubj").value.trim();
  if (!name){ $("mname").focus(); return toast("ใส่ชื่อผู้ส่งก่อน"); }

  const items = [...$("mlist").querySelectorAll(".mrow")].map((row, i) => {
    if (!row.querySelector('input[type=checkbox]').checked) return null;
    return {
      ref_code: t.chk.missing[i],
      description: row.querySelector(".md").value.trim() || t.chk.missing[i]
    };
  }).filter(Boolean);

  if (!items.length) return toast("ยังไม่ได้เลือกรายการไหนเลย");

  const token = "tk_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  const payload = {
    sender_name: name,
    sender_token: token,
    message: items.length + " รายการ",
    items,
    attachments: [],
    status: "pending",
    department: dept || null,
    subject: subject || null
  };

  /* v3.5: โหมดทดลอง — โชว์ payload ที่จะเขียนลง task_tickets แล้วจบ ไม่แตะฐานข้อมูล */
  const dryEl = $("mdry");
  if (dryEl && dryEl.checked){
    $("mtitle").textContent = "ทดลอง \u2014 ยังไม่ได้ส่ง";
    $("mbody").innerHTML =
      '<p style="font-size:13px;color:var(--dim);line-height:1.7">' +
      "นี่คือข้อมูลที่จะถูกเขียนลงตาราง <code>task_tickets</code> ของ Supabase " +
      "ถ้าปลดติ๊กโหมดทดลองแล้วกดส่ง<br><b>ตอนนี้ยังไม่มีอะไรถูกเขียนลงฐานข้อมูล</b></p>" +
      '<div id="drypre">' + esc(JSON.stringify(payload, null, 2)) + "</div>";
    $("mfoot").innerHTML =
      '<span class="note">ตรวจแล้วถูกต้อง กดย้อนกลับแล้วปลดติ๊กเพื่อส่งจริง</span>' +
      '<span class="sp"></span>' +
      '<button class="cbtn" id="dryback">ย้อนกลับ</button>' +
      '<button class="cbtn primary" id="dryclose">ปิด</button>';
    $("dryclose").onclick = closeModal;
    $("dryback").onclick = () => $("reqgo").click();
    return;
  }

  const client = getSb();
  if (!client) return toast("ต่อ Supabase ไม่ได้");

  btn.disabled = true; btn.textContent = "กำลังส่ง\u2026";
  try{
    const { error } = await client.from("task_tickets").insert(payload);
    if (error) throw new Error(error.message);

    localStorage.setItem(LS_NAME, name);
    try{
      const arr = JSON.parse(localStorage.getItem(LS_TOK) || "[]");
      arr.push(token);
      localStorage.setItem(LS_TOK, JSON.stringify(arr));
    }catch(e){}

    $("mtitle").textContent = "ส่งเรียบร้อย";
    $("mbody").innerHTML =
      '<div id="done"><h4>ส่งขอตั้งโค้ด ' + items.length + ' รายการแล้ว</h4>' +
      "<p>รายการเข้าคิวรอคนตั้งโค้ดรับไปทำแล้ว ติดตามสถานะได้ที่แอป ส่งตั้ง Code AX ด้วยรหัสติดตามนี้</p>" +
      '<div class="tok" id="tok" title="คลิกเพื่อคัดลอก">' + esc(token) + "</div>" +
      '<p><a href="' + CODEAX_URL + '" target="_blank" rel="noopener">เปิดแอป ส่งตั้ง Code AX</a></p></div>';
    $("tok").onclick = () => {
      (navigator.clipboard ? navigator.clipboard.writeText(token) : Promise.reject())
        .then(() => toast("คัดลอกรหัสติดตามแล้ว")).catch(() => {});
    };
    $("mfoot").innerHTML = '<span class="sp"></span><button class="cbtn primary" id="mok">ปิด</button>';
    $("mok").onclick = closeModal;
    toast("ส่งขอโค้ด " + items.length + " รายการแล้ว");
  }catch(e){
    btn.disabled = false; btn.textContent = "ส่งรายการจริง";
    toast("ส่งไม่สำเร็จ: " + e.message);
  }
}

/* ═══════════════════════════════════════════════════════════════
   จัดการ Lot order  (v5.9)
   งาน : ไฟล์ Lot รวมหลายห้องไว้ในไฟล์เดียว บางครั้งต้องตัดห้องหนึ่งออก
         เช่น ห้อง 609 ใช้ PD69000044813 -> ต้องการสองไฟล์
           1) เฉพาะห้องนั้น
           2) ไฟล์เดิมที่ตัดห้องนั้นออกแล้ว
   แยกห้อง: ท่อนหน้าขีดของ BarcodePart  (PD69000044813-PD04PT18 -> PD69000044813)
   หัวใจ : ไฟล์ที่ได้ต้องเหมือนต้นฉบับทุกไบต์ ต่างกันแค่แถวที่ย้ายออก
           จึงไม่ประกอบ CSV ใหม่จากค่าในช่อง แต่ตัดท่อนไบต์ของแต่ละบรรทัดจากไฟล์เดิมมาต่อกัน
           683.0 ไม่กลายเป็น 683 · BOM · CRLF · คำพูด · ช่องว่างท้ายแถว ติดไปครบ
           และไม่ขึ้นกับ encoding ของไฟล์ด้วย (ไทยแบบ Windows-874 ก็ไม่เพี้ยน)
   หน้านี้ไม่เช็คโค้ดไม้ ไม่เช็คอุปกรณ์ ไม่แก้ X เป็น Y และไม่แตะ TABS
   ═══════════════════════════════════════════════════════════════ */
const LS_MODE = "imosviewer_mode";
const LOT_PREV_MAX = 400;          // ตัวอย่างแถวในหน้าจอ แสดงไม่เกินเท่านี้ (ไฟล์ที่บันทึกได้ครบ)

const LOT = {
  file: "", buf: null, dec: null, delim: ",", bom: false, eof: true, eol: null,
  top: [], cols: [], recs: [], dataN: 0, gcol: -1,
  groups: [], sel: new Set(), q: "", room: ""
};

/* ถอดไบต์เป็นข้อความเพื่อแสดงผลเท่านั้น (ไฟล์ที่บันทึกใช้ไบต์เดิม)
   ลอง UTF-8 แบบเข้มก่อน ไม่ผ่านแปลว่าเป็นไทยแบบเก่า ใช้ Windows-874 */
function lotDecoder(buf){
  try{ new TextDecoder("utf-8", { fatal: true }).decode(buf); return { d: new TextDecoder("utf-8"), name: "UTF-8" }; }
  catch(_){
    try{ return { d: new TextDecoder("windows-874"), name: "Windows-874" }; }
    catch(__){ return { d: new TextDecoder("utf-8"), name: "UTF-8" }; }
  }
}

/* แบ่งไฟล์เป็นบรรทัดระดับไบต์ · ขึ้นบรรทัดในเซลล์ที่ครอบคำพูดไม่นับเป็นบรรทัดใหม่
   คืน [{ s, e, n }]  s..e = เนื้อบรรทัด  ·  e..n = ตัวขึ้นบรรทัดของบรรทัดนั้นเอง
   (\r\n หรือ \n · บรรทัดสุดท้ายที่ไม่มีตัวขึ้นบรรทัด e === n) */
function lotLines(buf, start, dl){
  const out = [];
  let s = start, q = false, fs = true;          // fs = อยู่ต้นช่องพอดี
  for (let i = start; i < buf.length; i++){
    const c = buf[i];
    if (q){
      if (c === 0x22){
        if (buf[i + 1] === 0x22){ i++; continue; }
        q = false;
      }
      continue;
    }
    if (c === 0x22 && fs){ q = true; fs = false; continue; }
    if (c === dl){ fs = true; continue; }
    if (c === 0x0A){
      const e = (i > s && buf[i - 1] === 0x0D) ? i - 1 : i;
      out.push({ s, e, n: i + 1 });
      s = i + 1; fs = true;
      continue;
    }
    if (c !== 0x0D) fs = false;
  }
  if (s < buf.length) out.push({ s, e: buf.length, n: buf.length });
  return out;
}

/* ───────── รับไฟล์ Lot ───────── */
async function lotTake(f){
  if (!f) return;
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  if (ext === "xlsx" || ext === "xls"){
    return lotFail("หน้านี้รับเฉพาะไฟล์ CSV",
      "ไฟล์ Lot ที่ส่งเข้าเครื่องเป็น CSV อยู่แล้ว โปรแกรมตัดแถวจากไฟล์ต้นฉบับตรง ๆ " +
      "เพื่อให้ไฟล์ที่ได้เหมือนเดิมทุกไบต์ ถ้ามีแต่ Excel ให้ Save As → CSV ก่อน");
  }
  let buf;
  try{ buf = new Uint8Array(await f.arrayBuffer()); }
  catch(e){ return lotFail("อ่านไฟล์ไม่ได้", esc(e.message)); }

  const bom = buf[0] === 0xEF && buf[1] === 0xBB && buf[2] === 0xBF;
  const start = bom ? 3 : 0;
  const dz = lotDecoder(buf);
  let nl = buf.indexOf(0x0A, start); if (nl < 0) nl = buf.length;
  const delim = detectDelim(dz.d.decode(buf.subarray(start, nl)));
  const lines = lotLines(buf, start, delim.charCodeAt(0));
  const txt = L => dz.d.decode(buf.subarray(L.s, L.e));

  /* บรรทัดแรกที่ไม่ว่าง = หัวตาราง · บรรทัดว่างก่อนหน้า (ถ้ามี) ติดไปทั้งสองไฟล์ */
  const hi = lines.findIndex(L => txt(L).trim() !== "");
  if (hi < 0) return lotFail("ไฟล์ว่าง", "ไม่พบข้อมูลในไฟล์ " + esc(f.name));
  const cols = (parseDelimited(txt(lines[hi]), delim)[0] || []).map(h => String(h).trim());
  if (cols.length < 2) return lotFail("อ่านหัวตารางไม่ออก",
    "บรรทัดแรกของไฟล์ต้องเป็นหัวตาราง คั่นด้วยคอมมาหรือแท็บ");

  const recs = lines.slice(hi + 1).map((L, k) => {
    const x = txt(L);
    return { s: L.s, e: L.e, n: L.n, line: hi + 2 + k,
             cells: x.trim() === "" ? null : (parseDelimited(x, delim)[0] || null) };
  });
  const dataN = recs.filter(r => r.cells).length;
  if (!dataN) return lotFail("มีแต่หัวตาราง", "ไฟล์ " + esc(f.name) + " ไม่มีแถวข้อมูล");

  const H = lines[hi], last = lines[lines.length - 1];
  Object.assign(LOT, {
    file: f.name, buf, dec: dz, delim, bom,
    /* ตัวขึ้นบรรทัดหลักของไฟล์ ใช้เติมให้บรรทัดสุดท้ายเดิมเวลาถูกย้ายไปอยู่กลางไฟล์ใหม่ */
    eol: H.n > H.e ? buf.subarray(H.e, H.n) : new Uint8Array([13, 10]),
    eof: last.n > last.e,
    top: lines.slice(0, hi + 1), cols, recs, dataN,
    sel: new Set(), q: "", room: ""
  });
  LOT.gcol = lotGuessCol();
  lotGroup();
  $("lfind").value = "";
  drawLot();
  toast("เปิด " + f.name + " · " + dataN.toLocaleString("th-TH") + " แถว · " + LOT.groups.length + " PD");
}

/* คอลัมน์ที่ใช้แยกห้อง — BarcodePart ก่อน ไม่มีค่อยหาคอลัมน์ที่ค่าขึ้นต้นด้วย PD ทุกแถว */
function lotGuessCol(){
  let i = colIdx(LOT, "BarcodePart");
  if (i >= 0) return i;
  const sample = LOT.recs.filter(r => r.cells).slice(0, 60);
  i = LOT.cols.findIndex((_, ci) => sample.every(r => /^PD\d+/i.test(String(r.cells[ci] ?? "").trim())));
  return i >= 0 ? i : 0;
}
const lotKey = r => String(r.cells[LOT.gcol] ?? "").trim().split("-")[0].trim();

/* จัดกลุ่มตาม PD · เรียงตามที่เจอก่อนในไฟล์ */
function lotGroup(){
  const gm = new Map();
  const ii = colIdx(LOT, "ItemIdSet"), si = colIdx(LOT, "ShelfNo"), qi = qtyIndex(LOT);
  LOT.recs.forEach((r, k) => {
    if (!r.cells) return;
    const key = lotKey(r);
    let g = gm.get(key);
    if (!g){ g = { key, idx: [], items: new Set(), shelf: [], qty: 0, runs: 0, prev: -2 }; gm.set(key, g); }
    if (k !== g.prev + 1) g.runs++;          // แถวของห้องนี้ขาดตอนเป็นกี่ช่วงในไฟล์
    g.prev = k;
    g.idx.push(k);
    if (ii >= 0){ const v = String(r.cells[ii] ?? "").trim(); if (v) g.items.add(v); }
    if (si >= 0){ const v = String(r.cells[si] ?? "").trim(); if (v) g.shelf.push(v); }
    if (qi >= 0) g.qty += parseFloat(String(r.cells[qi] ?? "").replace(/,/g, "")) || 0;
  });
  LOT.groups = [...gm.values()].map(g => {
    const sh = g.shelf.slice().sort();
    return Object.assign(g, {
      from: LOT.recs[g.idx[0]].line, to: LOT.recs[g.idx[g.idx.length - 1]].line,
      shelfLo: sh[0] || "", shelfHi: sh[sh.length - 1] || ""
    });
  });
  const keep = new Set(LOT.groups.map(g => g.key));
  LOT.sel = new Set([...LOT.sel].filter(k => keep.has(k)));
}

/* PD ที่เลือก ตามลำดับในไฟล์ */
const lotSelGroups = () => LOT.groups.filter(g => LOT.sel.has(g.key));

/* แบ่งแถวเป็นสองกอง ตามลำดับในไฟล์เดิม · a = ห้องที่เลือก · b = ที่เหลือ (รวมบรรทัดว่าง ถ้ามี) */
function lotSplit(){
  const on = new Set();
  lotSelGroups().forEach(g => g.idx.forEach(k => on.add(k)));
  const a = [], b = [];
  LOT.recs.forEach((r, k) => (on.has(k) ? a : b).push(k));
  return { a, b, bData: b.filter(k => LOT.recs[k].cells).length };
}

/* ประกอบไฟล์จากท่อนไบต์ของไฟล์เดิม · หัวตาราง + แถวที่ต้องการ ตามลำดับเดิม */
function lotBlob(idx){
  const B = LOT.buf, parts = [];
  if (LOT.bom) parts.push(new Uint8Array([0xEF, 0xBB, 0xBF]));
  const list = LOT.top.concat(idx.map(k => LOT.recs[k]));
  list.forEach((L, j) => {
    parts.push(B.subarray(L.s, L.e));
    const own = L.n > L.e ? B.subarray(L.e, L.n) : LOT.eol;
    if (j < list.length - 1 || LOT.eof) parts.push(own);
  });
  return new Blob(parts, { type: "text/csv" });
}

/* ───────── ชื่อไฟล์ ─────────
   ห้อง = ช่องชื่อห้อง ถ้าไม่ใส่ใช้เลข PD แทน
   1) เฉพาะห้อง : ชื่อเดิมตัดท้าย _ไม่มีห้อง… ออก แล้วต่อ _ห้อง609
   2) ตัดห้องออก: ชื่อเดิม ต่อ _ไม่มีห้อง609 */
function lotLabel(){
  const room = LOT.room.trim().replace(/\s+/g, "");
  if (room) return /^ห้อง/.test(room) ? room : "ห้อง" + room;
  const ks = lotSelGroups().map(g => g.key || "ว่าง");
  return ks.length === 1 ? ks[0] : ks[0] + "+" + (ks.length - 1);
}
function lotNames(){
  const ext = (LOT.file.match(/\.[^.]+$/) || [".csv"])[0];
  const base = LOT.file.replace(/\.[^.]+$/, "") || "lot";
  const core = base.replace(/(_ไม่มีห้อง[^_]*)+$/, "") || base;
  const lab = lotLabel();
  const clean = s => s.replace(/[\\/:*?"<>|]+/g, "_");
  return { a: clean(core + "_" + lab) + ext, b: clean(base + "_ไม่มี" + lab) + ext };
}
function lotSyncNames(){
  if (!$("lnameA")) return;
  const n = lotNames();
  $("lnameA").value = n.a; $("lnameB").value = n.b;
}

/* ───────── วาดหน้า Lot ───────── */
function drawLot(){
  if (!LOT.recs.length){
    if ($("ldrop").className !== "err") lotEmpty();
    $("lfile").textContent = "ยังไม่ได้เปิดไฟล์";
    $("lgc").className = "lgc";
    $("lglist").innerHTML = ""; $("lside").innerHTML = "";
    return;
  }
  $("ldrop").className = "off";
  $("lfile").innerHTML = "<b>" + esc(LOT.file) + "</b> · <span class=\"m\">" +
    LOT.dataN.toLocaleString("th-TH") + "</span> แถว · <span class=\"m\">" +
    LOT.groups.length + "</span> PD";
  $("lgc").className = "lgc on";
  $("lgcol").innerHTML = LOT.cols.map((c, i) =>
    '<option value="' + i + '"' + (i === LOT.gcol ? " selected" : "") + ">" + esc(c) + "</option>").join("");
  drawLotList();
  drawLotSide();
}

function drawLotList(){
  const toks = LOT.q.toLowerCase().split(/[\s,;|]+/).filter(Boolean);
  const hit = g => !toks.length || toks.some(t =>
    g.key.toLowerCase().includes(t) || [...g.items].some(v => v.toLowerCase().includes(t)));
  const list = LOT.groups.map((g, i) => [g, i]).filter(([g]) => hit(g));
  const n = v => v.toLocaleString("th-TH");
  $("lglist").innerHTML = list.length ? list.map(([g, i]) => {
    const on = LOT.sel.has(g.key);
    const meta = [];
    if (g.items.size) meta.push('<span class="m">' + esc([...g.items].join(", ")) + "</span>");
    if (g.shelfLo) meta.push('<span class="m">' + esc(g.shelfLo) +
      (g.shelfHi !== g.shelfLo ? "–" + esc(g.shelfHi) : "") + "</span>");
    meta.push('บรรทัด <span class="m">' + n(g.from) + (g.to !== g.from ? "–" + n(g.to) : "") + "</span>");
    if (g.runs > 1) meta.push('<span class="warn">แถวไม่ติดกัน ' + g.runs + " ช่วง</span>");
    return '<div class="lg' + (on ? " on" : "") + '" data-i="' + i + '">' +
      '<span class="ck">' + (on ? "✓" : "") + "</span>" +
      (g.key ? '<span class="lk">' + esc(g.key) + "</span>" : '<span class="lk none">(ว่าง)</span>') +
      '<span class="ln"><b>' + n(g.idx.length) + "</b> แถว</span>" +
      '<span class="lm">' + meta.join(" · ") + "</span></div>";
  }).join("") : '<div class="lgnone">ไม่พบ PD ที่ตรงกับ “' + esc(LOT.q) + "”</div>";

  $("lglist").querySelectorAll(".lg").forEach(el => {
    el.onclick = () => {
      const g = LOT.groups[+el.dataset.i];
      LOT.sel.has(g.key) ? LOT.sel.delete(g.key) : LOT.sel.add(g.key);
      drawLotList(); drawLotSide();
    };
  });
}

function drawLotSide(){
  const n = v => v.toLocaleString("th-TH");
  const sg = lotSelGroups();
  if (!sg.length){
    $("lside").innerHTML =
      '<div class="lcard"><h4>เลือกห้องที่จะแยก</h4>' +
      "<p>คลิกเลข PD ทางซ้าย หรือพิมพ์เลข PD ในช่องค้นหาแล้วกด <b>Enter</b> " +
      "พิมพ์แค่เลขท้ายก็ได้ เช่น <span class=\"m\">44813</span> · วางหลายเลขพร้อมกันก็ได้<br>" +
      "เลือกหลายห้อง จะรวมอยู่ในไฟล์เดียวกัน</p>" +
      '<p style="margin-top:8px">ไฟล์นี้มี <b class="m">' + LOT.groups.length + "</b> PD รวม <b class=\"m\">" +
      n(LOT.dataN) + "</b> แถว</p></div>";
    return;
  }

  const { a, b, bData } = lotSplit();
  const qi = qtyIndex(LOT);
  const items = new Set(); sg.forEach(g => g.items.forEach(v => items.add(v)));
  const shelves = sg.flatMap(g => g.shelf).sort();
  const qty = sg.reduce((s, g) => s + g.qty, 0);
  const sum = a.length + bData;
  const same = sum === LOT.dataN;
  const blanks = b.length - bData;

  /* บอกรูปแบบไฟล์ที่จะได้ ให้รู้ว่าติดไปเหมือนเดิม */
  const fmt = [
    LOT.dec.name,
    LOT.bom ? "มี BOM" : "ไม่มี BOM",
    LOT.delim === "\t" ? "คั่นด้วยแท็บ" : LOT.delim === "," ? "คั่นด้วยคอมมา" : "คั่นด้วย " + LOT.delim,
    LOT.eol.length === 2 ? "ขึ้นบรรทัด CRLF" : "ขึ้นบรรทัด LF"
  ].join(" · ");

  const stat = (v, l) => '<div><b title="' + esc(v) + '">' + esc(v) + "</b><i>" + l + "</i></div>";
  let html =
    '<div class="lcard"><h4>ห้องที่เลือก <em>' + sg.length + " PD</em>" +
      '<button class="dlink" id="lclear">ล้างที่เลือก</button></h4>' +
    '<div class="lchips">' + sg.map(g =>
      '<span class="lchip">' + esc(g.key || "(ว่าง)") +
      '<button data-k="' + LOT.groups.indexOf(g) + '" title="เอาออก">&times;</button></span>').join("") + "</div>" +
    '<div class="lstats">' +
      stat(n(a.length), "แถว") +
      (qi >= 0 ? stat(n(qty), "รวม Qty") : "") +
      (items.size ? stat(items.size === 1 ? [...items][0] : items.size + " แบบ", "ItemIdSet") : "") +
      (shelves.length ? stat(shelves[0] + (shelves[shelves.length - 1] !== shelves[0]
        ? "–" + shelves[shelves.length - 1].replace(/^[A-Za-z]+/, "") : ""), "ShelfNo") : "") +
    "</div>" +
    '<div class="lroom"><label for="lroom">ชื่อห้อง ใช้ตั้งชื่อไฟล์ · ไม่ใส่ก็ได้ จะใช้เลข PD แทน</label>' +
      '<input id="lroom" placeholder="เช่น 609" autocomplete="off" value="' +
      esc(LOT.room).replace(/"/g, "&quot;") + '"></div>' +
    "</div>";

  html +=
    '<div class="lcard"><h4>ไฟล์ที่จะได้ <em>ไฟล์ต้นฉบับไม่ถูกแตะ</em></h4>' +
    '<div class="lout"><div class="lo-t"><span class="no">1</span>เฉพาะห้องที่เลือก' +
      '<span class="cnt"><b>' + n(a.length) + "</b> แถว + หัวตาราง</span></div>" +
      '<div class="lo-r"><input class="lname" id="lnameA" spellcheck="false">' +
      '<button class="cbtn" id="lsaveA">บันทึก</button></div></div>' +
    '<div class="lout"><div class="lo-t"><span class="no">2</span>ไฟล์เดิม ตัดห้องที่เลือกออก' +
      '<span class="cnt"><b>' + n(bData) + "</b> แถว + หัวตาราง</span></div>" +
      '<div class="lo-r"><input class="lname" id="lnameB" spellcheck="false">' +
      '<button class="cbtn" id="lsaveB">บันทึก</button></div></div>' +
    '<div class="lver ' + (same ? "ok" : "bad") + '">' +
      (same
        ? "✓ <span class=\"m\">" + n(a.length) + " + " + n(bData) + " = " + n(sum) +
          "</span> แถว เท่ากับไฟล์เดิม ไม่มีแถวหายหรือซ้ำ"
        : "✕ <span class=\"m\">" + n(a.length) + " + " + n(bData) + " = " + n(sum) +
          "</span> แถว ไม่เท่าไฟล์เดิม <span class=\"m\">" + n(LOT.dataN) + "</span> อย่าเพิ่งใช้ไฟล์นี้") +
      "<br>หัวตารางติดไปทั้งสองไฟล์ · รูปแบบเหมือนต้นฉบับ: " + esc(fmt) +
      (blanks ? " · บรรทัดว่าง " + blanks + " บรรทัดอยู่ในไฟล์ 2 ตามเดิม" : "") +
      (bData === 0 ? "<br>เลือกครบทุก PD ไฟล์ 2 จะเหลือแต่หัวตาราง" : "") +
    "</div>" +
    '<div class="lfoot"><span class="note">ถ้าเบราว์เซอร์ถามว่าให้ดาวน์โหลดหลายไฟล์ไหม กดอนุญาต</span>' +
      '<button class="cbtn primary" id="lsave2">บันทึกทั้งสองไฟล์</button></div>' +
    "</div>";

  /* ตัวอย่างแถวของห้องที่เลือก · # คือเลขบรรทัดในไฟล์เดิม เทียบกับ Excel ได้ */
  const show = a.slice(0, LOT_PREV_MAX);
  html +=
    '<div class="lcard"><h4>แถวของห้องที่เลือก <em>' + n(a.length) + " แถว · # คือเลขบรรทัดในไฟล์เดิม</em></h4>" +
    '<div class="lpwrap"><table><thead><tr><th class="rn">#</th>' +
      LOT.cols.map((c, i) => '<th class="' + (i === LOT.gcol ? "hl" : "") + '">' + esc(c) + "</th>").join("") +
    "</tr></thead><tbody>" +
      show.map(k => {
        const r = LOT.recs[k];
        return '<tr><td class="rn">' + r.line + "</td>" + LOT.cols.map((_, i) => {
          const v = r.cells[i] ?? "";
          const cls = i === LOT.gcol ? "hl" : blank(v) ? "e" : isNum(v) ? "n" : "";
          return '<td class="' + cls + '">' + (blank(v) ? "–" : esc(v)) + "</td>";
        }).join("") + "</tr>";
      }).join("") +
    "</tbody></table></div>" +
    (a.length > show.length
      ? '<div class="lpmore">แสดง ' + n(show.length) + " แถวแรก · ไฟล์ที่บันทึกได้ครบ " + n(a.length) + " แถว</div>"
      : "") +
    "</div>";

  $("lside").innerHTML = html;
  lotSyncNames();

  $("lclear").onclick = () => { LOT.sel.clear(); drawLotList(); drawLotSide(); };
  $("lside").querySelectorAll(".lchip button").forEach(bt => {
    bt.onclick = () => { LOT.sel.delete(LOT.groups[+bt.dataset.k].key); drawLotList(); drawLotSide(); };
  });
  /* พิมพ์ชื่อห้อง -> เปลี่ยนแค่ชื่อไฟล์ ไม่วาดทั้งการ์ดใหม่ เคอร์เซอร์จะได้ไม่หลุด */
  $("lroom").oninput = function(){ LOT.room = this.value; lotSyncNames(); };
  $("lsaveA").onclick = () => lotSave("a");
  $("lsaveB").onclick = () => lotSave("b");
  $("lsave2").onclick = () => { lotSave("a"); setTimeout(() => lotSave("b"), 700); };
}

function lotSave(which){
  if (!lotSelGroups().length) return toast("ยังไม่ได้เลือกห้อง");
  const sp = lotSplit();
  const idx = which === "a" ? sp.a : sp.b;
  const ext = (LOT.file.match(/\.[^.]+$/) || [".csv"])[0];
  let name = ($(which === "a" ? "lnameA" : "lnameB").value || "").trim()
               .replace(/[\\/:*?"<>|]+/g, "_");
  if (!name) name = lotNames()[which];
  if (!/\.[A-Za-z0-9]{2,4}$/.test(name)) name += ext;
  download(name, lotBlob(idx));
  const rows = which === "a" ? idx.length : sp.bData;
  toast("บันทึก " + name + " · " + rows.toLocaleString("th-TH") + " แถว");
}

/* เลือก PD จากที่พิมพ์/วาง · รับเลขเต็ม เลขท้าย หรือ BarcodePart ทั้งท่อน */
function lotPick(){
  const toks = LOT.q.split(/[\s,;|]+/).map(v => v.trim()).filter(Boolean);
  if (!toks.length || !LOT.groups.length) return;
  const got = [], miss = [];
  toks.forEach(tk => {
    const u = tk.toUpperCase(), head = u.split("-")[0];
    const K = g => g.key.toUpperCase();
    let g = LOT.groups.find(x => K(x) === u) || LOT.groups.find(x => K(x) === head);
    if (!g){
      const m = LOT.groups.filter(x => x.key && K(x).endsWith(u));
      if (m.length === 1) g = m[0];
    }
    if (g){ LOT.sel.add(g.key); got.push(g.key); } else miss.push(tk);
  });
  if (got.length && !miss.length){ LOT.q = ""; $("lfind").value = ""; }
  drawLotList(); drawLotSide();
  const el = $("lglist").querySelector(".lg.on");
  if (el) el.scrollIntoView({ block: "nearest" });
  toast(got.length
    ? "เลือก " + got.join(", ") + (miss.length ? " · ไม่พบ " + miss.join(", ") : "")
    : "ไม่พบ " + miss.join(", ") + " ในไฟล์นี้");
}

$("lopen").onclick = () => $("lpick").click();
$("lpick").onchange = e => { lotTake(e.target.files[0]); e.target.value = ""; };
$("lfind").oninput = function(e){
  LOT.q = this.value;
  if (e.inputType === "insertFromPaste") return lotPick();   // วางเลขมา = เลือกให้เลย
  drawLotList();
};
$("lfind").onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); lotPick(); } };
$("lgcol").onchange = function(){
  LOT.gcol = +this.value; LOT.sel.clear();
  lotGroup(); drawLot();
};

/* ───────── สลับหน้าใหญ่ ───────── */
function setMode(m){
  mode = m === "lot" ? "lot" : "bom";
  document.body.classList.toggle("mode-lot", mode === "lot");
  document.querySelectorAll(".mode").forEach(b => {
    const on = b.dataset.m === mode;
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
  });
  try{ localStorage.setItem(LS_MODE, mode); }catch(_){}
  $("colpanel").className = ""; $("savemenu").className = "";
  if (mode === "bom") render();       // กลับมาแล้ววาดใหม่ ความกว้างสองฝั่งจะได้ถูก
  else drawLot();
}
document.querySelectorAll(".mode").forEach(b => { b.onclick = () => setMode(b.dataset.m); });

syncTabs();
emptyScreen();
lotEmpty();
(function(){ let m = "bom"; try{ m = localStorage.getItem(LS_MODE) || "bom"; }catch(_){} if (m === "lot") setMode("lot"); })();
