          " เลขในไฟล์เจาะที่ไม่พบใน BOM นี้</b><br>" +
          d.orphan.slice(0, 40).map(esc).join("  ") +
          (d.orphan.length > 40 ? "  \u2026" : "") + "</div>"
        : "");
    $("mfoot").innerHTML =
      '<span class="note">แก้เฉพาะข้อมูลในหน้าจอนี้ ไม่แตะไฟล์ต้นฉบับ</span><span class="sp"></span>' +
      '<button class="cbtn undo" id="drundo">ย้อนกลับทั้งหมด</button>' +
      '<button class="cbtn primary" id="drclose">ปิด</button>';
    $("drclose").onclick = closeModal;
    $("drundo").onclick = () => {
      const n = undoDrill(t); closeModal(); syncDrillBtn(); apply();
      toast("คืนเลขบาร์โค้ดกลับแล้ว " + n + " ช่อง");
    };
    $("modal").className = "on";
    return;
  }

  const { b1, b2 } = drillCols(t);
  if (b1 < 0 && b2 < 0) return toast("แท็บนี้ไม่มีคอลัมน์ Barcode");

  const nMan = t.rows.filter(r =>
    [b1, b2].some(ci => ci >= 0 && String(r[ci] ?? "").trim() && !/^\d+$/.test(String(r[ci]).trim()))
  ).length;

  /* เลขงานของ BOM ที่เปิดอยู่ ใช้ทั้งประกอบพาธและเทียบกับโฟลเดอร์ที่เลือกมา */
  const bomCodes = [];
  t.rows.forEach(r => [b1, b2].forEach(ci => {
    if (ci < 0) return;
    const v = String(r[ci] ?? "").trim();
    if (/^\d+$/.test(v)) bomCodes.push(v);
  }));
  const bomJobs = jobsOf(bomCodes).map(j => j[0]);
  const job = jobFolderName(t, bomJobs);
  const root0 = localStorage.getItem(LS_DPATH) || DPATH_DEF;

  $("mtitle").textContent = "เช็คไฟล์เจาะ";
  $("mbody").innerHTML =
    '<p style="font-size:13px;color:var(--dim);line-height:1.7">' +
    "ชี้ไปที่โฟลเดอร์ไฟล์เจาะ โปรแกรมจะอ่าน <b>ชื่อไฟล์</b> เป็นรายการบาร์โค้ดที่มีเจาะจริง " +
    "(ไฟล์ <code>.mpr</code> ตั้งชื่อด้วยเลขบาร์โค้ดอยู่แล้ว ไม่ต้องเปิดอ่านข้างใน)<br>" +
    "ช่อง <b>Barcode</b> และ <b>Barcode2</b> ที่ไม่มีไฟล์เจาะ จะถูกล้างเป็นว่าง " +
    "\u2014 ชิ้นที่เจาะอยู่หน้าสอง จึงเหลือเฉพาะ Barcode2 ให้เอง</p>" +
    '<div class="dsrc" id="dsrc">' +
      '<div class="frow"><div class="fld">' +
        '<label for="dpath">พาธหลักของเครื่องเจาะ \u2014 จำไว้ให้ ตั้งครั้งเดียวใช้ได้ตลอด</label>' +
        '<input id="dpath" spellcheck="false" placeholder="' + esc(DPATH_DEF) + '" value="' +
        esc(root0) + '"></div></div>' +
      '<div class="frow" style="margin-top:9px"><div class="fld">' +
        '<label for="dfull">พาธเต็มของงานใบนี้ \u2014 ก็อปไปวางในหน้าต่างเลือกโฟลเดอร์ได้เลย</label>' +
        '<input id="dfull" readonly spellcheck="false" value=""></div></div>' +
      '<p class="dnote" id="dhint" style="margin-top:6px;font-size:11.5px"></p>' +
      '<div class="drow">' +
        '<button class="cbtn primary" id="dopen">เลือกโฟลเดอร์\u2026</button>' +
        '<button class="cbtn" id="dcopy">คัดลอกพาธเต็ม</button>' +
        '<input id="dwho" spellcheck="false" placeholder="ชื่อคนสแกน" ' +
          'style="font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--line-2);' +
          'background:var(--card);color:var(--ink);width:130px" value="' +
          esc(localStorage.getItem(LS_NAME) || "") + '">' +
        '<span class="note" id="dfrom">หรือลากโฟลเดอร์จาก File Explorer มาวางในกรอบนี้</span>' +
      "</div>" +
      '<div id="dwatch"></div>' +
      '<p class="dnote" style="margin-top:9px;font-size:11.5px">' +
      "เบราว์เซอร์อ่านไฟล์จากพาธที่พิมพ์เองไม่ได้ (กันเว็บแอบอ่านไฟล์ในเครื่อง) " +
      "กด <b>คัดลอกพาธ</b> แล้วกด <b>เลือกโฟลเดอร์</b> วางพาธในช่องบนของหน้าต่างที่เปิดมา กด Enter " +
      "\u00B7 อ่านแค่ชื่อไฟล์ ไม่มีการส่งอะไรออกนอกเครื่อง</p>" +
    "</div>" +
    '<label class="dlab" for="dtext">เลขบาร์โค้ดที่มีเจาะจริง \u2014 แก้เองหรือวางเองก็ได้</label>' +
    '<textarea id="dtext" spellcheck="false" placeholder="26083120011215&#10;26083120012215&#10;26083120011216">' +
    esc(t.drillText || "") + "</textarea>" +
    (nMan
      ? '<label class="dryline"><input type="checkbox" id="dman" checked> ' +
        "ไม่แตะช่องที่ไม่ใช่ตัวเลข เช่น <b>Manual</b> (พบ " + nMan + " แถว) \u2014 " +
        "พวกนี้ทำมือ ไม่ได้อยู่ในไฟล์เจาะอยู่แล้ว</label>"
      : "") +
    '<div id="dstat"></div>';
  $("mfoot").innerHTML =
    '<span class="note">แก้เฉพาะข้อมูลในหน้าจอนี้ ไม่แตะไฟล์ต้นฉบับ</span><span class="sp"></span>' +
    '<button class="cbtn" id="drcancel">ยกเลิก</button>' +
    '<button class="cbtn primary" id="drok" disabled>ล้างช่องที่ไม่มีเจาะ</button>';

  let plan = null, meta = null, deb2, force = false, srcLabel = "";
  const recalc = () => {
    const t2 = T();
    t2.drillText = $("dtext").value;
    meta = parseDrillList(t2.drillText);
    const keepMan = !$("dman") || $("dman").checked;
    if (!meta.read){
      plan = null;
      $("dstat").innerHTML = '<p class="dnote">ยังไม่ได้วางเลขบาร์โค้ด</p>';
      $("drok").disabled = true;
      $("drok").textContent = "ล้างช่องที่ไม่มีเจาะ";
      return;
    }
    plan = scanDrill(t2, meta.codes, keepMan);
    /* กันพลาด: วางมาแล้วไม่ตรงกับไฟล์นี้สักเลขเดียว = แทบจะแน่ว่าวางผิดไฟล์
       ถ้าปล่อยผ่านจะล้างบาร์โค้ดทิ้งทั้งไฟล์ จึงล็อกปุ่มไว้ก่อน ปลดได้ถ้ายืนยัน */
    const noHit = plan.cut.length > 0 && (plan.keep1 + plan.keep2) === 0;
    /* v5.1: บอกให้ชัดว่าเลือกผิดใบตรงไหน ไม่ใช่แค่บอกว่าไม่ตรง */
    const inJobs = jobsOf([...meta.codes]).map(j => j[0]);
    const clash = inJobs.length && bomJobs.length && !inJobs.some(j => bomJobs.includes(j));
    $("dstat").innerHTML = drillStatHTML(t2, plan, meta) +
      (noHit
        ? '<div class="dmiss"><b>ไม่มีเลขไหนตรงกับไฟล์นี้เลยสักตัว</b><br>' +
          (clash
            ? "ไฟล์เจาะเป็นงาน <b>" + esc(inJobs.slice(0, 2).join(", ")) +
              "</b> แต่ BOM ที่เปิดอยู่เป็นงาน <b>" + esc(bomJobs.slice(0, 2).join(", ")) +
              "</b> \u2014 คนละใบกัน<br>"
            : "น่าจะวางมาจากงานคนละใบ หรือรูปแบบเลขคนละแบบ<br>") +
          "ถ้ากดต่อจะล้างบาร์โค้ดทิ้งทั้งไฟล์" +
          '<label class="dryline" style="margin-top:8px"><input type="checkbox" id="dforce"> ' +
          "ตรวจแล้ว ยืนยันว่าวางถูกไฟล์ ให้ล้างได้เลย</label></div>"
        : "");
    if (noHit && $("dforce")){
      $("dforce").checked = force;
      $("dforce").onchange = () => { force = $("dforce").checked; $("drok").disabled = !force; };
    }
    $("drok").disabled = plan.cut.length === 0 || (noHit && !force);
    $("drok").textContent = plan.cut.length
      ? "ล้าง " + plan.cut.length + " ช่อง"
      : "ไม่มีช่องไหนต้องล้าง";
  };
  $("dtext").oninput = () => { srcLabel = ""; clearTimeout(deb2); deb2 = setTimeout(recalc, 150); };
  if ($("dman")) $("dman").onchange = recalc;

  /* ---- รับรายชื่อไฟล์จากโฟลเดอร์ แล้วเทลงช่องข้อความ ใช้ทางเดินเดิมทั้งหมด ---- */
  /* บาร์โค้ด -> ชิ้นงานในไฟล์ ใช้บอกว่าไฟล์ที่เพิ่มมาเป็นชิ้นไหน */
  const pidCol = colIdx(t, "PartId"), pnCol = colIdx(t, "PartName");
  const codeRow = new Map();
  t.rows.forEach(r => [b1, b2].forEach(ci => {
    if (ci < 0) return;
    const v = String(r[ci] ?? "").trim();
    if (v && !codeRow.has(v)){
      codeRow.set(v, (pidCol >= 0 ? String(r[pidCol] ?? "").trim() : "") +
                     (pnCol >= 0 ? " " + String(r[pnCol] ?? "").trim() : ""));
    }
  }));
  const whose = c => (codeRow.get(c) || "").trim();

  const nameList = arr => arr.slice(0, 15).map(n => {
    const c = String(n).replace(/\.[^.]+$/, "");
    const w = whose(c);
    return esc(c) + (w ? " (" + esc(w) + ")" : "");
  }).join("<br>") + (arr.length > 15 ? "<br>\u2026 อีก " + (arr.length - 15) : "");

  /* เทียบไฟล์รอบนี้กับหลักฐานรอบก่อน */
  const diffHTML = (files, prev) => {
    const when = new Date(prev.at).toLocaleString("th-TH");
    const who = prev.by ? " โดย <b>" + esc(prev.by) + "</b>" : "";
    const old = new Map(Object.entries(prev.files || {}));
    if (!old.size){
      return '<p class="dnote">รอบก่อนสแกนเมื่อ ' + esc(when) + who +
        " (" + (prev.count || 0) + " ไฟล์) แต่ไม่ได้เก็บรายชื่อไว้ เทียบทีละไฟล์ไม่ได้</p>";
    }
    const now = new Map(files.map(f => [f.n, f.t]));
    const added = [...now.keys()].filter(n => !old.has(n));
    const gone  = [...old.keys()].filter(n => !now.has(n));
    const edit  = [...now.keys()].filter(n => old.has(n) && old.get(n) && now.get(n) && old.get(n) !== now.get(n));
    if (!added.length && !gone.length && !edit.length){
      return '<p class="dnote" style="color:#1e6b38">เทียบกับรอบก่อนเมื่อ ' + esc(when) + who +
        " \u2014 เหมือนเดิมทุกไฟล์ ไม่มีอะไรเพิ่มหรือหาย</p>";
    }
    return '<div class="dmiss"><b>เทียบกับรอบก่อนเมื่อ ' + esc(when) + who + "</b><br>" +
      (added.length ? "<b>เพิ่มมาใหม่ " + added.length + " ไฟล์</b><br>" + nameList(added) + "<br>" : "") +
      (gone.length  ? "<b>หายไป " + gone.length + " ไฟล์</b><br>" + nameList(gone) + "<br>" : "") +
      (edit.length  ? "<b>ถูกแก้ไข " + edit.length + " ไฟล์</b><br>" + nameList(edit) : "") +
      "</div>";
  };

  /* v5.3/v5.4: รายงานว่าโฟลเดอร์นี้ถูกแตะเมื่อไร และมีอะไรเพิ่มจากรอบก่อน */
  const renderWatch = async (files, label) => {
    const groups = timeGroups(files);
    let html = "";

    if (groups.length){
      html += '<p class="dnote" style="margin-top:9px">เวลาที่ไฟล์ถูกทำ: ' +
        groups.map(g => "<b>" + esc(g.day) + "</b> " + hhmm(g.min) +
          (g.max - g.min > 60000 ? "\u2013" + hhmm(g.max) : "") +
          " (" + g.n + " ไฟล์)").join("  \u00B7  ") + "</p>";
      if (groups.length > 1){
        const main = groups.slice().sort((a, b) => b.n - a.n)[0];
        const late = groups.filter(g => g !== main && g.min > main.max);
        if (late.length){
          html += '<div class="dmiss"><b>มีไฟล์ที่ทำหลังกลุ่มหลัก ' +
            late.reduce((n, g) => n + g.n, 0) + " ไฟล์</b> (" +
            late.map(g => esc(g.day)).join(", ") + ") \u2014 กลุ่มหลักทำวันที่ " +
            esc(main.day) + " ถ้างานนี้ควรจบในรอบเดียว แปลว่ามีการเติมทีหลัง</div>";
        }
      }
    }

    $("dwatch").innerHTML = html + '<p class="dnote">กำลังดึงหลักฐานจากฐานข้อมูล\u2026</p>';

    /* ภาพถ่ายรอบนี้ · ไฟล์เยอะเกินก็เก็บแค่จำนวน */
    const fileMap = {};
    if (files.length <= SNAP_FILES_MAX) files.forEach(f => fileMap[f.n] = f.t || 0);
    const who = ($("dwho") && $("dwho").value.trim()) || "";
    if (who) localStorage.setItem(LS_NAME, who);

    /* 1) หาหลักฐานรอบก่อน — เอาจาก Supabase ก่อน ไม่ได้ค่อยใช้ของในเครื่อง */
    let prev = null, hist = null, remoteErr = "";
    try{
      const rows = await drillScanLoad(label, 6);
      if (rows){
        hist = rows;
        if (rows[0]) prev = { at: rows[0].scanned_at, files: rows[0].files || {},
                              by: rows[0].scanned_by, count: rows[0].file_count };
      } else {
        remoteErr = "ตัวต่อ Supabase ยังไม่พร้อม (เครื่องออกเน็ตไม่ได้?)";
      }
    }catch(e){ remoteErr = e.message || String(e); }

    const snapAll = snapLoad();
    const local = snapAll[label];
    if (!prev && local) prev = { at: local.at, files: local.files || {}, by: "", count: null };

    html += prev
      ? diffHTML(files, prev)
      : '<p class="dnote">ยังไม่เคยมีหลักฐานของงานนี้ เก็บรอบนี้ไว้เป็นรอบแรกแล้ว ' +
        "สแกนซ้ำครั้งหน้าจะบอกได้ว่ามีไฟล์เพิ่มหรือหายไปกี่ไฟล์</p>";

    /* 2) บันทึกรอบนี้ · ขึ้นฐานข้อมูลเป็นหลัก เก็บในเครื่องเป็นสำรองด้วย */
    let saved = "";
    try{
      const ok = await drillScanSave({
        job: label,
        machine: ($("dpath").value.trim().split(/[\\/]/).filter(Boolean).pop() || ""),
        bom_file: t.file,
        scanned_by: who || null,
        file_count: files.length,
        files: fileMap
      });
      if (ok) saved = "เก็บหลักฐานรอบนี้ขึ้น Supabase แล้ว" +
        (files.length > SNAP_FILES_MAX ? " (ไฟล์เยอะเกิน เก็บแค่จำนวน ไม่เก็บรายชื่อ)" : "");
    }catch(e){ remoteErr = remoteErr || e.message || String(e); }

    snapAll[label] = { at: Date.now(), files: fileMap };
    snapSave(snapAll);

    /* 3) ประวัติการสแกนงานนี้ */
    if (hist && hist.length){
      html += '<p class="dnote">ประวัติการสแกนงานนี้: ' +
        hist.slice(0, 5).map(r =>
          new Date(r.scanned_at).toLocaleString("th-TH") +
          (r.scanned_by ? " \u00B7 " + esc(r.scanned_by) : "") +
          " \u00B7 " + r.file_count + " ไฟล์").join("<br>") + "</p>";
    }

    html += remoteErr
      /* v5.7: คนหน้าเครื่องเห็นแค่บรรทัดเดียวว่าเก็บที่ไหน วิธีตั้งค่าเป็นเรื่องผู้ดูแล
         พับไว้หลังลิงก์ ไม่ต้องเอา SQL ไปตั้งขวางหน้าคนที่ไม่ได้ดูแลฐานข้อมูล */
      ? '<p class="dnote">หลักฐานรอบนี้เก็บไว้<b>ในเครื่องนี้</b> ยังไม่ได้ขึ้นฐานข้อมูลกลาง ' +
        "\u2014 ใช้งานได้ตามปกติ แต่เครื่องอื่นจะไม่เห็นหลักฐานชุดนี้  " +
        '<button class="dlink" id="dadmbtn">ผู้ดูแลระบบกดที่นี่</button></p>' +
        '<div class="dadmin" id="dadm">' +
          '<p style="font-size:12px;color:var(--dim);line-height:1.7">' +
          "ต้องสร้างตาราง <code>" + esc(DRILL_TABLE) + "</code> ใน Supabase " +
          "<b>ครั้งเดียวจบ</b> ทำแล้วข้อความนี้จะหายไปเองทุกเครื่อง<br>" +
          "สาเหตุที่ระบบแจ้งมา: " + esc(remoteErr) + "</p>" +
          '<div id="drypre" style="max-height:150px">' + esc(DRILL_SQL) + "</div>" +
          '<button class="cbtn" id="dsql" style="margin-top:8px">คัดลอก SQL</button>' +
        "</div>"
      : '<p class="dnote" style="color:#1e6b38">' + esc(saved) + "</p>";

    $("dwatch").innerHTML = html;
    if ($("dadmbtn")) $("dadmbtn").onclick = () => {
      const box = $("dadm");
      const on = box.className !== "dadmin on";
      box.className = on ? "dadmin on" : "dadmin";
      $("dadmbtn").textContent = on ? "ซ่อนรายละเอียด" : "ผู้ดูแลระบบกดที่นี่";
    };
    if ($("dsql")) $("dsql").onclick = () => {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(DRILL_SQL)
          .then(() => toast("คัดลอก SQL แล้ว วางใน SQL Editor ของ Supabase"),
                () => toast("คัดลอกไม่สำเร็จ"));
      } else {
        const ta = document.createElement("textarea");
        ta.value = DRILL_SQL; document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); toast("คัดลอก SQL แล้ว"); }catch(_){}
        ta.remove();
      }
    };
  };

  const takeNames = (names, label) => {
    /* โฟลเดอร์งานมักมีไฟล์อื่นปนอยู่ (log, รายการงาน) ที่ชื่อมีตัวเลขยาวเหมือนกัน
       ถ้าเจอ .mpr ก็เอาเฉพาะ .mpr ไม่งั้นรับหมดเผื่อโรงงานใช้นามสกุลอื่น */
    const mpr = names.filter(f => /\.mpr$/i.test(f.n));
    const use = mpr.length ? mpr : names;
    const codes = codesFromNames(use);
    if (!codes.length){
      $("dfrom").innerHTML = "<b>ไม่พบชื่อไฟล์ที่เป็นเลขบาร์โค้ดใน " + esc(label) + "</b>";
      return;
    }
    srcLabel = label;
    $("dtext").value = codes.join("\n");
    const jobs = jobsOf(codes);
    $("dfrom").innerHTML = "อ่านจาก <b>" + esc(label) + "</b> \u00B7 " +
      use.length.toLocaleString("th-TH") + " ไฟล์" +
      (mpr.length && mpr.length !== names.length
        ? " .mpr (ข้ามไฟล์อื่น " + (names.length - mpr.length) + ")" : "") +
      " \u00B7 ได้เลข " + codes.length.toLocaleString("th-TH") + " ตัว" +
      (jobs.length

/* โค้ดของแถวนี้อยู่ในระบบแล้วหรือยัง — "yes" / "no" / "" (ไม่มีโค้ดให้เช็ค) */
/* v4.2: คอลัมน์ที่เอาไปเช็คจริง = คอลัมน์ที่เน้น หักตัวที่อยู่ใน noCheck
   ใช้ที่เดียวกันทั้งตอนยิงถาม ตอนทำการ์ด และตอนนับค่ารอเช็ค
   จะได้ไม่หลุดไม่ตรงกันเวลาแก้ทีหลัง */
function checkCols(t){
  const skip = new Set((t.noCheck || []).map(norm));
  return t.hl.filter(i => !skip.has(norm(t.cols[i])));
}

/* v4.0: แถวนี้ถือว่า "ยังไม่มีโค้ด" ถ้าคอลัมน์ที่เน้นตัวใดตัวหนึ่ง
   มีค่าแต่หาไม่เจอในระบบ · ว่างเปล่าก็นับว่ายังไม่มีเหมือนกัน */
function codeState(t, r){
  if (!t.chk) return "";
  let seen = false;
  for (const ci of t.chk.cols){
    const v = String(r[ci] ?? "").trim();
    if (!v) return "no";
    seen = true;
    if (!t.chk.map.has(v)) return "no";
  }
  return seen ? "yes" : "";
}

function syncChkBar(){
  const t = T();
  const has = t.rows.length > 0;
  $("chkbar").className = has ? "on" : "";
  syncFixBtn();
  syncDrillBtn();

  const p = $("chkres");
  if (!t.chk){

    const set = new Set();
    checkCols(t).forEach(ci => t.rows.forEach(r => {
      const v = String(r[ci] ?? "").trim(); if (v) set.add(v);
    }));
    p.className = "pill wait";

    $("onlyno").disabled = missing.length === 0;
    $("onlyno").setAttribute("aria-pressed", String(t.onlyNo));
    $("chkat").textContent = "เช็คเมื่อ " + t.chk.at.toLocaleTimeString("th-TH") +
      "  \u00B7  " + cols.map(i => t.cols[i]).join(", ");
  }
}


/* ───────── กล่องรอแบบมีขั้นตอน (v4.1) ─────────
   เดิมโผล่เฉพาะตอนเช็คโค้ด ตอนนี้ขึ้นตั้งแต่เริ่มอ่านไฟล์
   แล้วไล่ติ๊กทีละขั้น ผู้ใช้จะได้รู้ว่าโปรแกรมกำลังทำอะไรอยู่ */
const STEPS = [
  ["read",  "อ่านไฟล์"],
  ["split", "แยกเข้าแท็บ"],
  ["check", "เช็คโค้ดกับ Supabase"],
  ["fix",   "แก้ X เป็น Y"]
];
let _stepState = {};

function busyRender(){
  $("bsteps").innerHTML = STEPS.map(([id, label]) => {
    const st = _stepState[id] || {};
    const cls = st.done ? "done" : st.run ? "run" : "";
    const mark = st.done ? "\u2713" : st.run ? "<span>\u25CC</span>" : "\u00B7";
    return '<div class="bstep ' + cls + '"><span class="m">' + mark + "</span>" +
      "<span>" + esc(label) + (st.note ? '<span class="d">' + esc(st.note) + "</span>" : "") +
      "</span></div>";
  }).join("");
}
function busyStart(title){
  _stepState = {};
  $("btitle").textContent = title || "กำลังเตรียมข้อมูล";
  $("bnow").textContent = "0"; $("ball").textContent = "0";
  $("bfill").className = "bfill idle"; $("bfill").style.width = "";
  $("bsub").textContent = "";
  busyRender();
  $("busy").className = "on";
}
function busyRun(id, note){
  Object.keys(_stepState).forEach(k => { if (_stepState[k].run) _stepState[k] = { done: true, note: _stepState[k].note }; });
  _stepState[id] = { run: true, note: note || "" };
  busyRender();
}
function busyDone(id, note){
  _stepState[id] = { done: true, note: note !== undefined ? note : (_stepState[id] || {}).note };
  busyRender();
}
function busySkip(id, note){ _stepState[id] = { done: false, note: note || "" }; busyRender(); }
function busyNote(id, note){
  if (!_stepState[id]) _stepState[id] = { run: true };
  _stepState[id].note = note; busyRender();
}
function busyOpen(total, title){
  if ($("busy").className !== "on") busyStart(title);
  else if (title) $("btitle").textContent = title;
  $("bnow").textContent = "0";
  $("ball").textContent = total.toLocaleString("th-TH");
  $("bfill").className = "bfill idle"; $("bfill").style.width = "";
}
function busyStep(done, total, note){
  $("bnow").textContent = done.toLocaleString("th-TH");
  $("bfill").className = "bfill";
  $("bfill").style.width = Math.round(done / Math.max(total, 1) * 100) + "%";
  if (note) $("bsub").textContent = note;
}
function busyClose(){ $("busy").className = ""; }

/* ───────── เช็คโค้ด (v3.7) ─────────
   ไม่มีปุ่มแล้ว เปิดไฟล์เสร็จเช็คให้เองทันที ทั้งแท็บไม้และแท็บ Fitting
   รับ key ของแท็บมาตรง ๆ จะได้ไล่เช็คหลายแท็บได้โดยไม่ต้องสลับหน้าจอ
   auto = true -> ล้มเหลวแล้วไม่ขึ้น toast รบกวน */
async function runCheck(auto, key){
  const k = key || cur, t = TABS[k];
  /* v4.0: รวมค่าจากทุกคอลัมน์ที่เน้น แล้วยิงถามทีเดียว
     การ์ดแต่ละใบจะได้เอาผลไปโชว์ได้หมด ไม่ต้องเช็คทีละคอลัมน์ */
  const cols = checkCols(t);
  const set = new Set();
  cols.forEach(ci => t.rows.forEach(r => {
    const v = String(r[ci] ?? "").trim();
    if (v) set.add(v);
  }));
  const codes = [...set];
  if (!codes.length){
    if (!auto) toast(cols.length ? "ไม่มีค่าให้เช็ค" : "คอลัมน์ที่เน้นอยู่ไม่ได้ตั้งให้เช็คกับ Supabase");
    return;
  }

  const client = getSb();
  if (!client){ if (!auto) toast("ต่อ Supabase ไม่ได้ — ตรวจว่าเครื่องออกอินเทอร์เน็ตได้"); return; }

  busyOpen(codes.length, $("busy").className === "on" ? null : "กำลังเช็คโค้ด \u00B7 " + t.label);

  const map = new Map();
  try{
    /* ยิงทีละก้อน 200 ตัว กัน URL ยาวเกิน และกันเซิร์ฟเวอร์ทำงานหนักทีเดียว */
    for (let i = 0; i < codes.length; i += 200){
      const part = codes.slice(i, i + 200);
      const done = Math.min(i + part.length, codes.length);
      busyStep(i, codes.length, "ก้อนที่ " + (i / 200 + 1) + " \u00B7 " + part[0] + " \u2026");
      const { data, error } = await client
        .from("fitting_global")
        .select("item_number,product_name,unit,search_name")
        .in("item_number", part);
      if (error) throw new Error(error.message);
      (data || []).forEach(d => map.set(String(d.item_number).trim(), d));
      busyStep(done, codes.length, "พบแล้ว " + map.size + " รายการ");
    }
    const missing = codes.filter(c => !map.has(c));
    t.chk = { map, cols, at: new Date(), found: map.size, total: codes.length, missing };
    t.onlyNo = false;
    toast(t.label + ": " + (missing.length
      ? "ยังไม่มีโค้ด " + missing.length + " จาก " + codes.length
      : "มีโค้ดครบทั้ง " + codes.length + " รายการ"));
  }catch(e){
    if (!auto) toast("เช็คไม่สำเร็จ: " + e.message);
    else toast(t.label + ": เช็คไม่สำเร็จ \u2014 " + e.message);
  }finally{
    if (!_checking) busyClose();   // เรียกเดี่ยว ๆ ก็ปิดเอง · ถ้าอยู่ในไปป์ไลน์ให้ scheduleChecks ปิด
    if (cur === k){ syncChkBar(); apply(); }
    else syncTabs();
  }
}

/* v3.7: ไล่เช็คทุกแท็บที่เพิ่งโหลดไฟล์มา ทีละแท็บไม่ให้ชนกัน
   ลากสองไฟล์พร้อมกันก็เช็คให้ทั้งคู่โดยไม่ต้องสลับหน้าจอไปกด */
let _checkTimer = null, _checking = false;
function scheduleChecks(){
  clearTimeout(_checkTimer);
  _checkTimer = setTimeout(async () => {
    if (_checking) return;
    _checking = true;
    try{
      /* 1) เช็คโค้ดทีละแท็บ */
      const todo = ["wood", "fit"].filter(k =>
        TABS[k].needCheck && TABS[k].rows.length && checkCols(TABS[k]).length);
      if (todo.length){
        busyRun("check");
        for (const k of todo){
          TABS[k].needCheck = false;
          busyNote("check", TABS[k].label);
          await runCheck(true, k);
        }
        const sum = todo.map(k => {
          const c = TABS[k].chk;
          return TABS[k].label + " " + (c ? c.found + " มี / " + c.missing.length + " ยังไม่มี" : "ไม่สำเร็จ");
        }).join("  \u00B7  ");
        busyDone("check", sum);
      } else busySkip("check", "ไม่มีคอลัมน์ให้เช็ค");

      /* 2) v4.1: แก้ X เป็น Y ให้เลย ไม่ต้องกดปุ่ม · ย้อนกลับได้ */
      busyRun("fix");
      const fixed = [];
      ["wood", "fit"].forEach(k => {
        const t = TABS[k];
        if (!t.rows.length || t.xy) return;
        const n = applyXY(t);
        if (n) fixed.push(t.label + " " + n + " แถว");
      });
      busyDone("fix", fixed.length ? fixed.join("  \u00B7  ") : "ไม่มี X ต้องแก้");

      syncChkBar(); apply();
      if (fixed.length) toast("แก้ X เป็น Y ให้แล้ว \u2014 " + fixed.join("  \u00B7  ") + "  \u00B7  กดย้อนกลับได้ถ้าไม่ต้องการ");
    } finally {
      _checking = false;
      setTimeout(busyClose, 550);   // ให้เห็นติ๊กครบก่อนปิด
    }
  }, 140);
}

$("onlyno").onclick = function(){
  const t = T();
  t.onlyNo = this.getAttribute("aria-pressed") !== "true";
  this.setAttribute("aria-pressed", String(t.onlyNo));
  apply();
};

/* ───────── กล่องส่งขอโค้ด ───────── */
const LS_NAME = "imosviewer_sender_name";
const LS_TOK  = "dispatch_tokens";          // คีย์เดียวกับแอป Code AX
const LS_DRY  = "imosviewer_dryrun";        // จำว่าเลือกโหมดทดลองไว้ไหม
let departments = [];

async function loadDepartments(){
  const client = getSb();
  if (!client) return;
  try{
    const { data, error } = await client.from("app_config")
      .select("value").eq("key", "departments").maybeSingle();
    if (!error && Array.isArray(data && data.value)) departments = data.value;
  }catch(e){}
}

function closeModal(){
  $("modal").className = "";
  /* v5.0: กล่องเช็คเจาะผูกตัวรับลากวางไว้ที่ mbody ปิดแล้วต้องปลดออก
     ไม่งั้นกล่องอื่นที่ใช้ mbody ร่วมกันจะกลืนไฟล์ที่ลากมาแทนตัวเปิดไฟล์หลัก */
  $("mbody").ondrop = null;
  $("mbody").ondragover = null;
  $("mbody").ondragleave = null;
}
$("mclose").onclick = closeModal;
$("modal").onclick = e => { if (e.target === $("modal")) closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

$("reqgo").onclick = async function(){
  const t = T();
  if (!t.chk || !t.chk.missing.length) return;
  await loadDepartments();

  /* หาแถวตัวอย่างของแต่ละโค้ด เพื่อเติมคำอธิบายตั้งต้นจากคอลัมน์อื่นในไฟล์ */
  /* v4.0: โค้ดอาจมาจากคอลัมน์ไหนก็ได้ในกลุ่มที่เช็ค เก็บไว้ว่ามาจากคอลัมน์ไหน
     จะได้เขียนคำอธิบายตั้งต้นให้ตรงบริบท */
  const sample = new Map();
  t.rows.forEach(r => t.chk.cols.forEach(ci => {
    const v = String(r[ci] ?? "").trim();
    if (v && !sample.has(v)) sample.set(v, { row: r, col: ci });
  }));
  const describe = code => {
    const hit = sample.get(code);
    if (!hit) return "";
    const other = t.cols.map((c, i) => i).filter(i => i !== hit.col).slice(0, 4);
    return t.cols[hit.col] + "  \u00B7  " +
      other.map(i => t.cols[i] + " " + String(hit.row[i] ?? "").trim())
           .filter(x => !/ $/.test(x)).join("  \u00B7  ");
  };

  $("mtitle").textContent = "ส่งขอตั้งโค้ด " + t.chk.missing.length + " รายการ";
  $("mbody").innerHTML =
    '<div class="frow">' +
      '<div class="fld"><label for="mname">ชื่อผู้ส่ง</label>' +
        '<input id="mname" placeholder="ชื่อคุณ" value="' + esc(localStorage.getItem(LS_NAME) || "") + '"></div>' +
      '<div class="fld"><label for="mdept">แผนก</label><select id="mdept">' +
        '<option value="">\u2014 เลือกแผนก \u2014</option>' +
        departments.map(d => '<option value="' + esc(d) + '">' + esc(d) + "</option>").join("") +
      "</select></div>" +
    "</div>" +
    '<div class="frow"><div class="fld"><label for="msubj">หัวเรื่อง</label>' +
      '<input id="msubj" value="ขอตั้งโค้ด Fitting \u2014 ' + esc(t.file) + '"></div></div>' +
    '<div id="mlist"><div class="h"><span></span><span>Code อ้างอิง (จาก BOM)</span><span>คำอธิบาย \u2014 แก้ได้</span></div>' +
    t.chk.missing.map((c, i) =>
      '<div class="mrow"><input type="checkbox" data-i="' + i + '" checked>' +
      '<span class="rc" title="' + esc(c) + '">' + esc(c) + "</span>" +
      '<input class="md" data-i="' + i + '" value="' + esc(describe(c)) + '" placeholder="อธิบายว่าเป็นอะไร"></div>').join("") +
    "</div>";

  /* v3.5: โหมดทดลอง — ติ๊กไว้ให้ตั้งแต่แรก กดแล้วเห็นข้อมูลที่จะส่งจริง
     โดยยังไม่เขียนลง Supabase · ส่วนส่งจริงเขียนไว้ตั้งแต่ v3.0 แต่ยังไม่เคย
     ทดสอบกับ Supabase ของจริง จึงกันพลาดไว้ก่อน */
  const dryPref = localStorage.getItem(LS_DRY);
  const dry = dryPref === null ? true : dryPref === "1";
  $("mbody").insertAdjacentHTML("beforeend",
    '<label class="dryline"><input type="checkbox" id="mdry"' + (dry ? " checked" : "") + ">" +
    "<span><b>โหมดทดลอง — ยังไม่ส่งจริง</b><br>" +
    "กดแล้วจะเห็นข้อมูลที่จะถูกเขียนลง <code>task_tickets</code> โดยไม่แตะฐานข้อมูล " +
    "ตรวจว่าถูกต้องแล้วค่อยปลดติ๊กแล้วกดส่งอีกครั้ง</span></label>");

  const foot = () => {
    const isDry = $("mdry").checked;
    $("mfoot").innerHTML =
      '<span class="note">' + (isDry
        ? "กำลังอยู่ในโหมดทดลอง ไม่มีอะไรถูกเขียนลงฐานข้อมูล"
        : "รายการจะเข้าไปที่แอป ส่งตั้ง Code AX ให้คนตั้งโค้ดรับไปทำ") + "</span>" +
      '<span class="sp"></span>' +
      '<button class="cbtn" id="mcancel">ยกเลิก</button>' +
      '<button class="cbtn ' + (isDry ? "primary" : "warn") + '" id="msend">' +
        (isDry ? "ดูข้อมูลที่จะส่ง" : "ส่งรายการจริง") + "</button>";
    $("mcancel").onclick = closeModal;
    $("msend").onclick = () => sendRequest(t);
  };
  foot();
  $("mdry").onchange = function(){
    localStorage.setItem(LS_DRY, this.checked ? "1" : "0");
    foot();
  };
  $("modal").className = "on";
  setTimeout(() => $("mname").focus(), 60);
};

async function sendRequest(t){
  const btn = $("msend");
  const name = $("mname").value.trim();
  const dept = $("mdept").value;
  const subject = $("msubj").value.trim();
  if (!name){ $("mname").focus(); return toast("ใส่ชื่อผู้ส่งก่อน"); }

  const items = [...$("mlist").querySelectorAll(".mrow")].map((row, i) => {
    if (!row.querySelector('input[type=checkbox]').checked) return null;
    return {
      ref_code: t.chk.missing[i],
      description: row.querySelector(".md").value.trim() || t.chk.missing[i]
    };
  }).filter(Boolean);

  if (!items.length) return toast("ยังไม่ได้เลือกรายการไหนเลย");

  const token = "tk_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  const payload = {
    sender_name: name,
    sender_token: token,
    message: items.length + " รายการ",
    items,
    attachments: [],
    status: "pending",
    department: dept || null,
    subject: subject || null
  };

  /* v3.5: โหมดทดลอง — โชว์ payload ที่จะเขียนลง task_tickets แล้วจบ ไม่แตะฐานข้อมูล */
  const dryEl = $("mdry");
  if (dryEl && dryEl.checked){
    $("mtitle").textContent = "ทดลอง \u2014 ยังไม่ได้ส่ง";
    $("mbody").innerHTML =
      '<p style="font-size:13px;color:var(--dim);line-height:1.7">' +
      "นี่คือข้อมูลที่จะถูกเขียนลงตาราง <code>task_tickets</code> ของ Supabase " +
      "ถ้าปลดติ๊กโหมดทดลองแล้วกดส่ง<br><b>ตอนนี้ยังไม่มีอะไรถูกเขียนลงฐานข้อมูล</b></p>" +
      '<div id="drypre">' + esc(JSON.stringify(payload, null, 2)) + "</div>";
    $("mfoot").innerHTML =
      '<span class="note">ตรวจแล้วถูกต้อง กดย้อนกลับแล้วปลดติ๊กเพื่อส่งจริง</span>' +
      '<span class="sp"></span>' +
      '<button class="cbtn" id="dryback">ย้อนกลับ</button>' +
      '<button class="cbtn primary" id="dryclose">ปิด</button>';
    $("dryclose").onclick = closeModal;
    $("dryback").onclick = () => $("reqgo").click();
    return;
  }

  const client = getSb();
  if (!client) return toast("ต่อ Supabase ไม่ได้");

  btn.disabled = true; btn.textContent = "กำลังส่ง\u2026";
  try{
    const { error } = await client.from("task_tickets").insert(payload);
    if (error) throw new Error(error.message);

    localStorage.setItem(LS_NAME, name);
    try{
      const arr = JSON.parse(localStorage.getItem(LS_TOK) || "[]");
      arr.push(token);
      localStorage.setItem(LS_TOK, JSON.stringify(arr));
    }catch(e){}

    $("mtitle").textContent = "ส่งเรียบร้อย";
    $("mbody").innerHTML =
      '<div id="done"><h4>ส่งขอตั้งโค้ด ' + items.length + ' รายการแล้ว</h4>' +
      "<p>รายการเข้าคิวรอคนตั้งโค้ดรับไปทำแล้ว ติดตามสถานะได้ที่แอป ส่งตั้ง Code AX ด้วยรหัสติดตามนี้</p>" +
      '<div class="tok" id="tok" title="คลิกเพื่อคัดลอก">' + esc(token) + "</div>" +
      '<p><a href="' + CODEAX_URL + '" target="_blank" rel="noopener">เปิดแอป ส่งตั้ง Code AX</a></p></div>';
    $("tok").onclick = () => {
      (navigator.clipboard ? navigator.clipboard.writeText(token) : Promise.reject())
        .then(() => toast("คัดลอกรหัสติดตามแล้ว")).catch(() => {});
    };
    $("mfoot").innerHTML = '<span class="sp"></span><button class="cbtn primary" id="mok">ปิด</button>';
    $("mok").onclick = closeModal;
    toast("ส่งขอโค้ด " + items.length + " รายการแล้ว");
  }catch(e){
    btn.disabled = false; btn.textContent = "ส่งรายการจริง";
    toast("ส่งไม่สำเร็จ: " + e.message);
  }
}

/* ───────── ป้ายเวอร์ชัน (v3.5) ─────────
   ให้รู้ได้ทันทีว่าเปิดไฟล์ตัวไหนอยู่ ไม่ต้องเดาจากชื่อไฟล์ที่เบราว์เซอร์ต่อ (1) (2) ให้ */
$("vbadge").textContent = "v" + APP_META.version;
$("vbadge").title = APP_META.name + " v" + APP_META.version + " · build " + APP_META.build;
$("vbadge").onclick = () => {
  $("mtitle").textContent = APP_META.name + "  v" + APP_META.version;
  $("mbody").innerHTML =
    '<p style="font-size:12.5px;color:var(--dim);margin-bottom:10px">build ' +
    esc(APP_META.build) + "</p>" +
    '<div id="clog">' + APP_META.changelog.map((c, i) =>
      '<div class="cl' + (i === 0 ? " now" : "") + '"><b>v' + esc(c[0]) + "</b>" +
      "<time>" + esc(c[1]) + "</time><p>" + esc(c[2]) + "</p></div>").join("") + "</div>";
  $("mfoot").innerHTML = '<span class="sp"></span><button class="cbtn primary" id="vok">ปิด</button>';
  $("vok").onclick = closeModal;
  $("modal").className = "on";
};

syncTabs();
emptyScreen();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
