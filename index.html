<!DOCTYPE html>
<!--=====================================================================
  RECHECK BOM · APP MANIFEST
  >>> AI/DEV: อ่านบล็อกนี้ก่อนแก้โค้ดทุกครั้ง · แก้เสร็จให้บวกเลข VERSION
      แล้วเพิ่มบรรทัด CHANGELOG ใหม่ไว้บนสุด (ห้ามลบของเก่า)

  APP      : ReCheck Bom   (เดิมชื่อ imos BOM Viewer เปลี่ยนชื่อที่ v4.8)
  VERSION  : ดูที่ APP_META.version ในสคริปต์ (เลขที่แสดงบนหัวแอปอ่านจากที่นั่น)
  BUILD    : ดูที่ APP_META.build
  >>> บวกเลขที่ APP_META เท่านั้น อย่าบวกที่บล็อกนี้
  FILE     : imos-viewer.html
  STACK    : single-file HTML · ไม่มี build step · ไม่ต่อฐานข้อมูล อ่านไฟล์ในเครื่องล้วน
  ENTRY    : ingest() -> apply() -> draw()
  STATE    : TABS.wood / TABS.fit  คือ single source of truth
             >>> ห้ามนิยาม $ / norm / esc / blank / isNum / T() ซ้ำอีก

  --- CHANGELOG (ใหม่สุดอยู่บนสุด) -----------------------------------
  >>> รายการที่ใช้จริงอยู่ที่ APP_META.changelog · ข้างล่างนี้เป็นสำเนา
  v3.5  2026-09-03  FEAT ติดเลขเวอร์ชันบนหัวแอปและชื่อแท็บเบราว์เซอร์
                         คลิกที่เลขเพื่อดู changelog ทั้งหมด จะได้รู้ว่าเปิดไฟล์ถูกตัว
                    FEAT โหมดทดลองในกล่องส่งขอโค้ด — ติ๊กไว้ให้ตั้งแต่แรก
                         กดแล้วโชว์ข้อมูลที่จะส่งจริงโดยยังไม่เขียนลง Supabase
                         ปลดติ๊กเมื่อพร้อมส่งจริง · จำค่าไว้ในเครื่อง
                         (ส่วนตัวส่งจริงเขียนเสร็จตั้งแต่ v3.0 แต่ทดสอบด้วย
                          Supabase จำลองเท่านั้น ยังไม่เคยยิงของจริง)
  v3.4  2026-09-03  CHANGE ย้ายผลเช็คโค้ดออกจากตาราง — เดิมแทรกสามคอลัมน์
                           (มีโค้ด? ชื่อในระบบ หน่วย) เข้าไปปนกับข้อมูลจากไฟล์
                           ทำให้แยกไม่ออกว่าอะไรมาจากไฟล์ อะไรมาจาก Supabase
                           ย้ายไปเป็นการ์ด "ผลเช็คโค้ด" บนแถบสรุปแทน
                           วางไว้ใบแรก กว้างกว่าใบอื่น ตัวที่ยังไม่มีโค้ดขึ้นก่อน
                           คลิกที่โค้ดเพื่อกรองตารางเฉพาะโค้ดนั้นได้เหมือนการ์ดอื่น
                           ตารางกลับไปมีเฉพาะคอลัมน์จากไฟล์ล้วน ๆ
                           (ไฟล์ที่บันทึกออกยังติดสามคอลัมน์นี้ไว้ท้ายตารางเหมือนเดิม)
  v3.3  2026-09-03  CHANGE ปุ่มแก้ X เป็น Y แก้เฉพาะ CutRiteMaterialCode
                           สองคอลัมน์ผิว (SurfaceBeforeCutTop/BottomCode)
                           ไม่ถูกแตะ เก็บ X ไว้ใช้ recheck ว่าแถวไหนเคยแก้
                           ค่าใน CutRiteMaterialCode คือ prefix + โค้ดผิวบน +
                           โค้ดผิวล่าง จึงขึ้นต้นด้วย PB/MD ไม่ใช่ G
                           กฎ "ขึ้นต้น G ลงท้าย X" ใช้ตรง ๆ ไม่ได้
                           -> ใช้ค่าในสองคอลัมน์ผิวของแถวนั้นเป็นตัวชี้ว่า
                              ต้องแทนช่วงไหน ไม่ต้องเดาความยาวโค้ด
                           ถ้าไม่มีคอลัมน์ผิว ตกไปใช้กฎเดิมกับตัวค่าเต็ม
  v3.2  2026-09-03  FEAT เปิดไฟล์เสร็จเช็คโค้ดกับ Supabase ให้เลย ไม่ต้องกดเอง
                         (ถ้าเน็ตไม่ได้หรือ error ก็เงียบ ๆ ให้กดเช็คเองทีหลัง)
                    FEAT ดึงรายละเอียดจาก fitting_global มาโชว์เป็นคอลัมน์
                         ชื่อในระบบ (product_name) และ หน่วย (unit)
                         ติดไปกับไฟล์ที่บันทึกออกด้วย
                    FEAT กล่องแสดงความคืบหน้าระหว่างเช็ค — บอกว่าเช็คถึงโค้ดที่เท่าไร
                         จากทั้งหมดเท่าไร พร้อมแถบวิ่ง
                    REFACTOR ย้ายตรรกะเช็คออกจาก onclick มาเป็น runCheck()
                             จะได้เรียกได้ทั้งตอน import อัตโนมัติและตอนกดปุ่ม
  v3.1  2026-09-03  FIX  เลือกสองไฟล์พร้อมกันแล้วเข้าแท็บเดียวกันทั้งคู่
                         ไฟล์จริงชื่อ export_item_... กับ export_fitting_...
                         ตัวแรกไม่มีคำว่า wood/part กฎเดาชื่อจึงตกไปเข้า fit
                         ทับไฟล์ fitting ที่โหลดก่อนหน้า -> สองแท็บขึ้น 194 เท่ากัน
                         เลิกเดาจากชื่อไฟล์เป็นหลัก อ่านทั้งสองไฟล์ให้จบก่อน
                         แล้วให้คะแนนจากหัวคอลัมน์ ใครตรงกับแท็บไหนมากกว่าได้ไป
                         ถ้าแย่งแท็บเดียวกัน คนคะแนนสูงกว่าได้ อีกคนไปอีกแท็บ
                    FEAT ปุ่ม "แก้ X เป็น Y" — หาค่าที่ขึ้นต้น G ลงท้าย X
                         ในคอลัมน์ที่เน้น แสดงตัวอย่างก่อนว่าจะเปลี่ยนอะไรเป็นอะไร
                         กี่ช่อง แล้วค่อยยืนยัน · เลือกให้อัปเดต
                         CutRiteMaterialCode ที่ประกอบจากโค้ดนั้นตามไปด้วยได้
                    FEAT ส่งออกเป็น .xlsx แทน CSV (ไฟล์นำเข้าเป็น xlsx อยู่แล้ว)
                         ถ้าตัวเขียน xlsx โหลดไม่ได้ ตกไปเป็น CSV ให้อัตโนมัติ
  v3.0  2026-09-03  FEAT เช็คโค้ดกับ Supabase — ยิงถาม fitting_global.item_number
                         ทีละก้อน 200 ตัวด้วย .in() แล้วทำเครื่องหมายว่าโค้ดไหน
                         มีในระบบแล้ว โค้ดไหนยังไม่มี · อ่านอย่างเดียว ไม่เขียนทับ
                    FEAT ตัวที่ยังไม่มี กดส่งขอโค้ดเข้า task_tickets ได้เลย
                         รูปแบบ items:[{ref_code,description}] ตรงกับที่แอป
                         "ส่งตั้ง Code AX" ใช้อยู่ คนตั้งโค้ดเห็นรายการทันที
                    FEAT แท็บ Fitting ตั้งคอลัมน์เริ่มต้นเป็น ItemId ตามไฟล์จริง
                    NOTE anon key เป็นคีย์สาธารณะชุดเดียวกับที่แอป Code AX
                         ใช้อยู่บน GitHub Pages ไม่ใช่ความลับ
  v2.0  2026-09-03  FEAT รับสองไฟล์ แยกเป็นสองแท็บ BOM ไม้ / BOM Fitting
                    FEAT แผงสรุปค่าในคอลัมน์ที่เน้น — บอกว่ามีค่าอะไรบ้าง
                         อย่างละกี่ชิ้น รวม Qty เท่าไร คิดเป็นกี่เปอร์เซ็นต์
                         คลิกที่ค่าเพื่อกรองตารางเฉพาะค่านั้น
                    FEAT เลือกเองได้ว่าจะเน้นคอลัมน์ไหน (แท็บ Fitting
                         ยังไม่รู้โครงคอลัมน์ จึงเดาจากชื่อที่มีคำว่า code)
                    FEAT ปุ่มคัดลอกรายการโค้ด เตรียมวางเข้าแอป ส่งตั้ง Code AX
  v1.0  2026-09-03  ไฟล์แรก — อัปโหลด CSV/XLSX แล้วเน้นสามคอลัมน์วัสดุกับผิว

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReCheck Bom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F3864; --navy-2:#2c4a7c; --orange:#E8901F;
  --ink:#1d1d1f; --dim:#5f5f66; --faint:#9a9aa2;
  --line:rgba(0,0,0,.10); --line-2:rgba(0,0,0,.20);
  --page:#eef0f4; --card:#fff; --hover:#f5f7fb;
  --hl-bg:#fdf1e0; --hl-line:#f0d5ac; --hl-ink:#7a4a08; --hl-hover:#fbe8cf;
  --miss-bg:#fdecec; --miss-line:#f2c9c9; --miss-ink:#a32d2d;
  --sans:"Sarabun",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--page);color:var(--ink);font-size:14px;
     display:flex;flex-direction:column;overflow:hidden}

/* ── แถบบน ── */
header{flex:0 0 auto;height:50px;background:var(--navy);color:#fff;
       display:flex;align-items:center;gap:8px;padding:0 12px}
.brand{font-weight:600;font-size:15px;white-space:nowrap;margin-right:4px}
.brand span{color:var(--orange)}
.vbadge{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.2px;
        background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);
        color:rgba(255,255,255,.86);border-radius:20px;padding:3px 9px;cursor:pointer;
        margin-right:2px;white-space:nowrap}
.vbadge:hover{background:var(--orange);border-color:var(--orange);color:#3a2200}
#clog{font-family:var(--mono);font-size:12px;line-height:1.75}
#clog .cl{display:grid;grid-template-columns:52px 84px 1fr;gap:10px;padding:8px 2px;
          border-bottom:1px solid var(--line);align-items:start}
#clog .cl:last-child{border-bottom:0}
#clog .cl.now{background:#fff6e7;box-shadow:inset 3px 0 0 var(--orange);
              padding-left:9px;border-radius:4px}
#clog b{color:var(--navy)}
#clog time{color:var(--faint);font-size:11px}
#clog p{font-family:var(--sans);font-size:12.5px;color:var(--dim);margin:0}
.dryline{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;margin-top:12px;
         padding:10px 12px;border:1px solid var(--hl-line);background:var(--hl-bg);
         border-radius:9px;cursor:pointer;color:var(--hl-ink);line-height:1.6}
.dryline input{accent-color:var(--orange);cursor:pointer;margin-top:2px}
#drypre{font-family:var(--mono);font-size:11px;background:var(--page);border:1px solid var(--line-2);
        border-radius:8px;padding:12px 14px;margin-top:12px;white-space:pre-wrap;word-break:break-all;
        max-height:280px;overflow:auto;text-align:left;color:var(--ink)}
header .sp{flex:1}
.btn{font-family:var(--sans);font-size:13px;border-radius:7px;padding:7px 13px;cursor:pointer;
     white-space:nowrap;background:none;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.92)}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.go{background:var(--orange);border-color:var(--orange);color:#3a2200;font-weight:600}
.btn.go:hover{filter:brightness(1.07)}
.btn[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#3a2200;font-weight:600}
.btn:disabled{opacity:.38;cursor:default}
#find{font-family:var(--mono);font-size:13px;width:170px;padding:7px 10px;border-radius:7px;
      background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;outline:0}
#find::placeholder{color:rgba(255,255,255,.42);font-family:var(--sans)}
#find:focus{border-color:var(--orange);background:rgba(255,255,255,.18)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
#pick,#dpick{display:none}

/* ── แท็บ ── */
#tabs{flex:0 0 auto;display:flex;align-items:stretch;background:var(--navy);
      padding:0 12px;gap:2px;border-bottom:1px solid rgba(0,0,0,.2)}
.tab{font-family:var(--sans);font-size:13px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);
     border:0;border-radius:8px 8px 0 0;padding:9px 18px;cursor:pointer;display:flex;
     align-items:center;gap:8px;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.16);color:#fff}
.tab.on{background:var(--card);color:var(--ink);font-weight:600}
.tab .n{font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.10);
        border-radius:9px;padding:1px 7px;color:inherit;opacity:.75}
.tab.on .n{background:var(--hl-bg);color:var(--hl-ink);opacity:1}
.tab.empty .n{display:none}

/* ── แถบสถิติ ── */
#bar{flex:0 0 auto;display:none;align-items:center;gap:0;background:var(--card);
     border-bottom:1px solid var(--line);padding:8px 12px;overflow-x:auto}
#bar.on{display:flex}
.stat{display:flex;flex-direction:column;padding:0 15px;border-right:1px solid var(--line);white-space:nowrap}
.stat:first-child{padding-left:0}
.stat:last-child{border-right:0}
.stat b{font-family:var(--mono);font-size:15px;font-weight:600;line-height:1.3}
.stat b.hl{color:var(--hl-ink)}
.stat b.bad{color:var(--miss-ink)}
.stat i{font-style:normal;font-size:10.5px;color:var(--faint);line-height:1.3}

/* ── แผงสรุปค่าในคอลัมน์ที่เน้น (ข้อ 2) ── */
/* ── โครงสองฝั่ง (v4.0) ── ซ้าย = ตารางจากไฟล์ · ขวา = การ์ดสรุป */
#main{flex:1;display:flex;min-height:0;overflow:hidden}
/* v4.3: ซ้ายกว้างตามเนื้อตาราง ที่เหลือยกให้ขวา (เดิมล็อกขวาไว้ 44% ตายตัว
   แท็บ Fitting มี 4 คอลัมน์ ครึ่งจอซ้ายเลยว่างเปล่า) */
#side{flex:1 1 auto;min-width:320px;display:none;flex-direction:column;
      overflow:auto;background:var(--page)}
#side.on{display:flex}
#gutter{flex:0 0 7px;display:none;cursor:col-resize;background:var(--line);
        position:relative;touch-action:none}
#gutter.on{display:block}
#gutter:hover,#gutter.drag{background:var(--orange)}
#gutter::after{content:"";position:absolute;inset:0 -4px}
body.resizing{cursor:col-resize;user-select:none}
#sum{display:flex;flex-direction:column;gap:10px;padding:10px}

.sumcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex:0 0 auto}
.sumcard>h3{font-size:11.5px;font-weight:600;padding:7px 11px;background:var(--hl-bg);
            color:var(--hl-ink);border-bottom:1px solid var(--hl-line);
            display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);
            position:sticky;top:0;z-index:1}
.sumcard>h3 em{font-style:normal;font-weight:400;opacity:.8}
.sumcard>h3 em i{font-style:normal;color:#1e6b38;font-weight:600}
.sumcard>h3 em u{text-decoration:none;color:var(--miss-ink);font-weight:600}

/* แถวในการ์ด: ค่า | สถานะ | ชื่อในระบบ */
.vrow{display:grid;grid-template-columns:minmax(96px,auto) 86px 1fr;gap:9px;align-items:start;
      padding:6px 11px;border-bottom:1px solid var(--line);cursor:pointer}
.vrow:last-child{border-bottom:0}
.vrow:hover{background:var(--hover)}
.vrow.sel{background:#fff6e7;box-shadow:inset 3px 0 0 var(--orange)}
.vrow .v{font-family:var(--mono);font-size:11.5px;word-break:break-all;line-height:1.45}
.vrow .v.none{color:var(--miss-ink);font-weight:600}
.vrow .st{font-family:var(--mono);font-size:10.5px;white-space:nowrap;line-height:1.55}
.vrow.yes .st{color:#1e6b38}
.vrow.no  .st{color:var(--miss-ink);font-weight:600}
.vrow .st.wait{color:var(--faint)}
.vrow .nm{font-size:11.5px;color:var(--ink);line-height:1.5;word-break:break-word}
.vrow.no .nm{color:var(--faint);font-style:italic}
.vrow .st .u{font-family:var(--mono);font-size:10px;font-weight:600;opacity:.72;margin-left:2px}

/* ── ตาราง ── */
#wrap{flex:0 0 auto;min-width:280px;overflow:auto;background:var(--card);position:relative}
#wrap.solo{flex:1 1 auto}
/* v4.6: ตารางแน่นขึ้น เห็นคอลัมน์ได้มากขึ้นราว 25% ต่อความกว้างเท่าเดิม */
table{border-collapse:separate;border-spacing:0;font-size:11px;white-space:nowrap}
thead th{position:sticky;top:0;z-index:3;background:var(--navy);color:#fff;font-weight:500;
         text-align:left;padding:5px 7px;font-size:10.5px;
         border-right:1px solid var(--navy-2);cursor:pointer;user-select:none}
thead th:hover{background:var(--navy-2)}
thead th.hl{background:var(--orange);color:#3a2200;font-weight:600;border-right-color:#c8790f}
thead th .ar{opacity:.55;font-size:8px;margin-left:2px}
tbody td{padding:3px 7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
         font-family:var(--mono);font-size:11px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover td{background:var(--hover)}
td.hl{background:var(--hl-bg);color:var(--hl-ink);font-weight:600;
      border-right:1px solid var(--hl-line);border-bottom-color:var(--hl-line)}
tbody tr:hover td.hl{background:var(--hl-hover)}
td.miss{background:var(--miss-bg);color:var(--miss-ink);font-weight:600;border-right-color:var(--miss-line)}
tbody tr:hover td.miss{background:#fbe0e0}
td.rn{position:sticky;left:0;z-index:2;background:var(--card);color:var(--faint);
      text-align:right;border-right:1px solid var(--line-2)}
thead th.rn{z-index:4;background:var(--navy);cursor:default}
tbody tr:hover td.rn{background:var(--hover)}
td.n{text-align:right}
td.e{color:#c9c9cf}
mark{background:#ffe8a3;color:inherit;border-radius:2px;padding:0 1px}

/* ── แถวที่ตัวแก้ X เป็น Y ไปแตะ (v4.4) ── */
tbody tr.ed td{background:#fff9ef}
tbody tr.ed:hover td{background:#fdf0dc}
tbody tr.ed td.rn{background:#fdf1e0;color:var(--hl-ink);font-weight:600;
                  box-shadow:inset 3px 0 0 var(--orange)}
tbody tr.ed:hover td.rn{background:#fbe8cf}
tbody tr.ed td.hl{background:#fdeed8}
tbody tr.ed:hover td.hl{background:#fae2c2}

/* ── หน้าเปล่า / ผิดพลาด ── */
#drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:13px;background:var(--card);padding:36px;text-align:center}
#drop.off{display:none}
#drop.over{background:#fdf6ec;outline:2px dashed var(--orange);outline-offset:-14px}
#drop h2{font-size:17px;font-weight:600}
#drop p{font-size:13px;color:var(--dim);max-width:54ch;line-height:1.7}
#drop code{font-family:var(--mono);background:var(--page);padding:2px 6px;border-radius:4px;font-size:11.5px}
#drop .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#drop .chip{font-family:var(--mono);font-size:11px;background:var(--hl-bg);color:var(--hl-ink);
            border:1px solid var(--hl-line);border-radius:5px;padding:3px 8px}
#drop.err h2{color:#b3261e}

/* ── แผงเลือกคอลัมน์ที่จะเน้น ── */
#colpanel{position:absolute;right:12px;top:8px;z-index:20;display:none;background:var(--card);
          border:1px solid var(--line-2);border-radius:10px;box-shadow:0 12px 32px -10px rgba(0,0,0,.3);
          width:300px;max-height:60vh;overflow:auto;padding:6px}
#colpanel.on{display:block}
#colpanel h4{font-size:11.5px;color:var(--dim);font-weight:500;padding:7px 9px 6px}
#colpanel label{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:6px;
                cursor:pointer;font-family:var(--mono);font-size:11.5px}
#colpanel label:hover{background:var(--hover)}
#colpanel input{accent-color:var(--orange);cursor:pointer}

/* ── เมนูบันทึกไฟล์ (v4.7) ── เลือกนามสกุลก่อนเขียนไฟล์ */
.menuwrap{position:relative;display:flex}
.btn .cv{font-size:10px;opacity:.7;margin-left:3px}
#savemenu{position:absolute;right:0;top:calc(100% + 7px);z-index:30;display:none;
          background:var(--card);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;
          box-shadow:0 12px 32px -10px rgba(0,0,0,.35);width:268px;padding:6px;text-align:left}
#savemenu.on{display:block}
#savemenu h4{font-size:11.5px;color:var(--dim);font-weight:500;padding:7px 9px 6px}
#savemenu .mi{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:0;
              border-radius:7px;background:none;cursor:pointer;text-align:left;font-family:var(--sans)}
#savemenu .mi:hover{background:var(--hover)}
#savemenu .mi b{font-family:var(--mono);font-size:12.5px;color:var(--navy);min-width:44px}
#savemenu .mi i{font-style:normal;font-size:11.5px;color:var(--dim);line-height:1.45;flex:1}
#savemenu .mi .tag{font-size:10px;font-weight:600;border-radius:20px;padding:2px 7px;
                   background:var(--hl-bg);color:var(--hl-ink);border:1px solid var(--hl-line);white-space:nowrap}
#savemenu .foot{border-top:1px solid var(--line);margin-top:5px;padding:8px 9px 4px;
                font-size:11.5px;color:var(--dim);line-height:1.6}
#savemenu .scope{display:flex;gap:5px;margin-top:7px}
#savemenu .scope button{flex:1;font-family:var(--sans);font-size:11.5px;padding:5px 6px;border-radius:6px;
                        border:1px solid var(--line-2);background:var(--card);color:var(--ink);cursor:pointer}
#savemenu .scope button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);
                                             color:#3a2200;font-weight:600}

/* ── แถบเช็คโค้ด ── */
#chkbar{flex:0 0 auto;display:none;align-items:center;gap:8px;background:var(--card);
        border-bottom:1px solid var(--line);padding:7px 12px;overflow-x:auto;white-space:nowrap}
#chkbar.on{display:flex}
#chkbar label{font-size:11.5px;color:var(--dim)}
#chkbar select{font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:6px;
               border:1px solid var(--line-2);background:var(--card);color:var(--ink);cursor:pointer}
.cbtn{font-family:var(--sans);font-size:12.5px;border-radius:7px;padding:6px 13px;cursor:pointer;
      border:1px solid var(--line-2);background:var(--card);color:var(--ink);white-space:nowrap}
.cbtn:hover{background:var(--hover)}
.cbtn.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.cbtn.primary:hover{background:var(--navy-2)}
.cbtn.warn{background:var(--miss-ink);border-color:var(--miss-ink);color:#fff;font-weight:600}
.cbtn.warn:hover{filter:brightness(1.1)}
.cbtn:disabled{opacity:.38;cursor:default;filter:none}
.cbtn[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#3a2200;font-weight:600}
.pill{font-family:var(--mono);font-size:11.5px;border-radius:20px;padding:4px 11px;font-weight:600}
.pill.good{background:#e6f4ea;color:#1e6b38;border:1px solid #bfe3cb}
.pill.bad{background:var(--miss-bg);color:var(--miss-ink);border:1px solid var(--miss-line)}
.pill.wait{background:var(--page);color:var(--dim);border:1px solid var(--line-2)}
#chkbar .sp{flex:1}

/* ── ช่องสถานะในตาราง ── */
td.st{font-family:var(--mono);font-size:11px;text-align:center;position:sticky;left:44px;z-index:2;
      background:var(--card);border-right:1px solid var(--line-2)}
thead th.st{position:sticky;left:44px;z-index:4;background:var(--navy);cursor:default}
tbody tr:hover td.st{background:var(--hover)}
td.st.yes{color:#1e6b38;background:#eef7f1}
td.st.no{color:var(--miss-ink);background:var(--miss-bg);font-weight:600}
tbody tr:hover td.st.yes{background:#e2f1e8}
tbody tr:hover td.st.no{background:#fbe0e0}

/* ── กล่องส่งขอโค้ด ── */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
       background:rgba(20,25,40,.5);padding:20px}
#modal.on{display:flex}
.sheet{background:var(--card);border-radius:14px;width:min(760px,100%);max-height:88vh;
       display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px -18px rgba(0,0,0,.45)}
.sheet>h3{font-size:15px;font-weight:600;padding:15px 18px;border-bottom:1px solid var(--line);
          display:flex;align-items:center;gap:10px}
.sheet>h3 .x{margin-left:auto;cursor:pointer;color:var(--faint);font-size:20px;line-height:1;
             background:none;border:0;padding:2px 6px;border-radius:6px}
.sheet>h3 .x:hover{background:var(--page);color:var(--ink)}
.sbody{padding:14px 18px;overflow:auto;flex:1}
.frow{display:flex;gap:10px;margin-bottom:11px}
.fld{flex:1;display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11.5px;color:var(--dim)}
.fld input,.fld select{font-family:var(--sans);font-size:13px;padding:8px 10px;border-radius:7px;
                       border:1px solid var(--line-2);background:var(--card);color:var(--ink);outline:0;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--orange)}
#mlist{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
#mlist .h{display:grid;grid-template-columns:26px 1fr 1.4fr;gap:8px;padding:7px 10px;
          background:var(--page);font-size:11px;color:var(--dim);border-bottom:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:26px 1fr 1.4fr;gap:8px;padding:5px 10px;
      border-bottom:1px solid var(--line);align-items:center}
.mrow:last-child{border-bottom:0}
.mrow .rc{font-family:var(--mono);font-size:12px;color:var(--miss-ink);font-weight:600;
          overflow:hidden;text-overflow:ellipsis}
.mrow input{font-family:var(--sans);font-size:12.5px;padding:5px 8px;border-radius:6px;
            border:1px solid var(--line);outline:0;width:100%;background:var(--card);color:var(--ink)}
.mrow input:focus{border-color:var(--orange)}
.mrow input[type=checkbox]{width:auto;accent-color:var(--orange);cursor:pointer}
.sfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sfoot .sp{flex:1}
.sfoot .note{font-size:11.5px;color:var(--faint)}
/* ── กล่องรอระหว่างเช็คโค้ด ── */
#busy{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;
      background:rgba(255,255,255,.72)}
#busy.on{display:flex}
.bcard{background:var(--card);border:1px solid var(--line-2);border-radius:14px;
       box-shadow:0 20px 50px -18px rgba(0,0,0,.32);padding:22px 26px;width:min(340px,86vw);text-align:center}
.bcard .bt{font-size:14px;font-weight:600;margin-bottom:3px}
.bcard .bsub{font-size:11.5px;color:var(--faint);margin-top:9px;font-family:var(--mono);
             min-height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard{width:min(400px,90vw)}
#bsteps{text-align:left;margin:14px 0 4px;display:flex;flex-direction:column;gap:1px}
.bstep{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:baseline;
       font-size:12.5px;color:var(--faint);padding:3px 0;line-height:1.5}
.bstep .m{font-family:var(--mono);font-size:11px;text-align:center}
.bstep.run{color:var(--ink);font-weight:500}
.bstep.run .m{color:var(--orange)}
.bstep.done{color:var(--dim)}
.bstep.done .m{color:#1e6b38}
.bstep .d{font-size:11px;color:var(--faint);font-family:var(--mono);display:block;font-weight:400}
@keyframes spin{to{transform:rotate(360deg)}}
.bstep.run .m span{display:inline-block;animation:spin 1s linear infinite}
@media(prefers-reduced-motion:reduce){ .bstep.run .m span{animation:none} }

/* ── เช็คไฟล์เจาะ (v4.9 · เลือกโฟลเดอร์ v5.0) ── */
.dsrc{border:1px solid var(--line);border-radius:10px;padding:11px 12px;
      background:var(--page);margin-bottom:13px}
.dsrc.over{border-color:var(--orange);background:var(--hl-bg)}
.dsrc .frow{margin-bottom:0}
#dpath{font-family:var(--mono);font-size:12px}
.drow{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.drow .note{font-size:11.5px;color:var(--dim);line-height:1.5}
.drow .note b{color:var(--hl-ink)}
.dlab{font-size:11.5px;color:var(--dim);margin:2px 0 5px;display:block}
/* v5.7: เรื่องตั้งค่าฐานข้อมูลเป็นงานผู้ดูแล ไม่ใช่งานคนหน้าเครื่อง พับไว้ก่อน */
.dlink{font-family:var(--sans);font-size:11.5px;background:none;border:0;padding:0;
       color:var(--navy);text-decoration:underline;cursor:pointer}
.dlink:hover{color:var(--orange)}
.dadmin{display:none;margin-top:9px;padding:10px 12px;border:1px solid var(--line-2);
        border-radius:9px;background:var(--card)}
.dadmin.on{display:block}
#dtext{font-family:var(--mono);font-size:12px;width:100%;height:150px;padding:10px 12px;
       border:1px solid var(--line-2);border-radius:9px;outline:0;resize:vertical;
       background:var(--card);color:var(--ink);line-height:1.65}
#dtext:focus{border-color:var(--orange)}
.dstat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.dstat>div{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--page)}
.dstat b{display:block;font-family:var(--mono);font-size:17px;font-weight:600;color:var(--navy);line-height:1.3}
.dstat b.cut{color:var(--miss-ink)}
.dstat b.keep{color:#1e6b38}
.dstat i{font-style:normal;font-size:10.5px;color:var(--faint);line-height:1.35;display:block;margin-top:2px}
.dnote{font-size:12px;color:var(--dim);line-height:1.65;margin-top:11px}
.dmiss{font-family:var(--mono);font-size:11.5px;background:var(--miss-bg);border:1px solid var(--miss-line);
       color:var(--miss-ink);border-radius:9px;padding:9px 11px;margin-top:10px;
       max-height:120px;overflow:auto;word-break:break-all;line-height:1.7}
/* ช่องที่ถูกล้างเพราะไม่มีเจาะ — เอาเมาส์ชี้เพื่อดูเลขเดิม */
tbody tr td.cleared{background:var(--miss-bg);color:var(--miss-ink);font-weight:600}
tbody tr:hover td.cleared{background:#fadfdf}

/* ปุ่มย้อนกลับการแก้ X เป็น Y */
.undo{background:var(--hl-bg);border-color:var(--hl-line);color:var(--hl-ink);font-weight:600}
.undo:hover{background:#fbe8cf}
.bnum{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin-bottom:11px}
.bnum b{font-size:20px;color:var(--navy);font-weight:600}
.btrack{height:6px;border-radius:4px;background:var(--page);overflow:hidden;position:relative}
.bfill{height:100%;width:0;border-radius:4px;background:var(--orange);transition:width .28s ease}
.bfill.idle{width:35%;animation:slide 1.15s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@media(prefers-reduced-motion:reduce){ .bfill.idle{animation:none;width:100%} }

/* คอลัมน์รายละเอียดที่ดึงมาจาก Supabase */
td.dt{color:var(--dim);font-size:11.5px;max-width:260px}
thead th.dt{background:#2a4a7a;color:#dbe6f5;font-weight:500}
tbody tr:hover td.dt{background:var(--hover)}

#xylist{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
#xylist .h{display:grid;grid-template-columns:1.1fr 1.3fr 1.3fr auto;gap:9px;padding:7px 11px;
           background:var(--page);font-size:11px;color:var(--dim);border-bottom:1px solid var(--line)}
.xyrow{display:grid;grid-template-columns:1.1fr 1.3fr 1.3fr auto;gap:9px;padding:6px 11px;
       border-bottom:1px solid var(--line);align-items:center;font-family:var(--mono);font-size:12px}
.xyrow:last-child{border-bottom:0}
.xyrow .col{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.xyrow .from{color:var(--miss-ink);font-weight:600}
.xyrow .to{color:#1e6b38;font-weight:600}
.xyrow .cnt{color:var(--dim);font-size:11px}
.chkline{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:11px;cursor:pointer}
.chkline input{accent-color:var(--orange);cursor:pointer}
#done{text-align:center;padding:30px 20px}
#done h4{font-size:16px;font-weight:600;color:#1e6b38;margin-bottom:8px}
#done p{font-size:13px;color:var(--dim);line-height:1.75;max-width:46ch;margin:0 auto}
#done .tok{font-family:var(--mono);font-size:13px;background:var(--page);border:1px solid var(--line-2);
           border-radius:7px;padding:8px 13px;display:inline-block;margin:12px 4px;cursor:pointer}
#done a{color:var(--navy);font-weight:600}

footer{flex:0 0 auto;height:29px;display:flex;align-items:center;gap:12px;padding:0 12px;
       background:var(--card);border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
footer .sp{flex:1}
footer .mono{font-family:var(--mono)}
#toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:var(--navy);
       color:#fff;font-size:13px;padding:10px 18px;border-radius:9px;opacity:0;pointer-events:none;
       transition:opacity .18s;z-index:50}
#toast.on{opacity:1}
@media(max-width:820px){ .brand,.stat i{display:none} #find{width:110px} }
</style>
</head>
<body>

<header>
  <div class="brand">ReCheck <span>Bom</span></div>
  <button class="vbadge" id="vbadge" title="คลิกดูประวัติรุ่น">v?</button>
  <button class="btn go" id="open">เปิดไฟล์เข้าแท็บนี้</button>
  <input type="file" id="pick" accept=".xlsx,.xls,.csv,.txt,.tsv" multiple>
  <input type="file" id="dpick" webkitdirectory directory multiple>
  <input id="find" placeholder="ค้นหา" autocomplete="off" spellcheck="false">
  <button class="btn" id="only" aria-pressed="false" title="แสดงเฉพาะแถวที่คอลัมน์เน้นยังว่าง">เฉพาะที่ยังว่าง</button>
  <div class="sp"></div>
  <button class="btn" id="colbtn" disabled>คอลัมน์ที่เน้น</button>
  <button class="btn" id="copy" disabled title="คัดลอกรายการโค้ดไม่ซ้ำ ไว้วางในแอปส่งตั้ง Code AX">คัดลอกโค้ด</button>
  <div class="menuwrap">
    <button class="btn" id="csv" disabled aria-haspopup="true" aria-expanded="false"
            title="เลือกได้ว่าจะบันทึกเป็น .csv หรือ .xlsx">บันทึกไฟล์ <span class="cv">&#9662;</span></button>
    <div id="savemenu"></div>
  </div>
</header>

<div id="tabs">
  <button class="tab on empty" data-t="wood">BOM ไม้ <span class="n">0</span></button>
  <button class="tab empty" data-t="fit">BOM Fitting <span class="n">0</span></button>
</div>

<div id="chkbar">
  <span class="pill wait" id="chkres">ยังไม่ได้เช็ค</span>
  <button class="cbtn warn" id="reqgo" disabled>ส่งขอโค้ด</button>
  <button class="cbtn" id="onlyno" aria-pressed="false" disabled>เฉพาะที่ยังไม่มีโค้ด</button>
  <button class="cbtn" id="fixxy" disabled title="ค่าที่ขึ้นต้นด้วย G และลงท้ายด้วย X ในคอลัมน์ที่เน้น">แก้ X เป็น Y</button>
  <button class="cbtn" id="onlyed" aria-pressed="false" style="display:none">เฉพาะแถวที่แก้</button>
  <button class="cbtn undo" id="undoxy" style="display:none">ย้อนกลับ</button>
  <button class="cbtn" id="drill" disabled title="วางเลข Barcode จากไฟล์เจาะ แล้วล้างช่องที่ไม่มีเจาะจริง">เช็คไฟล์เจาะ</button>
  <button class="cbtn undo" id="undodr" style="display:none">ย้อนกลับเจาะ</button>
  <span class="sp"></span>
  <span class="note" id="chkat" style="font-size:11px;color:var(--faint)"></span>
</div>

<div id="bar"></div>

<div id="main">
<div id="wrap">
  <table><thead id="head"></thead><tbody id="body"></tbody></table>
  <div id="colpanel"></div>
  <div id="busy"><div class="bcard">
    <div class="bt" id="btitle">กำลังเช็คโค้ดกับ Supabase</div>
    <div id="bsteps"></div>
    <div class="bnum"><b id="bnow">0</b> / <span id="ball">0</span> โค้ด</div>
    <div class="btrack"><div class="bfill idle" id="bfill"></div></div>
    <div class="bsub" id="bsub">กำลังเริ่ม…</div>
  </div></div>
  <div id="drop"></div>
</div>
<div id="gutter" title="ลากเพื่อปรับความกว้าง · ดับเบิลคลิกเพื่อคืนค่าอัตโนมัติ"></div>
<div id="side"><div id="sum"></div></div>
</div>

<footer>
  <span id="state">ยังไม่ได้เปิดไฟล์</span>
  <span class="sp"></span>
  <span class="mono" id="meta"></span>
</footer>
<div id="toast"></div>

<div id="modal">
  <div class="sheet">
    <h3><span id="mtitle">ส่งขอโค้ด</span><button class="x" id="mclose">&times;</button></h3>
    <div class="sbody" id="mbody"></div>
    <div class="sfoot" id="mfoot"></div>
  </div>
</div>

<script>
/* ---- APP_META: แหล่งความจริงเดียวของเวอร์ชัน · แสดงบนหัวแอปและชื่อแท็บ ---- */
const APP_META = {
  name: "ReCheck Bom",
  version: "5.7",

  changelog: [

const $ = id => document.getElementById(id);
const BLANK = "\u0000<ว่าง>";   // ค่าภายในสำหรับกรองแถวที่ช่องนั้นว่าง ไม่เอาไปใส่ใน HTML
const norm = s => String(s).toLowerCase().replace(/[\s_\-.]/g, "");
const esc = v => String(v).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const blank = v => String(v ?? "").trim() === "";
const isNum = v => !blank(v) && /^-?[\d.,]+$/.test(String(v).trim()) && !isNaN(String(v).replace(/,/g, ""));

/* ───────── สถานะของสองแท็บ · single source of truth ─────────
   แต่ละแท็บถือข้อมูลของตัวเองครบ สลับแท็บแล้วค่าค้นหา/เรียง/กรอง ไม่หายไป */
const TABS = {

       โค้ดผิวไม่ได้เก็บใน fitting_global ผลจึงเป็นแดงทุกแถวโดยไม่ได้บอกอะไร
       ยังต้องเก็บไว้เพราะเป็นตัวชี้ให้ scanXY และเป็นตัวเทียบตอน recheck */
    noCheck: ["SurfaceBeforeCutTopCode", "SurfaceBeforeCutBottomCode"],
    guess: null,
    cols: [], rows: [], hl: [], file: "", sortCol: -1, sortDir: 1, q: "", only: false, sel: null,
    chk: null, onlyNo: false, paneW: null, src: null, saveAll: false,
    drill: null, drillText: ""
  },
  fit: {
    label: "BOM Fitting",
    want: ["ItemId"],
    noCheck: [],
    /* ยังไม่รู้โครงคอลัมน์ของ BOM Fitting จึงเดาเฉพาะชื่อที่ลงท้ายหรือมีคำว่า code
       ไม่กวาด FittingName / FittingID มาด้วย เพราะนั่นไม่ใช่โค้ดที่ต้องเช็ค
       ถ้าเดาผิด กดปุ่ม "คอลัมน์ที่เน้น" เลือกเองได้ */
    guess: c => /code$|code[^a-z]|^code|รหัส/i.test(String(c).trim()),
    cols: [], rows: [], hl: [], file: "", sortCol: -1, sortDir: 1, q: "", only: false, sel: null,
    chk: null, onlyNo: false, paneW: null, src: null, saveAll: false,
    drill: null, drillText: ""
  }
};
let cur = "wood", view = [];
const T = () => TABS[cur];

/* ───────── ตัวอ่าน CSV/TSV — รองรับคำพูด คอมมาในค่า ขึ้นบรรทัดในเซลล์ ─────────
   (v1.0 เขียนไว้แล้ว ไม่แตะ) */
/* v4.7: จำด้วยว่าเซลล์ไหนในไฟล์ต้นฉบับถูกครอบด้วยเครื่องหมายคำพูด
   เก็บเป็นระดับคอลัมน์ (qcols สำหรับแถวข้อมูล · qhead สำหรับหัวตาราง)
   ตอนบันทึกกลับเป็น CSV จะได้เขียนให้เหมือนไฟล์ที่รับมาเป๊ะ
   ไฟล์จาก imos ครอบไม่ครบทุกช่อง เช่น Qty กับ CutWidth ปล่อยเปล่า
   ถ้าเราครอบให้หมดหรือไม่ครอบเลย ไฟล์จะต่างจากเดิมทั้งไฟล์โดยไม่จำเป็น */
function parseDelimited(text, d){
  text = text.replace(/^\uFEFF/, "");
  const out = [], qcols = [], qhead = [];
  let row = [], cell = "", q = false, i = 0, cq = false;
  const push = () => {
    if (cq) (out.length === 0 ? qhead : qcols)[row.length] = true;
    row.push(cell); cell = ""; cq = false;
  };
  while (i < text.length){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i += 2; continue; } q = false; i++; continue; }
      cell += c; i++; continue;
    }
    if (c === '"'){ q = true; cq = true; i++; continue; }
    if (c === d){ push(); i++; continue; }
    if (c === "\r"){ i++; continue; }
    if (c === "\n"){ push(); out.push(row); row = []; i++; continue; }
    cell += c; i++;
  }
  if (cell !== "" || row.length){ push(); out.push(row); }
  const rows = out.filter(r => r.some(v => String(v).trim() !== ""));
  rows.qcols = qcols; rows.qhead = qhead;
  return rows;
}
function detectDelim(text){
  const first = text.split(/\r?\n/)[0] || "";
  const n = ch => (first.match(new RegExp("\\" + ch, "g")) || []).length;
  const cand = [["\t", n("\t")], [",", n(",")], [";", n(";")], ["|", n("|")]];
  cand.sort((a, b) => b[1] - a[1]);
  return cand[0][1] > 0 ? cand[0][0] : ",";
}

/* ───────── รับข้อมูลเข้าแท็บ ───────── */
/* v3.0: เดาแท็บจากหัวคอลัมน์ — แม่นกว่าเดาจากชื่อไฟล์
   นับว่าหัวตารางตรงกับคอลัมน์ที่แต่ละแท็บต้องการกี่ตัว ใครมากกว่าได้ไป */
function pickTabByContent(cols){
  const set = new Set(cols.map(norm));
  const score = k => TABS[k].want.filter(x => set.has(norm(x))).length;
  const w = score("wood"), f = score("fit");
  if (w > f) return "wood";
  if (f > w) return "fit";
  return cur;
}

function ingest(matrix, name, tab, src){
  if (!matrix.length || matrix[0].length < 2){
    return fail("อ่านไฟล์ไม่ออก",
      "ไม่พบหัวตาราง หรือมีคอลัมน์เดียว ตรวจว่าบรรทัดแรกของไฟล์เป็นหัวตาราง");
  }
  const head = matrix[0].map(h => String(h).trim());
  if (!tab) tab = pickTabByContent(head);
  const t = TABS[tab];
  t.cols = head;
  t.rows = matrix.slice(1).map(r => t.cols.map((_, i) => r[i] ?? ""));
  t.file = name; t.sortCol = -1; t.sortDir = 1; t.q = ""; t.only = false; t.sel = null;
  /* v4.7: จำรูปแบบไฟล์ที่รับมา ใช้ตั้งค่าเริ่มต้นของเมนูบันทึกและเขียน CSV กลับให้เหมือนเดิม */
  t.src = src || { kind: "csv", delim: ",", bom: false, crlf: true, eof: false,
                   qcols: matrix.qcols || [], qhead: matrix.qhead || [] };
  t.saveAll = false;
  t.chk = null; t.onlyNo = false;   // ไฟล์ใหม่ = ผลเช็คเก่าใช้ไม่ได้แล้ว
  t.needCheck = false; t.xy = null; t.onlyEd = false;
  t.drill = null; t.drillText = "";   // v4.9: ไฟล์ใหม่ = ผลเช็คเจาะเก่าใช้ไม่ได้

  const wantSet = new Set(t.want.map(norm));
  t.hl = t.cols.map((c, i) => (wantSet.size && wantSet.has(norm(c))) ? i : -1).filter(i => i >= 0);
  /* v3.0: หาคอลัมน์ที่ระบุไว้ไม่เจอ ค่อยใช้ตัวเดาสำรอง
     แท็บ Fitting ตั้ง want เป็น ItemId ตามไฟล์จริง แต่ถ้าเจอไฟล์คนละแบบ
     ก็ยังเดาคอลัมน์ที่ชื่อมีคำว่า code ให้ ไม่ปล่อยว่างเปล่า */
  if (!t.hl.length && t.guess) t.hl = t.cols.map((c, i) => t.guess(c) ? i : -1).filter(i => i >= 0);

  if (tab === "wood" && !t.hl.length){
    return fail("ไม่พบสามคอลัมน์ที่ต้องเน้น",
      "อ่านได้ " + t.rows.length + " แถว " + t.cols.length + " คอลัมน์ แต่ไม่มีหัวชื่อ " +
      t.want.map(x => "<code>" + x + "</code>").join(" ") +
      "<br><br>หัวที่พบ: <code>" + t.cols.slice(0, 8).map(esc).join("</code> <code>") + "</code>" +
      (t.cols.length > 8 ? " …" : "") +
      "<br><br>ถ้าไฟล์นี้คือ BOM Fitting ให้สลับไปแท็บนั้นก่อนแล้วเปิดใหม่");
  }
  cur = tab;
  syncTabs();
  render();
  /* v3.7: ตั้งธงไว้ แล้วให้ scheduleChecks ไล่เช็คทีละแท็บ
     ลากสองไฟล์พร้อมกัน ingest จะถูกเรียกสองครั้ง ธงจึงติดทั้งคู่ */
  t.needCheck = t.hl.length > 0;
  scheduleChecks();
}

}

/* ───────── กรอง เรียง วาด ───────── */
function apply(){
  const t = T();
  const q = t.q.trim().toLowerCase();
  /* v4.9: แถวที่ถูกแก้มาได้จากสองทาง (แก้ X เป็น Y และเช็คไฟล์เจาะ) รวมเป็นชุดเดียว */
  const edSet = t.onlyEd ? editedRows(t) : null;

  view = t.rows.filter(r => {
    if (t.only && !t.hl.some(i => blank(r[i]))) return false;
    if (t.onlyNo && t.chk && codeState(t, r) !== "no") return false;
    if (edSet && !edSet.has(r)) return false;
    if (t.sel){
      const v = String(r[t.sel.col] ?? "").trim();
      if (t.sel.val === BLANK ? v !== "" : v !== t.sel.val) return false;
    }
    if (q && !r.some(v => String(v).toLowerCase().includes(q))) return false;
    return true;
  });

  if (t.sortCol >= 0){
    const c = t.sortCol, d = t.sortDir;
    view = view.slice().sort((a, b) => {
      const x = a[c], y = b[c];
      if (isNum(x) && isNum(y)) return (parseFloat(String(x).replace(/,/g,"")) - parseFloat(String(y).replace(/,/g,""))) * d;
      return String(x).localeCompare(String(y), "th") * d;
    });
  }
  drawTable(q);
  drawSummary();
}

function drawTable(q){
  const t = T();
  const hi = s => {
    const e = esc(s);
    if (!q) return e;
    const k = e.toLowerCase().indexOf(q.toLowerCase());
    return k < 0 ? e : e.slice(0,k) + "<mark>" + e.slice(k,k+q.length) + "</mark>" + e.slice(k+q.length);
  };
  const ar = i => t.sortCol !== i ? "" : '<span class="ar">' + (t.sortDir > 0 ? "\u25B2" : "\u25BC") + "</span>";
  const HL = new Set(t.hl);

  /* v3.4: ผลเช็คย้ายไปการ์ดข้างบนแล้ว ตารางเหลือคอลัมน์จากไฟล์ล้วน ๆ */
  $("head").innerHTML = '<tr><th class="rn">#</th>' + t.cols.map((c, i) =>
    '<th class="' + (HL.has(i) ? "hl" : "") + '" data-i="' + i + '">' + esc(c) + ar(i) + "</th>").join("") + "</tr>";

  const MAX = 4000;
  const ed = editedRows(t);
  const dcm = t.drill ? t.drill.cells : null;   // v4.9: แถว -> { คอลัมน์: เลขเดิมที่ถูกล้าง }
  $("body").innerHTML = view.slice(0, MAX).map((r, n) => {
    const dc = dcm ? dcm.get(r) : null;
    return '<tr' + (ed && ed.has(r) ? ' class="ed"' : "") + '><td class="rn">' + (n+1) + "</td>" +
      r.map((v, i) => {
      const cls = [];
      const old = dc && dc[i] !== undefined ? dc[i] : null;
      if (HL.has(i)) cls.push(blank(v) ? "miss" : "hl");
      else if (blank(v)) cls.push("e");
      if (isNum(v)) cls.push("n");
      if (old !== null) cls.push("cleared");
      return '<td class="' + cls.join(" ") + '"' +
             (old !== null ? ' title="ล้างแล้ว \u00B7 เดิมคือ ' + esc(old) + ' \u00B7 ไม่มีในไฟล์เจาะ"' : "") +
             ">" + (blank(v) ? "\u2013" : hi(v)) + "</td>";
    }).join("") + "</tr>";
  }).join("");

  $("head").querySelectorAll("th[data-i]").forEach(th => {
    th.onclick = () => {
      const i = +th.dataset.i;
      if (t.sortCol === i) t.sortDir = -t.sortDir; else { t.sortCol = i; t.sortDir = 1; }
      apply();
    };
  });

  $("state").textContent = "แสดง " + Math.min(view.length, MAX).toLocaleString("th-TH") +
    (view.length !== t.rows.length ? " จาก " + t.rows.length.toLocaleString("th-TH") : "") + " แถว" +
    (view.length > MAX ? "  (จำกัด " + MAX.toLocaleString("th-TH") + " แถวเพื่อความลื่น)" : "") +
    (t.sel ? "  \u00B7  กรองที่ " + t.cols[t.sel.col] + " = " +
             (t.sel.val === BLANK ? "(ว่าง)" : t.sel.val) + "  \u2014 คลิกซ้ำเพื่อยกเลิก" : "");
  $("meta").textContent = t.file + "  \u00B7  " + t.cols.length + " คอลัมน์";
}

/* ───────── แผงสรุปค่า (ข้อ 2) ─────────
   ตอบคำถามว่า "คอลัมน์นี้มีค่าอะไรบ้าง อย่างละกี่ชิ้น รวม Qty เท่าไร" */
function qtyIndex(t){
  const i = t.cols.findIndex(c => norm(c) === "qty" || norm(c) === "quantity");
  return i;
}
function drawSummary(){
  const t = T();
  if (!t.hl.length){
    $("sum").innerHTML = ""; $("side").className = ""; $("bar").className = "";
    fitPanes();
    return;
  }
  const qi = qtyIndex(t);

  /* แถบสถิติบรรทัดเดียวด้านบน — ตัวเลขภาพรวมย้ายมาอยู่ตรงนี้แทน
     เพราะในการ์ดเอาออกไปเพื่อเปิดที่ให้ชื่อในระบบ */
  let bar = '<div class="stat"><b>' + t.rows.length.toLocaleString("th-TH") + "</b><i>แถวทั้งหมด</i></div>";
  if (qi >= 0){
    const sq = t.rows.reduce((s, r) => s + (parseFloat(String(r[qi]).replace(/,/g,"")) || 0), 0);
    bar += '<div class="stat"><b>' + sq.toLocaleString("th-TH") + "</b><i>รวม Qty</i></div>";
  }
  const chk = new Set(checkCols(t));
  t.hl.forEach(i => {
    const miss = t.rows.filter(r => blank(r[i])).length;
    const uniq = new Set(t.rows.map(r => String(r[i]).trim()).filter(v => v !== "")).size;
    bar += '<div class="stat"><b class="' + (miss ? "bad" : "hl") + '">' + uniq + " ค่า" +
           (miss ? "  \u00B7  ว่าง " + miss : "") + "</b><i>" + esc(t.cols[i]) +
           (chk.has(i) ? "" : "  \u00B7  ไม่ได้เช็ค") + "</i></div>";
  });
  if (t.chk){
    bar += '<div class="stat"><b><span style="color:#1e6b38">' + t.chk.found +
           ' มี</span> <span style="color:var(--miss-ink)">' + t.chk.missing.length +
           ' ยังไม่มี</span></b><i>เช็คกับ fitting_global</i></div>';
  }
  $("bar").className = "on"; $("bar").innerHTML = bar;

  /* การ์ดต่อคอลัมน์ที่เน้น — ค่า | มีโค้ด? | ชื่อในระบบ
     v4.0: ตัดจำนวนแถวกับเปอร์เซ็นต์ออก เอาที่ไปให้ชื่อในระบบจาก Supabase */
  /* v4.2: ทำการ์ดเฉพาะคอลัมน์ที่เอาไปเช็คจริง
     โค้ดผิวไม่ได้อยู่ใน fitting_global การ์ดจึงเป็นแดงเปล่า ๆ ไม่ได้บอกอะไร */
  const cards = checkCols(t);
  if (!cards.length){ $("sum").innerHTML = ""; $("side").className = ""; fitPanes(); return; }
  $("side").className = "on";
  $("sum").innerHTML = cards.map(ci => {
    const vals = new Set();
    let blanks = 0;
    t.rows.forEach(r => {
      const v = String(r[ci] ?? "").trim();
      if (v) vals.add(v); else blanks++;
    });
    const list = [...vals].sort();
    let nYes = 0, nNo = 0;
    if (t.chk) list.forEach(v => t.chk.map.has(v) ? nYes++ : nNo++);

    const row = v => {
      const rec = t.chk ? t.chk.map.get(v) : null;
      const has = t.chk ? !!rec : null;
      const on = t.sel && t.sel.col === ci && t.sel.val === v;
      return '<div class="vrow ' + (has === null ? "" : has ? "yes" : "no") + (on ? " sel" : "") +
        '" data-c="' + ci + '" data-v="' + esc(v) + '">' +
        '<span class="v">' + esc(v) + "</span>" +
        '<span class="st' + (has === null ? " wait" : "") + '">' +
          (has === null ? "\u2013" : has ? "\u2713 มีโค้ด" : "\u2715 ยังไม่มี") +
          /* v4.5: หน่วยมาต่อท้ายสถานะ แทนที่จะกินบรรทัดสีเทาอีกบรรทัด */
          (has && rec.unit ? ' <b class="u">' + esc(rec.unit) + "</b>" : "") + "</span>" +
        /* v4.5: ตัดบรรทัดสีเทาใต้ชื่อออก search_name ซ้ำกับ product_name แทบทุกแถว
           เก็บไว้ใน title เผื่อวันไหนมันต่างกันจริง เอาเมาส์ชี้แล้วเห็น */
        '<span class="nm"' + (has && rec.search_name ? ' title="' + esc(rec.search_name) + '"' : "") + ">" +
          (has ? esc(rec.product_name || "\u2013")
               : has === false ? "ยังไม่มีในระบบ" : "ยังไม่ได้เช็ค") +
        "</span></div>";
    };

    const blankRow = blanks
      ? '<div class="vrow no' +
        (t.sel && t.sel.col === ci && t.sel.val === BLANK ? " sel" : "") +
        '" data-c="' + ci + '" data-blank="1">' +
        '<span class="v none">(ว่าง)</span><span class="st">\u2715 ไม่มีค่า</span>' +
        '<span class="nm">' + blanks + " แถวไม่ได้กรอกค่านี้</span></div>"
      : "";

    return '<div class="sumcard"><h3><span>' + esc(t.cols[ci]) + "</span><em>" +
      list.length + " ค่า" +
      (t.chk ? "  \u00B7  <i>" + nYes + " มี</i>  \u00B7  <u>" + nNo + " ยังไม่มี</u>" : "") +
      "</em></h3>" + blankRow + list.map(row).join("") + "</div>";
  }).join("");

  fitPanes();

  $("sum").querySelectorAll(".vrow").forEach(el => {
    el.onclick = () => {
      /* v4.0: แถว (ว่าง) ใช้ธง data-blank เพราะอักขระ NUL ใน attribute
         โดน HTML parser แปลงเป็น U+FFFD ทำให้เทียบค่าไม่ตรงแล้วกรองได้ 0 แถว */
      const c = +el.dataset.c, v = el.dataset.blank ? BLANK : el.dataset.v;
      t.sel = (t.sel && t.sel.col === c && t.sel.val === v) ? null : { col: c, val: v };
      apply();
    };
  });
}

/* ═══════════════════════════════════════════════════════════════
   ความกว้างสองฝั่ง (v4.3)
   เดิมล็อกฝั่งขวาไว้ 44% ตายตัว แท็บ Fitting มี 4 คอลัมน์
   ตารางซ้ายเลยเหลือที่ว่างครึ่งจอ ส่วนชื่อสินค้าฝั่งขวาต้องตัดบรรทัด
   -> ประมาณความกว้างที่ตารางต้องใช้จริงจากความยาวข้อความในคอลัมน์
      แล้วยกที่เหลือให้ฝั่งขวา · ลากเส้นกลางปรับเองได้ถ้าไม่ถูกใจ
   ═══════════════════════════════════════════════════════════════ */
const CH = 6.6;           // ความกว้างต่อตัวอักษรโดยประมาณของ IBM Plex Mono 11px (v4.6)
const PAD = 16;           // ระยะขอบซ้ายขวาในเซลล์ + เส้นคั่น (v4.6: padding ลดเหลือ 7px)
const RN = 38;            // คอลัมน์เลขแถว

function estTableWidth(t){
  if (!t.cols.length) return 0;
  const sample = t.rows.slice(0, 250);
  let w = RN;
  t.cols.forEach((c, i) => {
    let len = String(c).length;
    for (const r of sample){
      const L = String(r[i] ?? "").length;
      if (L > len) len = L;
    }
    w += Math.min(len, 42) * CH + PAD;
  });
  return Math.round(w);
}

function fitPanes(){
  const t = T();
  const g = $("gutter"), side = $("side"), wrap = $("wrap");
  const showSide = side.className.indexOf("on") >= 0;
  g.className = showSide ? "on" : "";
  if (!showSide){                     // ไม่มีฝั่งขวา ตารางกินเต็มจอ
    wrap.className = "solo"; wrap.style.width = "";
    return;
  }
  wrap.className = "";
  const total = document.getElementById("main").clientWidth || window.innerWidth || 1200;
  const GW = 7;                       // ความกว้างเส้นแบ่ง ต้องหักด้วย ไม่งั้นฝั่งขวาเหลือน้อยกว่าขั้นต่ำ
  const cap = total - 320 - GW;       // ซ้ายกว้างได้มากสุดเท่าไรโดยขวายังเหลือ 320
  if (t.paneW){                       // ผู้ใช้ลากเองไว้ เคารพค่านั้น
    wrap.style.width = Math.min(Math.max(t.paneW, 280), cap) + "px";
    return;
  }
  const want = estTableWidth(t);
  wrap.style.width = Math.min(Math.max(want, 300), Math.round(total * 0.62), cap) + "px";
}

/* ลากเส้นกลาง */
(function(){
  const g = $("gutter");
  let dragging = false;
  const move = e => {
    if (!dragging) return;
    const box = document.getElementById("main").getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - box.left;
    T().paneW = Math.round(x);
    fitPanes();
    e.preventDefault();
  };
  const up = () => {
    if (!dragging) return;
    dragging = false;
    g.classList.remove("drag");
    document.body.classList.remove("resizing");
  };
  g.addEventListener("mousedown", e => {
    dragging = true; g.classList.add("drag");
    document.body.classList.add("resizing"); e.preventDefault();
  });
  g.addEventListener("touchstart", e => { dragging = true; g.classList.add("drag"); }, { passive: true });
  document.addEventListener("mousemove", move);
  document.addEventListener("touchmove", move, { passive: false });
  document.addEventListener("mouseup", up);
  document.addEventListener("touchend", up);
  g.addEventListener("dblclick", () => { T().paneW = null; fitPanes(); });
})();
window.addEventListener("resize", () => fitPanes());

/* ───────── รับไฟล์ ─────────
   ลากมาสองไฟล์พร้อมกัน -> เดาจากชื่อไฟล์ว่าอันไหนคือ fitting
   เดาไม่ออกก็ใส่ไม้ก่อนแล้ว fitting ตามลำดับ */
/* v3.1: คืนคำใบ้จากชื่อไฟล์เท่านั้น ไม่ตัดสินเอง — ตัวตัดสินจริงคือหัวคอลัมน์
   (item = BOM ไม้ ตามที่โปรแกรม Export Ax ตั้งชื่อมา) */
function guessTab(name){
  const n = norm(name);
  if (/fitting|hardware|accessor|อุปกรณ/.test(n)) return "fit";
  if (/item|wood|board|part|ไม/.test(n)) return "wood";
  return null;
}
/* v3.1: อ่านไฟล์เป็น Promise คืนตารางดิบ ยังไม่ตัดสินว่าเข้าแท็บไหน */
function readMatrix(f){
  return new Promise((res, rej) => {
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("อ่านไฟล์ไม่ได้"));
    if (ext === "xlsx" || ext === "xls"){
      if (typeof XLSX === "undefined")
        return rej(new Error("ตัวอ่าน .xlsx โหลดจากอินเทอร์เน็ตไม่สำเร็จ"));
      fr.onload = e => {
        try{
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
          const sh = wb.Sheets[wb.SheetNames[0]];
          res({ name: f.name, m: XLSX.utils.sheet_to_json(sh, { header: 1, raw: false, defval: "" }),
                src: { kind: "xlsx" } });
        }catch(err){ rej(err); }
      };
      fr.readAsArrayBuffer(f);
    } else {
      /* v4.7: อ่านเป็นไบต์เพื่อดูว่าไฟล์มี BOM ไหม (readAsText กลืน BOM ไปเงียบ ๆ)
         แล้วเก็บลายเซ็นของไฟล์ไว้ให้ตอนบันทึกเขียนกลับได้เหมือนเดิม */
      fr.onload = e => {
        const buf = new Uint8Array(e.target.result);
        const bom = buf[0] === 0xEF && buf[1] === 0xBB && buf[2] === 0xBF;
        let x;
        try{ x = new TextDecoder("utf-8").decode(buf); }
        catch(_){ x = String.fromCharCode.apply(null, buf); }
        const d = detectDelim(x);
        const m = parseDelimited(x, d);
        res({ name: f.name, m, src: {
          kind: "csv", delim: d, bom,
          crlf: /\r\n/.test(x),
          eof: /[\r\n]$/.test(x),
          qcols: m.qcols || [], qhead: m.qhead || []
        }});
      };
      fr.readAsArrayBuffer(f);
    }
  });
}

/* คะแนนความเข้ากันของหัวตารางกับแต่ละแท็บ */
function tabScore(head, k){
  const set = new Set(head.map(norm));
  return TABS[k].want.filter(x => set.has(norm(x))).length;
}

/* v3.1: อ่านให้ครบก่อน แล้วค่อยแบ่งแท็บ
   เดิมเดาจากชื่อไฟล์ทีละตัว ทำให้ export_item_... กับ export_fitting_...
   วิ่งเข้าแท็บเดียวกันทั้งคู่ ตัวหลังทับตัวแรก */
async function takeFiles(list){
  const fs = [...list].slice(0, 2);
  if (!fs.length) return;

  busyStart("กำลังเตรียมข้อมูล");
  busyRun("read", fs.map(f => f.name).join("  \u00B7  "));

  let got;
  try{
    got = await Promise.all(fs.map(readMatrix));
  }catch(e){
    busyClose();
    return fail("เปิดไฟล์ไม่สำเร็จ", esc(e.message) +
      "<br><br>ถ้าเป็นไฟล์ Excel ลอง <b>Save As \u2192 CSV UTF-8</b> แล้วลากไฟล์นั้นมาแทน " +
      "หรือคัดลอกทั้งตารางแล้วกด <b>Ctrl+V</b>");
  }

  got.forEach(g => {
    const head = (g.m[0] || []).map(h => String(h).trim());
    g.w = tabScore(head, "wood");
    g.f = tabScore(head, "fit");
    g.hint = guessTab(g.name);          // ชื่อไฟล์เป็นแค่ตัวช่วยตัดสินเวลาคะแนนเท่ากัน
  });

  busyDone("read", fs.length + " ไฟล์");
  busyRun("split");

  if (got.length === 1){
    const g = got[0];
    const t = g.w > g.f ? "wood" : g.f > g.w ? "fit" : (g.hint || cur);
    ingest(g.m, g.name, t, g.src);
    busyDone("split", TABS[t].label + "  \u00B7  " + TABS[t].rows.length + " แถว");
    return;
  }

  /* สองไฟล์: ให้คนที่เหมาะกับ wood มากกว่าไปอยู่ wood อีกคนไป fit */
  const [a, b] = got;
  const aWood = (a.w - a.f) + (a.hint === "wood" ? .5 : a.hint === "fit" ? -.5 : 0);
  const bWood = (b.w - b.f) + (b.hint === "wood" ? .5 : b.hint === "fit" ? -.5 : 0);
  const first = aWood >= bWood ? a : b, second = aWood >= bWood ? b : a;
  ingest(first.m,  first.name,  "wood", first.src);
  ingest(second.m, second.name, "fit",  second.src);
  cur = "wood"; syncTabs(); render();
  busyDone("split", "BOM ไม้ " + TABS.wood.rows.length + "  \u00B7  Fitting " + TABS.fit.rows.length + " แถว");
}

/* คัดลอกโค้ดไม่ซ้ำ — เตรียมวางลงช่อง "วางจาก Excel" ของแอปส่งตั้ง Code AX */
$("copy").onclick = () => {
  const t = T();
  const set = new Set();
  t.hl.forEach(i => t.rows.forEach(r => { const v = String(r[i]).trim(); if (v) set.add(v); }));
  const txt = [...set].sort().join("\n");
  if (!txt) return toast("ไม่มีโค้ดให้คัดลอก");
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(() => toast("คัดลอก " + set.size + " โค้ดแล้ว — วางในแอปส่งตั้ง Code AX ได้เลย"))
    .catch(() => {
      const ta = document.createElement("textarea");
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast("คัดลอก " + set.size + " โค้ดแล้ว"); }
      catch(_){ toast("คัดลอกไม่สำเร็จ"); }
      ta.remove();
    });
};

/* ───────── ส่งออกเป็น .xlsx (v3.1) — ไฟล์นำเข้าเป็น xlsx อยู่แล้ว
   ถ้าตัวเขียนโหลดไม่ได้ (เครื่องออกเน็ตไม่ได้) ตกไปเป็น CSV ให้อัตโนมัติ */

   เดิม (v3.2-v4.5) ต่อท้ายสามคอลัมน์ผลเช็ค แต่ปลายทางต้องการโครงเดิม
   ผลเช็คดูได้จากการ์ดฝั่งขวาอยู่แล้ว ไม่ต้องติดไปกับไฟล์ */
function exportRows(t){

/* ───────── เขียน CSV โดยยึดรูปแบบไฟล์ต้นฉบับ (v4.7) ─────────
   ตัวคั่น · การครอบคำพูดรายคอลัมน์ · BOM · CRLF · มีบรรทัดว่างท้ายไฟล์ไหม
   ไฟล์ที่ได้จึงต่างจากไฟล์ที่เปิดมาเฉพาะช่องที่แก้จริง เทียบ diff ได้สบาย
   ถ้าต้นทางเป็น .xlsx ไม่มีรูปแบบให้ยึด ใช้ค่ามาตรฐาน + BOM ให้ Excel อ่านไทยไม่เพี้ยน */
function toCSV(t, head, body){
  const s = t.src && t.src.kind === "csv" ? t.src : null;
  const d = (s && s.delim) || ",";
  const eol = (!s || s.crlf !== false) ? "\r\n" : "\n";
  const qc = (s && s.qcols) || [], qh = (s && s.qhead) || [];
  const cell = (v, forced) => {
    const x = String(v ?? "");
    return (forced || x.indexOf(d) >= 0 || x.indexOf('"') >= 0 || /[\r\n]/.test(x))
      ? '"' + x.replace(/"/g, '""') + '"' : x;
  };
  const line = (r, mask) => r.map((v, i) => cell(v, !!mask[i])).join(d);
  const text = [line(head, qh)].concat(body.map(r => line(r, qc))).join(eol);
  return (s ? (s.bom ? "\uFEFF" : "") : "\uFEFF") + text + (s && s.eof ? eol : "");
}

function download(name, blob){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* fmt: "csv" | "xlsx" — ถ้าไม่ส่งมา ใช้รูปแบบเดียวกับไฟล์ที่เปิด */
function saveFile(fmt){
  const t = T();
  if (!t.rows.length) return;
  fmt = fmt || (t.src && t.src.kind === "csv" ? "csv" : "xlsx");
  const { head: xh, body: xb } = exportRows(t);
  const base = (t.file.replace(/\.[^.]+$/, "") || t.label) + "_Pass";
  const n = xb.length.toLocaleString("th-TH");

  if (fmt === "xlsx"){
    if (typeof XLSX === "undefined"){
      toast("ตัวเขียน .xlsx โหลดไม่ได้ บันทึกเป็น .csv แทน");
      fmt = "csv";
    } else {
      try{
        const ws = XLSX.utils.aoa_to_sheet([xh, ...xb]);
        ws["!cols"] = xh.map((c, i) => ({
          wch: Math.min(38, Math.max(String(c).length + 2,
               ...xb.slice(0, 300).map(r => String(r[i] ?? "").length + 2)))
        }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, t.label.slice(0, 28));
        XLSX.writeFile(wb, base + ".xlsx");
        return toast("บันทึก " + n + " แถวเป็น .xlsx แล้ว");
      }catch(e){
        toast("เขียน .xlsx ไม่สำเร็จ บันทึกเป็น .csv แทน");
        fmt = "csv";
      }
    }
  }

  const ext = t.src && t.src.kind === "csv" && t.src.delim === "\t" ? ".tsv" : ".csv";
  download(base + ext, new Blob([toCSV(t, xh, xb)], { type: "text/csv;charset=utf-8" }));
  toast("บันทึก " + n + " แถวเป็น " + ext + " แล้ว");
}

/* ═══════════════════════════════════════════════════════════════
   แก้ X เป็น Y  (v3.1)
   กฎ: ค่าที่ขึ้นต้นด้วย G และลงท้ายด้วย X  ->  เปลี่ยนตัวท้ายเป็น Y
       เช่น G01M0234X -> G01M0234Y
   ดูเฉพาะคอลัมน์ที่เน้นอยู่ ไม่ไล่ทั้งตาราง
   CutRiteMaterialCode เป็นค่าที่ประกอบจากโค้ดผิว (PB19 + top + bottom)
   จึงให้เลือกได้ว่าจะให้อัปเดตตามไปด้วยไหม
   ═══════════════════════════════════════════════════════════════ */
const RE_GX = /^G[0-9A-Za-z]*X$/;
const toY = v => v.slice(0, -1) + "Y";

/* หา index ของคอลัมน์จากชื่อ (ไม่สนตัวพิมพ์/ช่องว่าง/ขีด) */
function colIdx(t, name){ return t.cols.findIndex(c => norm(c) === norm(name)); }

/* คอลัมน์ผิวที่ใช้เป็นตัวชี้ — เก็บ X ไว้ตามเดิม ไม่ถูกแก้ */
function surfaceCols(t){
  return ["SurfaceBeforeCutTopCode", "SurfaceBeforeCutBottomCode"]
    .map(n => colIdx(t, n)).filter(i => i >= 0);
}

/* ═══════════════════════════════════════════════════════════════
   แก้ X เป็น Y  (v3.3) — เฉพาะคอลัมน์ CutRiteMaterialCode
   ค่าในนั้นคือ prefix + โค้ดผิวบน + โค้ดผิวล่าง เช่น
       PB19 + G01M0234X + G01M0234X  ->  PB19G01M0234XG01M0234X
   จึงขึ้นต้นด้วย PB/MD ไม่ใช่ G กฎ "ขึ้นต้น G ลงท้าย X" ใช้กับตัวเต็มไม่ได้
   -> อ่านค่าจากสองคอลัมน์ผิวของแถวนั้น ตัวไหนเข้ากฎ G...X ก็เอาไปแทนใน
      material code ตรง ๆ ไม่ต้องเดาว่าโค้ดยาวกี่ตัว
   สองคอลัมน์ผิวไม่ถูกแตะ เก็บ X ไว้ใช้ recheck ว่าแถวไหนเคยแก้
   ═══════════════════════════════════════════════════════════════ */
function scanXY(t){
  const mat = colIdx(t, "CutRiteMaterialCode");
  if (mat < 0) return { mat: -1, hits: [], cells: 0 };

  const surf = surfaceCols(t);
  const byPair = new Map();           // "from\u0000to" -> { from, to, rows[], src:Set }
  let cells = 0;

  t.rows.forEach((r, ri) => {
    const cur = String(r[mat] ?? "").trim();
    if (!cur) return;
    let next = cur;
    const used = [];

    if (surf.length){
      surf.forEach(si => {
        const sv = String(r[si] ?? "").trim();
        if (!RE_GX.test(sv)) return;
        if (!next.includes(sv)) return;
        next = next.split(sv).join(toY(sv));
        used.push(t.cols[si]);
      });
    }
    /* ไม่มีคอลัมน์ผิว หรือแทนแล้วไม่เปลี่ยน — ลองกฎเดิมกับตัวค่าเต็ม */
    if (next === cur && RE_GX.test(cur)){ next = toY(cur); used.push("(ค่าเต็ม)"); }
    if (next === cur) return;

    cells++;
    const k = cur + "\u0000" + next;
    if (!byPair.has(k)) byPair.set(k, { from: cur, to: next, rows: [], src: new Set() });
    const o = byPair.get(k);
    o.rows.push(ri);
    used.forEach(u => o.src.add(u));
  });

  const hits = [...byPair.values()].sort((a, b) => b.rows.length - a.rows.length);
  return { mat, hits, cells };
}

/* v4.1: แยกการลงมือแก้ออกมา จะได้เรียกได้ทั้งอัตโนมัติตอนอัปโหลด
   และตอนกดปุ่ม · เก็บของเดิมไว้เพื่อย้อนกลับได้ */
function applyXY(t){
  const { mat, hits } = scanXY(t);
  if (mat < 0 || !hits.length) return 0;
  const undo = [];
  /* v4.4: เก็บเป็น reference ของแถว ไม่ใช่เลขลำดับ
     ไฮไลต์จะได้ติดไปกับแถวแม้จะเรียงใหม่หรือกรอง */
  const marked = new Set();
  let n = 0;
  hits.forEach(h => h.rows.forEach(ri => {
    undo.push([ri, t.rows[ri][mat]]);
    marked.add(t.rows[ri]);
    t.rows[ri][mat] = h.to; n++;
  }));
  t.xy = { col: mat, undo, rows: marked, at: new Date(), n,
           hits: hits.map(h => [h.from, h.to, h.rows.length]) };
  t.sel = null;
  return n;
}
function undoXY(t){
  if (!t.xy) return 0;
  const { col, undo } = t.xy;
  undo.forEach(([ri, v]) => { t.rows[ri][col] = v; });
  const n = undo.length;
  t.xy = null; t.sel = null;
  if (!t.drill) t.onlyEd = false;   // v4.9: ยังมีผลเช็คเจาะอยู่ ก็คงตัวกรองไว้
  return n;
}

function syncFixBtn(){
  const t = T();
  const btn = $("fixxy"), un = $("undoxy"), oe = $("onlyed");
  un.style.display = "none"; oe.style.display = "none";
  if (!t.rows.length){ btn.disabled = true; btn.textContent = "แก้ X เป็น Y"; return; }
  const { mat, cells } = scanXY(t);
  if (mat < 0){
    btn.disabled = true;
    btn.textContent = "ไม่มี CutRiteMaterialCode";
    btn.title = "แท็บนี้ไม่มีคอลัมน์ CutRiteMaterialCode จึงไม่มีอะไรให้แก้";
    return;
  }
  /* v4.1: แก้ให้อัตโนมัติตอนอัปโหลดแล้ว ปุ่มจึงกลายเป็นตัวบอกผล + ย้อนกลับ */
  if (t.xy){
    btn.disabled = false;
    btn.textContent = "\u2713 แก้ X เป็น Y แล้ว " + t.xy.n + " แถว";
    btn.title = "คลิกเพื่อดูว่าแก้อะไรไปบ้าง";
    un.style.display = "";
    un.textContent = "ย้อนกลับ";
    oe.style.display = "";
    oe.setAttribute("aria-pressed", String(!!t.onlyEd));
    return;
  }
  btn.title = "แก้เฉพาะ CutRiteMaterialCode \u00B7 สองคอลัมน์ผิวเก็บ X ไว้เป็นตัวเทียบ";
  btn.disabled = cells === 0;
  btn.textContent = cells ? "แก้ X เป็น Y (" + cells + ")" : "ไม่มี X ให้แก้";
}

/* ═══════════════════════════════════════════════════════════════
   เช็คไฟล์เจาะ  (v4.9)
   ปัญหา: ไฟล์ BOM ใส่เลขในช่อง Barcode มาทุกแถว แต่ของจริงบางชิ้นไม่มีเจาะ
          และบางชิ้นเจาะอยู่หน้าที่สอง ซึ่งเลขจะไปอยู่ช่อง Barcode2
   วิธี  : วางเลข Barcode ทั้งหมดจากไฟล์เจาะเข้ามา แล้วยึดกฎเดียว
          "ช่องไหนเลขไม่อยู่ในรายการ = ชิ้นนั้นหน้านั้นไม่มีเจาะ ล้างเป็นว่าง"
          กฎเดียวนี้ครอบทั้งสองเคส เจาะอยู่ Barcode2 อย่างเดียว
          ก็คือ Barcode ถูกล้าง เหลือแต่ Barcode2 ตามที่ต้องการ
   หมายเหตุ: แถวที่ Barcode เป็นคำว่า Manual ไม่ใช่เลข ตั้งค่าเริ่มต้นให้ข้ามไว้
   ═══════════════════════════════════════════════════════════════ */

/* คู่คอลัมน์บาร์โค้ด — ไม่เจอคืน -1 */
function drillCols(t){
  return { b1: colIdx(t, "Barcode"), b2: colIdx(t, "Barcode2") };
}

/* แยกข้อความที่วางมาเป็นรายการเลข · รับทั้งขึ้นบรรทัด เว้นวรรค คอมมา แท็บ
   เอาเฉพาะตัวเลข 6 หลักขึ้นไปก่อน ถ้าไม่เจอเลยค่อยรับทุกคำ (เผื่อรูปแบบอื่น) */
function parseDrillList(text){
  const tok = String(text || "").split(/[\s,;|]+/).map(v => v.trim()).filter(Boolean);
  const num = tok.filter(v => /^\d{6,}$/.test(v));
  const use = num.length ? num : tok;
  return { codes: new Set(use), read: use.length, skipped: tok.length - use.length };
}

/* ดูว่าถ้าใช้รายการนี้ จะล้างช่องไหนบ้าง — ยังไม่แก้ข้อมูลจริง */
function scanDrill(t, set, keepManual){
  const { b1, b2 } = drillCols(t);
  const plan = { b1, b2, cut: [], keep1: 0, keep2: 0, manual: 0, rows: 0,
                 hit: new Set(), suspect: [] };
  if (b1 < 0 && b2 < 0) return plan;

  /* v5.3: ชิ้นที่มีร่อง (groove) ต้องขึ้นเครื่อง CNC อยู่แล้ว
     ถ้าหาไฟล์เจาะของชิ้นนั้นไม่เจอเลย แปลว่าไฟล์อาจยังไม่ถูกทำ ไม่ใช่ว่าไม่มีเจาะ */
  const gcs = t.cols.map((c, i) => /^groove/i.test(String(c).trim()) ? i : -1).filter(i => i >= 0);
  const hasGroove = r => gcs.some(i => {
    const v = String(r[i] ?? "").trim();
    return v && !/^nogroove$/i.test(v) && v !== "0";
  });

  t.rows.forEach((r, ri) => {
    let touched = false, kept = 0;
    [b1, b2].forEach(ci => {
      if (ci < 0) return;
      const v = String(r[ci] ?? "").trim();
      if (!v) return;
      if (keepManual && !/^\d+$/.test(v)){ plan.manual++; kept++; return; }
      if (set.has(v)){
        plan.hit.add(v);
        kept++;
        if (ci === b1) plan.keep1++; else plan.keep2++;
        return;
      }
      plan.cut.push([ri, ci, v]);
      touched = true;
    });
    if (touched) plan.rows++;
    if (touched && !kept && hasGroove(r)) plan.suspect.push(ri);
  });

  /* เลขในไฟล์เจาะที่หาไม่เจอในไฟล์ BOM — สัญญาณว่าสองไฟล์คนละชุดกัน */
  plan.orphan = [...set].filter(c => !plan.hit.has(c));
  return plan;
}

/* ลงมือล้าง · เก็บของเดิมไว้ย้อนกลับได้ และจำว่าช่องไหนถูกล้างเพื่อไฮไลต์ */
function applyDrill(t, plan, meta){
  const cells = new Map();      // reference ของแถว -> { คอลัมน์: เลขเดิม }
  const marked = new Set();
  plan.cut.forEach(([ri, ci, v]) => {
    const row = t.rows[ri];
    if (!cells.has(row)) cells.set(row, {});
    cells.get(row)[ci] = v;
    marked.add(row);
    row[ci] = "";
  });
  t.drill = {
    undo: plan.cut.slice(), cells, rows: marked, at: new Date(),
    n: plan.cut.length, nrows: plan.rows,
    b1: plan.b1, b2: plan.b2,
    cut1: plan.cut.filter(c => c[1] === plan.b1).length,
    cut2: plan.cut.filter(c => c[1] === plan.b2).length,
    keep1: plan.keep1, keep2: plan.keep2, manual: plan.manual,
    codes: meta.read, from: meta.from || "", orphan: plan.orphan.slice()
  };
  t.sel = null;
  return t.drill.n;
}

function undoDrill(t){
  if (!t.drill) return 0;
  t.drill.undo.forEach(([ri, ci, v]) => { t.rows[ri][ci] = v; });
  const n = t.drill.n;
  t.drill = null; t.sel = null;
  if (!t.xy) t.onlyEd = false;
  return n;
}

/* ชุดแถวที่ถูกแก้ รวมทั้งจาก X→Y และจากเช็คเจาะ ใช้ไฮไลต์กับตัวกรอง */
function editedRows(t){
  if (t.xy && t.drill){
    const s = new Set(t.xy.rows);
    t.drill.rows.forEach(r => s.add(r));
    return s;
  }
  if (t.xy) return t.xy.rows;
  if (t.drill) return t.drill.rows;
  return null;
}

const LS_DPATH = "imosviewer_drill_path";
/* พาธเครื่องเจาะที่ใช้ประจำ ใส่ไว้ให้ตั้งแต่แรก แก้ได้ถ้าย้ายเครื่อง */

/* v5.2: ชื่อโฟลเดอร์งานเจาะ = ท่อนท้ายของชื่อไฟล์ BOM
   export_item_2609012001_BO69_0766.xlsx  ->  2609012001_BO69_0766

function jobFolderName(t, bomJobs){
  const base = String(t.file || "").replace(/\.[^.]+$/, "").replace(/_Pass$/i, "");
  const m = base.match(/\d{9,}(?:_[A-Za-z0-9]+)*/);
  if (m) return { name: m[0], from: "ชื่อไฟล์ BOM" };
  /* ชื่อไฟล์ไม่มีเลขงาน ใช้เลขงานจากบาร์โค้ดในไฟล์บอกใบ้แทน (ไม่รู้ท่อนท้าย) */
  if (bomJobs && bomJobs.length) return { name: "", jobs: bomJobs.slice(0, 3) };
  return { name: "" };
}

/* ต่อพาธแบบ Windows ไม่ให้มีแบ็กสแลชซ้อน */
function joinWin(root, sub){
  const r = String(root || "").replace(/[\\/]+$/, "");
  if (!sub) return r;
  return r ? r + "\\" + sub : sub;
}

/* ชื่อไฟล์ -> เลขบาร์โค้ด · ตัดนามสกุลแล้วดึงเฉพาะกลุ่มตัวเลข 6 หลักขึ้นไป */
function codesFromNames(names){
  const out = [], seen = new Set();
  names.forEach(f => {
    const base = String(f && f.n !== undefined ? f.n : f).replace(/\.[^.]+$/, "");
    (base.match(/\d{6,}/g) || []).forEach(c => {
      if (!seen.has(c)){ seen.add(c); out.push(c); }
    });
  });
  return out;
}

/* จัดกลุ่มไฟล์ตามวันที่แก้ไข — ถ้ามีมากกว่าหนึ่งกลุ่ม แปลว่ามีไฟล์ทำคนละวันปนอยู่ */
function timeGroups(files){
  const by = new Map();
  files.forEach(f => {
    if (!f.t) return;
    const k = new Date(f.t).toLocaleDateString("th-TH");
    if (!by.has(k)) by.set(k, { day: k, n: 0, min: f.t, max: f.t });
    const g = by.get(k);
    g.n++;
    if (f.t < g.min) g.min = f.t;
    if (f.t > g.max) g.max = f.t;
  });
  return [...by.values()].sort((a, b) => a.min - b.min);
}
const hhmm = ms => new Date(ms).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });

/* v5.1: เพดานกันเผลอชี้ไปโฟลเดอร์แม่ที่มีเป็นหมื่นไฟล์แล้วค้างยาว
   ถึงเพดานก็หยุดอ่านแล้วเตือน ไม่ปล่อยให้หน้าจอนิ่งจนไม่รู้ว่าเจ๊งหรือยัง */
const SCAN_MAX = 20000;

/* เดินโฟลเดอร์แบบ File System Access API (Chrome/Edge) */
async function walkDirHandle(dir, out, depth, tick){
  for await (const [name, h] of dir.entries()){
    if (out.length >= SCAN_MAX) return;
    if (h.kind === "file"){
      let mt = 0;
      /* เวลาแก้ไขไฟล์คือหลักฐานว่าไฟล์ไหนทำทีหลัง ยอมเสียเวลาถามทีละไฟล์
         เฉพาะตอนไฟล์ไม่เยอะ ถ้าเป็นหมื่นไฟล์ข้ามไป ไม่งั้นรอกันนาน */
      if (out.length < TIME_MAX){
        try{ mt = (await h.getFile()).lastModified || 0; }catch(_){}
      }
      out.push({ n: name, t: mt });
      if (tick && out.length % 100 === 0) await tick(out.length);
    } else if (depth < 4){
      await walkDirHandle(h, out, depth + 1, tick);
    }
  }
}

/* เดินโฟลเดอร์ที่ลากมาวาง (DataTransfer entry) */
async function walkDropEntry(entry, out, depth, tick){
  if (!entry || out.length >= SCAN_MAX) return;
  if (entry.isFile){
    let mt = 0;
    if (out.length < TIME_MAX){
      mt = await new Promise(res =>
        entry.file(f => res(f.lastModified || 0), () => res(0)));
    }
    out.push({ n: entry.name, t: mt });
    if (tick && out.length % 100 === 0) await tick(out.length);
    return;
  }
  if (!entry.isDirectory || depth >= 4) return;
  const rd = entry.createReader();
  const batch = () => new Promise(res => rd.readEntries(res, () => res([])));
  let items;
  while ((items = await batch()).length){
    for (const e of items){
      if (out.length >= SCAN_MAX) return;
      await walkDropEntry(e, out, depth + 1, tick);
    }
  }
}

/* เลขงานคือ 10 ตัวหน้าของบาร์โค้ด 14 หลัก (เช่น 2609012001)
   ใช้เทียบว่าโฟลเดอร์ที่เลือกเป็นงานใบเดียวกับ BOM ที่เปิดอยู่ไหม */
function jobsOf(codes){
  const m = new Map();
  codes.forEach(c => {
    if (String(c).length >= 12){
      const k = String(c).slice(0, 10);
      m.set(k, (m.get(k) || 0) + 1);
    }
  });
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}

   ถ้าจะเปลี่ยนชื่อตารางอีก แก้ที่นี่ที่เดียวพอ */
const DRILL_TABLE = "recheck_drill_scans";

  "create table if not exists public." + DRILL_TABLE + " (\n" +

  ");\n\n" +
  "alter table public." + DRILL_TABLE + "\n" +
  "  add column if not exists job        text,\n" +
  "  add column if not exists machine    text,\n" +
  "  add column if not exists bom_file   text,\n" +
  "  add column if not exists scanned_by text,\n" +
  "  add column if not exists scanned_at timestamptz not null default now(),\n" +
  "  add column if not exists file_count int  not null default 0,\n" +
  "  add column if not exists files      jsonb not null default '{}'::jsonb;\n\n" +
  "create index if not exists " + DRILL_TABLE + "_job_idx\n" +
  "  on public." + DRILL_TABLE + " (job, scanned_at desc);\n\n" +
  "alter table public." + DRILL_TABLE + " enable row level security;\n\n" +
  "drop policy if exists \"anon read " + DRILL_TABLE + "\"  on public." + DRILL_TABLE + ";\n" +
  "drop policy if exists \"anon write " + DRILL_TABLE + "\" on public." + DRILL_TABLE + ";\n" +
  "create policy \"anon read " + DRILL_TABLE + "\"  on public." + DRILL_TABLE + "\n" +
  "  for select to anon using (true);\n" +
  "create policy \"anon write " + DRILL_TABLE + "\" on public." + DRILL_TABLE + "\n" +
  "  for insert to anon with check (true);";

/* ไฟล์เยอะเกินนี้ไม่เก็บรายชื่อขึ้นฐานข้อมูล เก็บแค่จำนวน แถวจะได้ไม่บวม */
const SNAP_FILES_MAX = 5000;

async function drillScanLoad(job, n){
  const client = getSb();
  if (!client) return null;
  const { data, error } = await client
    .from(DRILL_TABLE)
    .select("scanned_at,scanned_by,machine,bom_file,file_count,files")
    .eq("job", job)
    .order("scanned_at", { ascending: false })
